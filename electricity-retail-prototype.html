<script data-section="engine">
/* ============================================================================
   SECTION 6 — engine  (pure functions: no UI, no storage)
   The ONE calculation engine. Quotes and bills both call priceBillingPeriod(); a quote is
   simply twelve billing periods priced over historical interval data.

   Data-driven: which charges a tariff has comes from its TariffComponent rows
     kind DAILY          c/day charge (fixed, metering)
     kind ENERGY         c/kWh per time band, band chosen by interval START time
     kind DEMAND_BANDED  RT6: (fixed for MD's band + rate x (MD - band lower)) x (1 - Discount)
   and every price comes from dated Rate rows, resolved per billing day
   (or as at one date via options.rateAsAt, which is how a quote prices at current rates).

   Demand: kW = kWh / (IntervalLength / 60), kvar likewise from kvarh, kVA = sqrt(kW² + kvar²).
   For intervals shorter than 30 minutes the energy is first summed to the half hour, because the
   tariff uses MAXIMUM HALF-HOURLY demand (for 30-minute data this is exactly the per-interval
   formula). MD on a billing day = highest half-hourly kVA in the 12 months ending that day.
   ============================================================================ */
const engine = (() => {
  'use strict';
  const VERSION = '1.0.0';
  const DEFAULTS = { rateAsAt: null, rateFallback: 'none', mdMode: 'daily', mdWindowMonths: 12, networkOwner: 'WP' };
  const DOW = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6 };
  const DOW_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const bySort = (a, b) => (a.sortOrder || 0) - (b.sortOrder || 0) || String(a.timeBandId || a.componentId || '').localeCompare(String(b.timeBandId || b.componentId || ''));

  // ============================ time bands ==================================================================
  function parseDays(s) {
    const str = String(s == null || s === '' ? 'ALL' : s).toUpperCase().trim();
    if (str === 'ALL') return new Set([0, 1, 2, 3, 4, 5, 6]);
    const set = new Set();
    for (const part of str.split(',')) {
      const p = part.trim(), m = /^([A-Z]{3})-([A-Z]{3})$/.exec(p);
      if (m && m[1] in DOW && m[2] in DOW) { for (let d = DOW[m[1]]; ; d = (d + 1) % 7) { set.add(d); if (d === DOW[m[2]]) break; } }
      else if (p in DOW) set.add(DOW[p]);
    }
    return set;
  }
  const bandMatches = (r, dowSet, dow, hol) => {
    if (!dowSet.has(dow)) return false;
    const h = r.holidays || 'INCLUDE';
    return !(h === 'EXCLUDE' && hol) && !(h === 'ONLY' && !hol);
  };
  /** band lookup tables per (day of week, public holiday?) built lazily; first matching row wins */
  function makeBandResolver(rows) {
    const prepared = rows.slice().sort(bySort).map(r => ({ ...r, dowSet: parseDays(r.days) }));
    const cache = new Map();
    function table(dow, hol) {
      const key = dow * 2 + (hol ? 1 : 0);
      let t = cache.get(key);
      if (!t) {
        t = new Array(1440).fill(null);
        for (const r of prepared) {
          if (!bandMatches(r, r.dowSet, dow, hol)) continue;
          for (let m = Math.max(0, r.startMinute); m < Math.min(1440, r.endMinute); m++) if (t[m] === null) t[m] = r.bandCode;
        }
        cache.set(key, t);
      }
      return t;
    }
    return { bandAt: (dow, hol, minute) => table(dow, hol)[minute], table };
  }
  /** Does every minute of every day type fall in exactly one band? Returns the gaps and overlaps found. */
  function bandCoverage(rows) {
    const prepared = rows.map(r => ({ ...r, dowSet: parseDays(r.days) }));
    const issues = [];
    for (let dow = 0; dow < 7; dow++) {
      for (const hol of [false, true]) {
        const count = new Uint8Array(1440);
        for (const r of prepared) if (bandMatches(r, r.dowSet, dow, hol)) for (let m = Math.max(0, r.startMinute); m < Math.min(1440, r.endMinute); m++) count[m]++;
        for (const [kind, test] of [['gap', c => c === 0], ['overlap', c => c > 1]]) {
          let s = -1;
          for (let m = 0; m <= 1440; m++) {
            const hit = m < 1440 && test(count[m]);
            if (hit && s < 0) s = m;
            if (!hit && s >= 0) { issues.push({ dayType: DOW_NAMES[dow] + (hol ? ' (public holiday)' : ''), kind, fromMin: s, toMin: m }); s = -1; }
          }
        }
      }
    }
    return { ok: issues.length === 0, issues };
  }

  // ============================ rates =====================================================================
  /**
   * Resolves dated Rate rows. A row matches on tariffCode (exact beats '*') and bandCode (exact beats '*'),
   * must be effective on the date, and the latest EffectiveFrom wins. fallback 'latest' assumes the most
   * recent loaded price when none is effective (reported through assumedList()).
   */
  function makeRateBook(rates, { ownerCode = 'WP', tariffCode = null, fallback = 'none' } = {}) {
    const rows = (rates || []).filter(r => r.ownerCode === ownerCode && (!tariffCode || r.tariffCode === tariffCode || r.tariffCode === '*'));
    const cache = new Map(), assumed = new Map();
    const isActive = (r, date) => (!r.effectiveFrom || r.effectiveFrom <= date) && (!r.effectiveTo || r.effectiveTo >= date);
    const score = (r, band) => (r.tariffCode === tariffCode ? 2 : 0) + ((r.bandCode || '') === band ? 1 : 0);
    const better = (a, b, band) => !b || score(a, band) > score(b, band) || (score(a, band) === score(b, band) && (a.effectiveFrom || '') > (b.effectiveFrom || ''));
    function pick(componentCode, bandCode, date) {
      const band = bandCode || '', key = componentCode + '|' + band + '|' + date;
      if (cache.has(key)) return cache.get(key);
      const cands = rows.filter(r => r.componentCode === componentCode && ((r.bandCode || '') === band || r.bandCode === '*'));
      let best = null;
      for (const r of cands) if (isActive(r, date) && better(r, best, band)) best = r;
      let out = best ? { row: best, assumed: false } : null;
      if (!out && fallback === 'latest' && cands.length) {
        let latest = null;
        for (const r of cands) if (!latest || score(r, band) > score(latest, band) || (score(r, band) === score(latest, band) && (r.effectiveFrom || '') > (latest.effectiveFrom || ''))) latest = r;
        out = { row: latest, assumed: true };
        assumed.set(componentCode + '|' + band, latest);
      }
      cache.set(key, out);
      return out;
    }
    function demandBands(date) {
      const codes = Array.from(new Set(rows.filter(r => r.componentCode === 'DEMAND_FIXED' || r.componentCode === 'DEMAND_RATE').map(r => r.bandCode)));
      const out = [];
      for (const code of codes) {
        const f = pick('DEMAND_FIXED', code, date), v = pick('DEMAND_RATE', code, date);
        if (!f || !v) continue;
        out.push({
          bandCode: code, lower: v.row.lowerKva ?? f.row.lowerKva ?? 0, upper: v.row.upperKva ?? f.row.upperKva ?? Infinity,
          fixed: f.row.value, rate: v.row.value, fixedRateId: f.row.rateId, rateId: v.row.rateId, assumed: f.assumed || v.assumed,
        });
      }
      return out.sort((a, b) => a.lower - b.lower);
    }
    const param = (name, date) => { const p = pick('PARAM', name, date); return p ? p.row.value : null; };
    return { pick, demandBands, param, assumedList: () => Array.from(assumed.entries()).map(([k, r]) => ({ key: k, row: r })) };
  }

  // ============================ RT6 demand charge =========================================================
  /** Published band table applied exactly as given (no smoothing): the band holding MD sets the fixed amount. */
  function demandCharge(md, bands) {
    md = Math.max(0, +md || 0);
    if (!bands || !bands.length) return null;
    let band = null;
    for (const b of bands) if (md >= b.lower && md < b.upper) { band = b; break; }
    let extrapolated = false;
    if (!band) { band = md >= bands[bands.length - 1].upper ? bands[bands.length - 1] : bands[0]; extrapolated = md >= band.upper; }
    const variable = band.rate * (md - band.lower);
    return { band, fixed: band.fixed, variable, amount: band.fixed + variable, extrapolated };
  }
  /** MD < 1000: OffPeakShare x DF; 1000 <= MD < 1500: ((1500 - MD) / 500) x OffPeakShare x DF; MD >= 1500: 0 */
  function demandDiscount(md, offPeakShare, p) {
    const share = clamp(+offPeakShare || 0, 0, 1);
    if (md >= p.taperEnd) return 0;
    if (md < p.taperStart) return share * p.DF;
    return ((p.taperEnd - md) / (p.taperEnd - p.taperStart)) * share * p.DF;
  }
  /** One day of RT6 demand charge for a given MD and off-peak share (also used by the visible 300 kVA test). */
  function rt6Daily(md, offPeakShare, bands, p) {
    const dc = demandCharge(md, bands);
    if (!dc) return null;
    const discountRate = demandDiscount(md, offPeakShare, p);
    return { ...dc, md, offPeakShare, discountRate, discountAmount: dc.amount * discountRate, net: dc.amount * (1 - discountRate) };
  }

  // ============================ interval profile ==========================================================
  /**
   * Index interval rows by date and work out the highest half-hourly kVA of every day.
   * consumption = E-suffix rows, reactive = Q/K rows, exports = B rows (information only).
   * Energy in sub-30-minute intervals is summed to the half hour before kW/kvar are derived.
   * Where reactive data is absent for a half hour, kvar = kW x tan(acos(assumedPf)).
   */
  function buildProfile({ consumption = [], reactive = [], exports: exp = [], assumedPf = 0.9 } = {}) {
    const days = new Map();
    const get = date => { let d = days.get(date); if (!d) days.set(date, d = { date, e: [], q: [], b: [], maxKva: 0, pfAssumedSlots: 0, missingSlots: 0 }); return d; };
    for (const r of consumption) get(r.intervalDate).e.push(r);
    for (const r of reactive) get(r.intervalDate).q.push(r);
    for (const r of exp) get(r.intervalDate).b.push(r);
    const tanPf = Math.tan(Math.acos(clamp(assumedPf, 0.01, 1)));
    const addSlots = (acc, mins, r) => {
      if (r.quality === 'N') return;                                // missing data contributes nothing
      const L = r.intervalLength;
      if (L <= 30) { const s = Math.floor(r.startMinute / 30); if (s >= 0 && s < 48) { acc[s] += r.value; mins[s] += L; } }
      else { const n = Math.round(L / 30), s0 = Math.floor(r.startMinute / 30); for (let k = 0; k < n && s0 + k < 48; k++) { acc[s0 + k] += r.value / n; mins[s0 + k] += 30; } }
    };
    let first = null, last = null;
    for (const d of days.values()) {
      if (d.e.length) { if (first === null || d.date < first) first = d.date; if (last === null || d.date > last) last = d.date; }
      const kwh = new Float64Array(48), kvarh = new Float64Array(48), eMin = new Float64Array(48), qMin = new Float64Array(48);
      for (const r of d.e) addSlots(kwh, eMin, r);
      for (const r of d.q) addSlots(kvarh, qMin, r);
      for (let s = 0; s < 48; s++) {
        if (eMin[s] < 29.999) { d.missingSlots++; continue; }
        const kw = kwh[s] * 2;                                      // kWh in 0.5 h -> kW
        let kvar;
        if (qMin[s] >= 29.999) kvar = kvarh[s] * 2; else { kvar = kw * tanPf; d.pfAssumedSlots++; }
        const kva = Math.hypot(kw, kvar);
        if (kva > d.maxKva) d.maxKva = kva;
      }
    }
    return { days, firstDate: first, lastDate: last, hasReactive: reactive.length > 0, assumedPf };
  }

  // ============================ pricing one billing period =================================================
  const mkLine = o => ({ detail: '', ...o });
  const label = (rows, code) => { const r = rows.find(b => b.bandCode === code); return r ? r.label : code; };
  const f1 = n => util.fmtNum(n, 1), f3 = n => util.fmtNum(n, 3);

  /** contiguous runs of days that share one rate row (so a 1 July price change produces two lines) */
  function dailyRuns(days, rateDateOf, pickFn, onMissing) {
    const runs = [];
    let cur = null;
    for (const d of days) {
      const p = pickFn(rateDateOf(d));
      if (!p) { onMissing(d); cur = null; continue; }
      if (cur && cur.pick.row.rateId === p.row.rateId) { cur.to = d; cur.days++; }
      else { cur = { pick: p, from: d, to: d, days: 1 }; runs.push(cur); }
    }
    return runs;
  }

  /**
   * priceBillingPeriod(input) -> { ok, lines[], usage, demand, notices[], totals }
   *  input.period {from,to} inclusive · tariffCode · tariffs[] · components[] · timeBands[] · rates[] (network + retail)
   *  input.holidays Set|array of ISO dates · input.site {assumedPf, meteringService, meteringOtherCents}
   *  input.profile (from buildProfile) OR input.consumption / reactive / exports row arrays
   *  input.retail {offerId, networkMarginPct} | null · input.options (see DEFAULTS)
   * `ok` is false when something prevents a trustworthy price (no data, missing rate, closed tariff…).
   */
  function priceBillingPeriod(input) {
    const opts = { ...DEFAULTS, ...(input.options || {}) };
    const { period, tariffCode } = input;
    const notices = [];
    const note = (level, code, message, detail) => notices.push(detail === undefined ? { level, code, message } : { level, code, message, detail });
    const result = { ok: true, engineVersion: VERSION, period: { ...period }, tariffCode, lines: [], notices, usage: null, demand: null, totals: null };
    const fail = (code, msg) => { note('error', code, msg); result.ok = false; return result; };

    const tariff = (input.tariffs || []).find(t => t.tariffCode === tariffCode);
    if (!tariff) return fail('TARIFF_UNKNOWN', `Network tariff ${tariffCode} is not in the tariff book.`);
    const components = (input.components || []).filter(c => c.tariffCode === tariffCode).sort(bySort);
    const allRates = input.rates || [];
    if (tariff.status === 'closed' && !allRates.some(r => r.ownerCode === opts.networkOwner && r.tariffCode === tariffCode)) {
      return fail('CLOSED_NO_RATES', `${tariffCode} is closed to new nominations (grandfathered) and no rates are loaded for it, so it cannot be priced. Add its rates in the Tariff book.`);
    }
    if (!components.length) return fail('NO_COMPONENTS', `Tariff ${tariffCode} has no charge components defined in the tariff book.`);
    if (!util.isIsoDate(period.from) || !util.isIsoDate(period.to) || period.to < period.from) return fail('BAD_PERIOD', `Invalid billing period ${period.from} to ${period.to}.`);
    if (tariff.status === 'closed') note('info', 'CLOSED_TARIFF', `${tariffCode} is closed to new nominations (grandfathered).`);

    const site = input.site || {};
    const profile = input.profile || buildProfile({ consumption: input.consumption, reactive: input.reactive, exports: input.exports, assumedPf: site.assumedPf || 0.9 });
    const days = util.dateRange(period.from, period.to), nDays = days.length;
    const holidays = input.holidays instanceof Set ? input.holidays : new Set(input.holidays || []);
    const bandRows = (input.timeBands || []).filter(b => b.tariffCode === tariffCode);
    if (!bandRows.length) return fail('NO_TIME_BANDS', `Tariff ${tariffCode} has no time bands defined.`);
    const bandOrder = [];
    for (const b of bandRows.slice().sort(bySort)) if (!bandOrder.includes(b.bandCode)) bandOrder.push(b.bandCode);
    const daysWithData = days.filter(d => { const x = profile.days.get(d); return x && x.e.length; }).length;
    if (!daysWithData) return fail('NO_DATA', `No interval data for ${period.from} to ${period.to}.`);

    const rateDateOf = d => opts.rateAsAt || d;
    const rb = makeRateBook(allRates, { ownerCode: opts.networkOwner, tariffCode, fallback: opts.rateFallback });
    const retail = input.retail && input.retail.offerId ? input.retail : null;
    const rr = retail ? makeRateBook(allRates, { ownerCode: retail.offerId, tariffCode, fallback: opts.rateFallback }) : null;
    const missing = new Map();
    const miss = (what, date) => { let m = missing.get(what); if (!m) missing.set(what, m = { dates: new Set(), first: date }); m.dates.add(date); };

    // ---- bands resolved per date (bands may themselves be effective-dated) ----
    const resolverCache = new Map();
    const resolverFor = date => {
      const act = bandRows.filter(b => (!b.effectiveFrom || b.effectiveFrom <= date) && (!b.effectiveTo || b.effectiveTo >= date));
      const sig = act.map(b => b.timeBandId).join('|');
      let r = resolverCache.get(sig);
      if (!r) resolverCache.set(sig, r = makeBandResolver(act));
      return r;
    };

    // ---- usage by time band, data quality, energy accumulation by rate ----
    const usage = { days: nDays, daysWithData, kwhTotal: 0, kwhByBand: {}, bandOrder, bandLabels: Object.fromEntries(bandOrder.map(c => [c, label(bandRows, c)])), quality: {}, intervalsPresent: 0, intervalsExpected: 0, exportKwh: 0, uncoveredKwh: 0 };
    const energyComp = components.find(c => c.kind === 'ENERGY');
    const accNet = new Map(), accRet = new Map();
    let expectedPerDay = 0;
    for (const date of days) {
      const dd = profile.days.get(date);
      if (!dd) continue;
      const hol = holidays.has(date), dow = util.dow(date), rateDate = rateDateOf(date), resolver = resolverFor(date);
      const netByBand = {}, retByBand = {};
      for (const r of dd.e) {
        usage.quality[r.quality] = (usage.quality[r.quality] || 0) + 1;
        usage.intervalsPresent++;
        const band = resolver.bandAt(dow, hol, r.startMinute);
        if (band == null) { usage.uncoveredKwh += r.value; continue; }
        usage.kwhTotal += r.value;
        usage.kwhByBand[band] = (usage.kwhByBand[band] || 0) + r.value;
        if (energyComp) {
          let p = netByBand[band];
          if (p === undefined) p = netByBand[band] = rb.pick(energyComp.componentCode, band, rateDate);
          if (p) { const key = band + '|' + p.row.rateId; let a = accNet.get(key); if (!a) accNet.set(key, a = { band, pick: p, kwh: 0, from: date, to: date }); a.kwh += r.value; a.to = date; }
          else miss(`${energyComp.label} rate for the ${label(bandRows, band)} band`, date);
        }
        if (rr) {
          let p = retByBand[band];
          if (p === undefined) p = retByBand[band] = rr.pick('RET_ENERGY', band, rateDate);
          if (p) { const key = band + '|' + p.row.rateId; let a = accRet.get(key); if (!a) accRet.set(key, a = { band, pick: p, kwh: 0, from: date, to: date }); a.kwh += r.value; a.to = date; }
          else miss(`retail energy rate for the ${label(bandRows, band)} band (offer ${retail.offerId})`, date);
        }
      }
      for (const r of dd.b) usage.exportKwh += r.value;
      if (dd.e.length) expectedPerDay = Math.max(expectedPerDay, 1440 / dd.e[0].intervalLength);
    }
    // intervals expected = per stream, so count streams with data
    const streamsPerDay = Math.max(1, ...days.map(d => { const x = profile.days.get(d); return x ? new Set(x.e.map(r => r.suffix)).size : 0; }));
    usage.intervalsExpected = nDays * expectedPerDay * streamsPerDay;
    usage.missingIntervals = Math.max(0, usage.intervalsExpected - usage.intervalsPresent) + (usage.quality.N || 0);
    usage.estimatedIntervals = (usage.quality.E || 0) + (usage.quality.S || 0) + (usage.quality.F || 0);
    if (usage.uncoveredKwh > 0) note('error', 'BAND_UNCOVERED', `${f1(usage.uncoveredKwh)} kWh fall in times that no ${tariffCode} time band covers. Fix the Time bands for ${tariffCode} in the Tariff book.`);

    // ---- charge lines -------------------------------------------------------------------------------------
    const lines = result.lines;
    const hasDemand = components.some(c => c.kind === 'DEMAND_BANDED');
    let demandInfo = null;

    // demand: MD for each billing day. Bills: the rolling 12-month maximum. Quotes may pass options.mdFixedKva
    // (the reference year's annual peak, assumed to recur) so early months are not understated.
    let mdByDay = null, mdMax = 0;
    const fixedMd = opts.mdFixedKva != null && Number.isFinite(+opts.mdFixedKva) ? +opts.mdFixedKva : null;
    if (hasDemand) {
      const winStart = d => util.addDays(util.addMonths(d, -opts.mdWindowMonths), 1);
      const dayMax = new Map();
      for (let n = util.dayNum(winStart(period.from)), e = util.dayNum(period.to); n <= e; n++) { const x = profile.days.get(util.fromDayNum(n)); if (x && x.maxKva) dayMax.set(n, x.maxKva); }
      const windowMax = d => { let m = 0; for (let n = util.dayNum(winStart(d)), e = util.dayNum(d); n <= e; n++) { const v = dayMax.get(n); if (v > m) m = v; } return m; };
      mdByDay = fixedMd != null ? days.map(() => fixedMd) : opts.mdMode === 'period-end' ? days.map(() => windowMax(period.to)) : days.map(windowMax);
      mdMax = Math.max(...mdByDay);
      if (fixedMd == null && profile.firstDate && profile.firstDate > winStart(period.from)) {
        note('warn', 'MD_SHORT_HISTORY', `Interval history starts ${profile.firstDate}, so the ${opts.mdWindowMonths}-month maximum demand window is only partly covered (${util.daysBetween(profile.firstDate, period.from)} days before this period). MD may be understated.`);
      }
      let pfSlots = 0, daysPf = 0;
      for (let n = util.dayNum(winStart(period.from)), e = util.dayNum(period.to); n <= e; n++) { const x = profile.days.get(util.fromDayNum(n)); if (x && x.pfAssumedSlots) { pfSlots += x.pfAssumedSlots; daysPf++; } }
      if (!profile.hasReactive) note('warn', 'PF_ASSUMED', `No reactive (Q/K) datastream for this NMI: kVA is derived from kW using an assumed power factor of ${util.fmtNum(profile.assumedPf, 2)}.`);
      else if (pfSlots) note('warn', 'PF_ASSUMED', `Reactive data is missing for ${util.fmtNum(pfSlots)} half-hours on ${daysPf} day(s); the assumed power factor of ${util.fmtNum(profile.assumedPf, 2)} was used for those.`);
    }

    for (const comp of components) {
      if (comp.kind === 'DAILY') {
        const runs = dailyRuns(days, rateDateOf, rd => rb.pick(comp.componentCode, '', rd), d => miss(`${comp.label} rate`, d));
        for (const r of runs) {
          lines.push(mkLine({ code: `NET.${comp.componentCode}`, group: comp.group || 'Network', label: `${comp.label} (${tariffCode})`, description: `${comp.label} (${tariffCode})`, from: r.from, to: r.to, quantity: r.days, unit: 'days', rate: r.pick.row.value, rateUnit: 'c/day', amountCents: r.days * r.pick.row.value, rateId: r.pick.row.rateId, assumedRate: r.pick.assumed }));
        }
      } else if (comp.kind === 'ENERGY') {
        for (const code of bandOrder) {
          for (const a of Array.from(accNet.values()).filter(x => x.band === code)) {
            const bl = label(bandRows, code);
            lines.push(mkLine({ code: `NET.${comp.componentCode}.${code}`, group: comp.group || 'Network', label: `${comp.label}: ${bl} (${tariffCode})`, description: `${comp.label}: ${bl} (${tariffCode})`, from: a.from, to: a.to, quantity: a.kwh, unit: 'kWh', rate: a.pick.row.value, rateUnit: 'c/kWh', amountCents: a.kwh * a.pick.row.value, rateId: a.pick.row.rateId, assumedRate: a.pick.assumed, band: code }));
          }
        }
      } else if (comp.kind === 'DEMAND_BANDED') {
        const offKwh = usage.kwhByBand.OFF_PEAK || 0;
        const offPeakShare = usage.kwhTotal > 0 ? offKwh / usage.kwhTotal : 0;
        if (!bandOrder.includes('OFF_PEAK')) note('error', 'NO_OFF_PEAK_BAND', `${tariffCode} needs a time band with code OFF_PEAK to work out the off-peak share used in the demand discount.`);
        const runs = [];
        let cur = null, demandLengthDays = 0, mdMaxLength = 0, extrapolatedDays = 0, defaultsUsed = false, lengthKvaUsed = 1000;
        for (let i = 0; i < nDays; i++) {
          const d = days[i], rd = rateDateOf(d), md = mdByDay[i];
          const bands = rb.demandBands(rd);
          if (!bands.length) { miss(`${comp.label} band`, d); cur = null; continue; }
          const dfv = rb.param('DF', rd), ts = rb.param('TAPER_START', rd), te = rb.param('TAPER_END', rd), dl = rb.param('DEMAND_LENGTH_KVA', rd);
          if (dfv == null || ts == null || te == null) defaultsUsed = true;
          const p = { DF: dfv ?? 0.3, taperStart: ts ?? 1000, taperEnd: te ?? 1500 };
          const lengthKva = lengthKvaUsed = dl ?? 1000;
          const calc = rt6Daily(md, offPeakShare, bands, p);
          if (md > lengthKva) { demandLengthDays++; mdMaxLength = Math.max(mdMaxLength, md); }
          if (calc.extrapolated) extrapolatedDays++;
          const key = [calc.band.fixedRateId, calc.band.rateId, md.toFixed(3), p.DF, p.taperStart, p.taperEnd].join('|');
          if (cur && cur.key === key) { cur.to = d; cur.days++; }
          else { cur = { key, from: d, to: d, days: 1, md, calc, p, assumed: calc.band.assumed }; runs.push(cur); }
        }
        if (defaultsUsed) note('warn', 'PARAM_DEFAULT', `RT6 discount parameters (DF, TAPER_START, TAPER_END) are missing from the tariff book; defaults 0.30 / 1,000 / 1,500 were used.`);
        for (const r of runs) {
          const c = r.calc, b = c.band;
          const rangeTxt = `${util.fmtNum(b.lower)}–${Number.isFinite(b.upper) ? util.fmtNum(b.upper) : '∞'} kVA`;
          lines.push(mkLine({
            code: 'NET.DEMAND', group: comp.group || 'Network', label: `${comp.label} (${tariffCode})`, description: `${comp.label} (${tariffCode})`,
            detail: `MD ${f1(r.md)} kVA · band ${rangeTxt} · ${f3(b.fixed)} + ${f3(b.rate)} × ${f1(r.md - b.lower)} kVA c/day`,
            from: r.from, to: r.to, quantity: r.days, unit: 'days', rate: c.amount, rateUnit: 'c/day', amountCents: r.days * c.amount,
            rateId: b.rateId, assumedRate: r.assumed, md: r.md, bandCode: b.bandCode,
          }));
          if (c.discountRate > 0) {
            lines.push(mkLine({
              code: 'NET.DEMAND.DISCOUNT', group: comp.group || 'Network', label: `Off-peak usage discount (${tariffCode})`, description: `Off-peak usage discount (${tariffCode})`,
              detail: `${util.fmtPct(c.discountRate, 2)} = off-peak share ${util.fmtPct(offPeakShare, 1)} × DF ${f3(r.p.DF)}${r.md >= r.p.taperStart ? ` × taper ${f3((r.p.taperEnd - r.md) / (r.p.taperEnd - r.p.taperStart))}` : ''}`,
              from: r.from, to: r.to, quantity: r.days, unit: 'days', rate: -c.discountAmount, rateUnit: 'c/day', amountCents: -r.days * c.discountAmount,
              rateId: b.rateId, md: r.md,
            }));
          }
        }
        demandInfo = { offPeakShare, offPeakKwh: offKwh, runs: runs.map(r => ({ from: r.from, to: r.to, days: r.days, md: r.md, bandCode: r.calc.band.bandCode, lower: r.calc.band.lower, upper: r.calc.band.upper, fixed: r.calc.fixed, rate: r.calc.band.rate, gross: r.calc.amount, discountRate: r.calc.discountRate, net: r.calc.net, extrapolated: r.calc.extrapolated })), mdMax, mdEnd: mdByDay[nDays - 1], mdStart: mdByDay[0], demandLengthDays, windowMonths: opts.mdWindowMonths, mdMode: fixedMd != null ? 'fixed' : opts.mdMode };
        if (fixedMd != null) note('info', 'MD_FIXED', `Maximum demand is fixed at ${f1(fixedMd)} kVA for every day (the reference year's highest half-hourly kVA, assumed to recur) instead of a rolling 12-month figure.`);
        if (extrapolatedDays) note('warn', 'MD_ABOVE_TABLE', `MD exceeded the top published ${tariffCode} band (${util.fmtNum(runs[runs.length - 1].calc.band.upper)} kVA) on ${extrapolatedDays} day(s); the top band formula was extended. Check the tariff is still appropriate.`);
        if (demandLengthDays) note('warn', 'DEMAND_LENGTH_NOT_CALCULATED', `Demand-length charge NOT calculated: MD exceeded ${util.fmtNum(lengthKvaUsed)} kVA on ${demandLengthDays} day(s) of this period (peak ${f1(mdMaxLength)} kVA). That charge is out of scope for this prototype and is excluded from the total.`);
      }
    }

    // ---- metering reference service add-on (c/meter/day) ------------------------------------------------
    const svc = site.meteringService;
    if (svc && svc !== 'NONE') {
      if (svc === 'OTHER') {
        const c = +site.meteringOtherCents || 0;
        if (c) lines.push(mkLine({ code: 'NET.METERING.ADDON', group: 'Metering', label: 'Metering reference service: other', description: 'Metering reference service: other (manual entry)', from: period.from, to: period.to, quantity: nDays, unit: 'days', rate: c, rateUnit: 'c/meter/day', amountCents: nDays * c }));
      } else {
        const runs = dailyRuns(days, rateDateOf, rd => rb.pick('METERING_ADDON', svc, rd), d => miss(`metering reference service ${svc} rate`, d));
        for (const r of runs) lines.push(mkLine({ code: 'NET.METERING.ADDON', group: 'Metering', label: `Metering reference service ${svc}`, description: `Metering reference service ${svc}`, from: r.from, to: r.to, quantity: r.days, unit: 'days', rate: r.pick.row.value, rateUnit: 'c/meter/day', amountCents: r.days * r.pick.row.value, rateId: r.pick.row.rateId, assumedRate: r.pick.assumed }));
      }
    }

    // ---- retail lines (from the retail offer's own dated rates) ---------------------------------------------
    if (retail) {
      for (const code of bandOrder) {
        for (const a of Array.from(accRet.values()).filter(x => x.band === code)) {
          const bl = label(bandRows, code);
          lines.push(mkLine({ code: `RET.ENERGY.${code}`, group: 'Retail', label: `Retail energy: ${bl}`, description: `Retail energy: ${bl}`, from: a.from, to: a.to, quantity: a.kwh, unit: 'kWh', rate: a.pick.row.value, rateUnit: 'c/kWh', amountCents: a.kwh * a.pick.row.value, rateId: a.pick.row.rateId, band: code }));
        }
      }
      const retailRows = allRates.filter(r => r.ownerCode === retail.offerId);
      const dailyCodes = comp0 => Array.from(new Set(retailRows.filter(r => r.componentCode === comp0).map(r => r.bandCode || '')));
      for (const code of dailyCodes('RET_FIXED')) {
        const runs = dailyRuns(days, rateDateOf, rd => rr.pick('RET_FIXED', code, rd), d => miss('retail service fee rate', d));
        for (const r of runs) lines.push(mkLine({ code: 'RET.FIXED', group: 'Retail', label: r.pick.row.note || 'Retail service fee', description: r.pick.row.note || 'Retail service fee', from: r.from, to: r.to, quantity: r.days, unit: 'days', rate: r.pick.row.value, rateUnit: 'c/day', amountCents: r.days * r.pick.row.value, rateId: r.pick.row.rateId }));
      }
      for (const code of dailyCodes('RET_OTHER_DAY')) {
        const runs = dailyRuns(days, rateDateOf, rd => rr.pick('RET_OTHER_DAY', code, rd), d => miss(`retail charge ${code} rate`, d));
        for (const r of runs) lines.push(mkLine({ code: `RET.OTHER.${code}`, group: 'Retail', label: r.pick.row.note || code, description: r.pick.row.note || code, from: r.from, to: r.to, quantity: r.days, unit: 'days', rate: r.pick.row.value, rateUnit: 'c/day', amountCents: r.days * r.pick.row.value, rateId: r.pick.row.rateId }));
      }
      for (const code of dailyCodes('RET_OTHER_KWH')) {
        const acc = new Map();
        for (const date of days) {
          const dd = profile.days.get(date);
          if (!dd) continue;
          const p = rr.pick('RET_OTHER_KWH', code, rateDateOf(date));
          if (!p) { miss(`retail charge ${code} rate`, date); continue; }
          const kwh = dd.e.reduce((s, r) => s + r.value, 0);
          let a = acc.get(p.row.rateId);
          if (!a) acc.set(p.row.rateId, a = { pick: p, kwh: 0, from: date, to: date });
          a.kwh += kwh; a.to = date;
        }
        for (const a of acc.values()) lines.push(mkLine({ code: `RET.OTHER.${code}`, group: 'Retail', label: a.pick.row.note || code, description: a.pick.row.note || code, from: a.from, to: a.to, quantity: a.kwh, unit: 'kWh', rate: a.pick.row.value, rateUnit: 'c/kWh', amountCents: a.kwh * a.pick.row.value, rateId: a.pick.row.rateId }));
      }
      if (retail.networkMarginPct) {
        const net = lines.filter(l => l.group === 'Network' || l.group === 'Metering').reduce((s, l) => s + l.amountCents, 0);
        lines.push(mkLine({ code: 'RET.NETWORK_MARGIN', group: 'Retail', label: `Network pass-through margin (${retail.networkMarginPct}%)`, description: `Network pass-through margin (${retail.networkMarginPct}% of network and metering charges)`, from: period.from, to: period.to, quantity: 1, unit: 'item', rate: net * retail.networkMarginPct / 100, rateUnit: 'c', amountCents: net * retail.networkMarginPct / 100 }));
      }
    }

    // ---- notices ---------------------------------------------------------------------------------------------
    for (const [what, m] of missing) note('error', 'RATE_MISSING', `No ${what} is effective on ${util.fmtDate(m.first)}${m.dates.size > 1 ? ` (${m.dates.size} days affected)` : ''}. Load that price list in the Tariff book (or, for a quote, let the engine assume current prices).`);
    const assumed = [...rb.assumedList(), ...(rr ? rr.assumedList() : [])];
    if (assumed.length) note('warn', 'RATE_ASSUMED', `Prices were not loaded for part of this period, so the most recent loaded rates were assumed (${Array.from(new Set(assumed.map(a => a.row.effectiveFrom + ' to ' + (a.row.effectiveTo || 'open')))).join('; ')}).`);
    if (usage.missingIntervals > 0) note('warn', 'DATA_MISSING', `${util.fmtNum(usage.missingIntervals)} of ${util.fmtNum(usage.intervalsExpected)} expected intervals are missing (quality N or no data). Usage and demand may be understated until the data is substituted.`);
    if (usage.estimatedIntervals > 0) note('info', 'DATA_ESTIMATED', `${util.fmtPct(usage.estimatedIntervals / Math.max(1, usage.intervalsPresent), 1)} of intervals are estimated or substituted (E/S/F), not actual reads.`);
    if (usage.exportKwh > 0) note('info', 'EXPORT_NOT_CREDITED', `${util.fmtNum(usage.exportKwh, 0)} kWh of energy exported to the grid (B datastream) is shown for information only; no export credit is calculated.`);
    if (hasDemand || bandRows.some(b => (b.holidays || 'INCLUDE') !== 'INCLUDE')) {
      const years = new Set(Array.from(holidays).map(h => h.slice(0, 4)));
      const need = new Set(days.map(d => d.slice(0, 4)));
      const lacking = Array.from(need).filter(y => !years.has(y));
      if (lacking.length) note('warn', 'NO_HOLIDAYS', `The Public holidays table has no entries for ${lacking.join(', ')}; ${tariffCode} time bands treat every day as a normal day. Add the holidays.`);
    }

    // ---- totals ----------------------------------------------------------------------------------------------
    const sumG = g => lines.filter(l => l.group === g).reduce((s, l) => s + l.amountCents, 0);
    result.usage = usage;
    result.demand = demandInfo;
    result.totals = { networkCents: sumG('Network'), meteringCents: sumG('Metering'), retailCents: sumG('Retail') };
    result.totals.totalCents = result.totals.networkCents + result.totals.meteringCents + result.totals.retailCents;
    if (notices.some(n => n.level === 'error')) result.ok = false;
    return result;
  }

  /** Round every line to whole cents, then add GST on the subtotal. Quotes and invoices both use this. */
  function finalise(result, { gstRate = 0.1 } = {}) {
    const lines = result.lines.map(l => ({ ...l, amountExGstCents: util.roundCents(l.amountCents) }));
    const sub = g => lines.filter(l => g.includes(l.group)).reduce((s, l) => s + l.amountExGstCents, 0);
    const subtotalCents = lines.reduce((s, l) => s + l.amountExGstCents, 0);
    const gstCents = util.roundCents(subtotalCents * gstRate);
    return { ...result, lines, gstRate, subtotalCents, gstCents, totalCents: subtotalCents + gstCents, byGroup: { network: sub(['Network']), metering: sub(['Metering']), retail: sub(['Retail']) } };
  }

  /** Calendar-month periods covering from..to (first/last may be partial). */
  function monthPeriods(from, to) {
    const out = [];
    for (let s = from; s <= to; s = util.addDays(util.monthEnd(s), 1)) out.push({ from: s, to: util.monthEnd(s) < to ? util.monthEnd(s) : to });
    return out;
  }

  /** Combine several priced periods (a quote's twelve months) into annual lines, usage and notices. */
  function aggregate(results) {
    const map = new Map();
    for (const res of results) {
      for (const l of res.lines) {
        const key = l.code;
        let a = map.get(key);
        if (!a) map.set(key, a = { code: l.code, group: l.group, label: l.label, unit: l.unit, rateUnit: l.rateUnit, quantity: 0, amountCents: 0, from: l.from, to: l.to, rates: new Set() });
        a.quantity += l.quantity; a.amountCents += l.amountCents; a.rates.add(l.rate); if (l.from < a.from) a.from = l.from; if (l.to > a.to) a.to = l.to;
      }
    }
    const lines = Array.from(map.values()).map(a => ({ code: a.code, group: a.group, label: a.label, description: a.label, unit: a.unit, rateUnit: a.rateUnit, from: a.from, to: a.to, quantity: a.quantity, amountCents: a.amountCents, rate: a.quantity ? a.amountCents / a.quantity : 0, rateVaries: a.rates.size > 1 }));
    const ok = results.length > 0 && results.every(r => r.ok);
    const usage = { days: 0, kwhTotal: 0, kwhByBand: {}, bandOrder: [], bandLabels: {}, quality: {}, intervalsPresent: 0, intervalsExpected: 0, missingIntervals: 0, estimatedIntervals: 0, exportKwh: 0 };
    let mdMax = 0, offKwh = 0, hasDemand = false;
    const notices = new Map();
    for (const r of results) {
      const u = r.usage;
      if (u) {
        usage.days += u.days; usage.kwhTotal += u.kwhTotal; usage.intervalsPresent += u.intervalsPresent; usage.intervalsExpected += u.intervalsExpected;
        usage.missingIntervals += u.missingIntervals; usage.estimatedIntervals += u.estimatedIntervals; usage.exportKwh += u.exportKwh;
        for (const [b, v] of Object.entries(u.kwhByBand)) usage.kwhByBand[b] = (usage.kwhByBand[b] || 0) + v;
        for (const [q, v] of Object.entries(u.quality)) usage.quality[q] = (usage.quality[q] || 0) + v;
        for (const b of u.bandOrder) if (!usage.bandOrder.includes(b)) { usage.bandOrder.push(b); usage.bandLabels[b] = u.bandLabels[b]; }
      }
      if (r.demand) { hasDemand = true; mdMax = Math.max(mdMax, r.demand.mdMax); offKwh += r.demand.offPeakKwh; }
      for (const n of r.notices) { const k = n.code + '|' + n.level; if (!notices.has(k)) notices.set(k, { ...n, months: 1 }); else notices.get(k).months++; }
    }
    const totals = { networkCents: 0, meteringCents: 0, retailCents: 0, totalCents: 0 };
    for (const l of lines) { const k = l.group === 'Network' ? 'networkCents' : l.group === 'Metering' ? 'meteringCents' : 'retailCents'; totals[k] += l.amountCents; totals.totalCents += l.amountCents; }
    return { ok, lines, usage, demand: hasDemand ? { mdMax, offPeakShare: usage.kwhTotal ? offKwh / usage.kwhTotal : 0 } : null, notices: Array.from(notices.values()), totals };
  }

  return {
    VERSION, DEFAULTS, DOW_NAMES, parseDays, makeBandResolver, bandCoverage, makeRateBook, demandCharge, demandDiscount, rt6Daily,
    buildProfile, priceBillingPeriod, finalise, monthPeriods, aggregate,
  };
})();
</script>
<script data-section="svc">
/* ============================================================================
   SECTION 7 — svc  (application services: the glue between ui, repo, nem12 and engine)
   Maps onto the future backend's service layer. No DOM here. Everything that changes data
   goes through repo; everything that prices goes through engine.priceBillingPeriod via
   priceWith(), so QUOTES AND BILLS SHARE ONE CODE PATH.
   ============================================================================ */
const svc = (() => {
  'use strict';
  const today = () => util.todayWst();
  const asMap = (arr, k) => new Map(arr.map(x => [x[k], x]));

  // ---- settings ----------------------------------------------------------------------------------------
  const setting = (key, dflt) => { const r = repo.get('Setting', key); return r ? r.value : dflt; };
  function saveSetting(key, value) { if (repo.get('Setting', key)) repo.update('Setting', key, { value }); else repo.insert('Setting', { key, value }); }
  const company = () => ({ name: '', abn: '', address: '', phone: '', email: '', bankName: '', accountName: '', bsb: '', accountNumber: '', ...setting('company', {}) });
  const gstRate = () => setting('gstRate', 0.1);
  const engineSettings = () => { const e = setting('engine', {}); return { mdMode: e.mdMode || 'daily', mdWindowMonths: e.mdWindowMonths || 12 }; };

  // ---- tasks -----------------------------------------------------------------------------------------------
  function addTask({ title, description = '', priority = 'Normal', dueDate = null, relatedType = null, relatedId = null, source = 'system' }) {
    const dup = repo.find('Task', t => t.status !== 'Done' && t.title === title && t.relatedId === relatedId);
    if (dup) return dup;
    return repo.insert('Task', { title, description, status: 'Open', priority, dueDate, relatedType, relatedId, source, completedAt: null });
  }

  // ---- tariff book / standing data -----------------------------------------------------------------------------
  function loadBook() {
    return {
      tariffs: repo.list('NetworkTariff'), components: repo.list('TariffComponent'), timeBands: repo.list('TimeBand'), rates: repo.list('Rate'),
      holidays: new Set(repo.list('PublicHoliday').map(h => h.date)),
    };
  }
  const bySnap = (a, b) => (a.effectiveFrom || '').localeCompare(b.effectiveFrom || '') || (a.capturedAt || '').localeCompare(b.capturedAt || '');
  const snapshots = nmi => repo.list('StandingDataSnapshot', { nmi }).sort(bySnap);
  const standing = nmi => snapshots(nmi).pop() || null;
  function standingAsAt(nmi, date) {
    const all = snapshots(nmi);
    return all.filter(s => s.effectiveFrom <= date).pop() || all[0] || null;
  }
  const openTariffs = () => repo.list('NetworkTariff').filter(t => t.status === 'open');

  /** Record a standing-data change (history is append-only). */
  function setStanding(nmi, { networkTariffCode, effectiveFrom, notes = '', source = 'Manual' }) {
    const tariff = repo.get('NetworkTariff', networkTariffCode);
    if (!tariff) throw new Error(`Unknown network tariff ${networkTariffCode}.`);
    const prev = standing(nmi);
    if (tariff.status === 'closed' && (!prev || prev.networkTariffCode !== networkTariffCode)) {
      throw new Error(`${networkTariffCode} is closed (grandfathered, no new nominations): an NMI cannot be moved onto it.`);
    }
    return repo.insert('StandingDataSnapshot', {
      nmi, effectiveFrom: effectiveFrom || today(), capturedAt: new Date().toISOString(), source, sourceFileId: null,
      nmiConfiguration: prev ? prev.nmiConfiguration : '', streams: prev ? prev.streams : [], networkTariffCode, notes,
    });
  }

  function nmiContext(nmi, { tariffCode, offerId, asAt } = {}) {
    const nmiRow = repo.get('Nmi', nmi);
    const site = nmiRow && nmiRow.siteId ? repo.get('Site', nmiRow.siteId) : null;
    const customer = site ? repo.get('Customer', site.customerId) : null;
    const snap = asAt ? standingAsAt(nmi, asAt) : standing(nmi);
    const oId = offerId || (site && site.retailOfferId) || null;
    return {
      nmi, nmiRow, site, customer, snap, tariffCode: tariffCode || (snap && snap.networkTariffCode) || null, offer: oId ? repo.get('RetailOffer', oId) : null,
      siteParams: { assumedPf: (site && site.assumedPf) || 0.9, meteringService: (site && site.meteringService) || 'NONE', meteringOtherCents: site ? site.meteringOtherCents : null },
    };
  }

  // ---- interval data access ------------------------------------------------------------------------------------------
  function dataCoverage(nmi) {
    const ss = repo.intervalStreams().filter(s => s.nmi === nmi && nem12.kindOfSuffix(s.suffix) === 'consumption');
    if (!ss.length) return null;
    return { first: ss.map(s => s.firstDate).sort()[0], last: ss.map(s => s.lastDate).sort().pop(), streams: ss };
  }
  /** Build the engine's interval profile for an NMI from the CURRENT version of every interval. */
  function loadProfile(nmi, from, to, { assumedPf = 0.9, maxId = null } = {}) {
    const streams = repo.intervalStreams().filter(s => s.nmi === nmi);
    const rowsOf = kind => streams.filter(s => nem12.kindOfSuffix(s.suffix) === kind).flatMap(s => repo.currentIntervals(nmi, s.suffix, from, to, maxId != null ? { maxId } : undefined));
    return engine.buildProfile({ consumption: rowsOf('consumption'), reactive: rowsOf('reactive'), exports: rowsOf('export'), assumedPf });
  }
  const leadInStart = from => util.addMonths(from, -engineSettings().mdWindowMonths);

  // ---- THE pricing path (quotes and bills both call this) ----------------------------------------------------------------------
  function priceWith({ book, profile, ctx, period, options, tariffCode }) {
    const tCode = tariffCode || ctx.tariffCode;
    if (!tCode) return { ok: false, lines: [], usage: null, demand: null, totals: null, period, tariffCode: null, notices: [{ level: 'error', code: 'NO_TARIFF', message: `No network tariff is set for NMI ${ctx.nmi}. Set it in the NMI's standing data.` }] };
    return engine.priceBillingPeriod({
      period, tariffCode: tCode, tariffs: book.tariffs, components: book.components, timeBands: book.timeBands, rates: book.rates, holidays: book.holidays,
      site: ctx.siteParams, profile, retail: ctx.offer ? { offerId: ctx.offer.offerId, networkMarginPct: ctx.offer.networkMarginPct || 0 } : null,
      options: { ...engineSettings(), ...options },
    });
  }

  // ---- ingestion -------------------------------------------------------------------------------------------------------------------
  const decodeText = bytes => new TextDecoder('utf-8').decode(bytes);
  const streamSig = streams => JSON.stringify((streams || []).map(({ nextScheduledRead, ...r }) => r));
  function streamsConfig(parsed, nmi) {
    const blocks = parsed.blocks.filter(b => b.nmi === nmi && !b.invalid);
    const byKey = new Map();
    for (const b of blocks) byKey.set(b.suffix, { suffix: b.suffix, registerId: b.registerId, mdm: b.mdm, meterSerial: b.meterSerial, uom: b.uom, unit: b.unit, intervalLength: b.intervalLength, kind: b.kind, nextScheduledRead: b.nextScheduledRead });
    return { nmiConfiguration: blocks[0] ? blocks[0].nmiConfiguration : '', streams: Array.from(byKey.values()).sort((a, b) => a.suffix.localeCompare(b.suffix)) };
  }
  const rejectedReport = (msg, code = 'FILE') => ({
    status: 'Rejected', strict: false, fatalReason: msg, header: null, counts: { lines: 0, validDays: 0, skippedDays: 0 }, issueTotals: { error: 1, warning: 0, info: 0 }, issueByCode: { [code]: 1 },
    issues: [{ sev: 'error', code, line: 0, msg }], issuesTruncated: false, streams: [], nmis: [],
  });

  /**
   * Ingest an uploaded .csv / .zip: (1) store the raw file unchanged, (2) parse + validate,
   * (3) insert every interval as a NEW versioned row, (4) keep the report with the file,
   * (5) discover NMIs / standing data and raise tasks. Returns { status, fileId, report, inserted, … }.
   */
  async function ingestUpload({ fileName, bytes, strict = false, allowDuplicate = false }) {
    const sha = util.sha256Hex(bytes);
    const dups = rawStore.findBySha(sha);
    if (dups.length && !allowDuplicate) return { status: 'duplicate', duplicates: dups, sha256: sha };
    const meta = rawStore.put({ fileName, bytes });                           // 1. raw file first, never edited or deleted
    const isZip = /\.zip$/i.test(fileName) || (bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 3);
    let text = null, inner = null, early = null;
    if (isZip) {
      if (typeof JSZip === 'undefined') early = 'The JSZip library could not be loaded (offline?). Unzip the file and upload the CSV instead.';
      else {
        try {
          const zip = await JSZip.loadAsync(bytes);
          const csvs = Object.values(zip.files).filter(f => !f.dir && /\.csv$/i.test(f.name) && !/(^|\/)(__MACOSX|\._)/.test(f.name));
          if (csvs.length !== 1) early = `A zip upload must contain exactly one CSV file; this one contains ${csvs.length}.`;
          else { inner = csvs[0].name; text = decodeText(await csvs[0].async('uint8array')); }
        } catch (e) { early = 'The zip file could not be read: ' + (e && e.message); }
      }
    } else text = decodeText(bytes);

    let parsed = null, report = early ? rejectedReport(early, 'ZIP') : null;
    if (!report) { parsed = nem12.parse(text); report = nem12.buildReport(parsed, { strict }); }
    let inserted = 0, newNmis = [];
    if (report.status !== 'Rejected') {
      try { inserted = repo.insertReadings(nem12.toReadingRows(parsed, meta.fileId)).inserted; }       // 3. versioned, append-only
      catch (e) {
        try { repo.insert('MeterDataFile', { fileId: meta.fileId, fileName, uploadedAt: meta.uploadedAt, sha256: meta.sha256, size: meta.size, kind: isZip ? 'zip' : 'csv', innerFileName: inner, status: 'Error', validation: report, intervalRowsInserted: 0, nmis: report.nmis, dateFrom: null, dateTo: null, error: e.message }); } catch (_) { /* storage is full */ }
        return { status: 'error', fileId: meta.fileId, report, message: e.message };
      }
    }
    const dates = report.streams.flatMap(s => [s.firstDate, s.lastDate]).filter(Boolean).sort();
    repo.atomic(() => {
      repo.insert('MeterDataFile', {
        fileId: meta.fileId, fileName, uploadedAt: meta.uploadedAt, sha256: meta.sha256, size: meta.size, kind: isZip ? 'zip' : 'csv', innerFileName: inner,
        status: report.status, validation: report, intervalRowsInserted: inserted, nmis: report.nmis, dateFrom: dates[0] || null, dateTo: dates[dates.length - 1] || null, strict,
      });
      if (parsed && report.status !== 'Rejected') {
        for (const nmi of report.nmis) {
          const cfg = streamsConfig(parsed, nmi);
          if (!cfg.streams.length) continue;
          if (!repo.get('Nmi', nmi)) {
            repo.insert('Nmi', { nmi, siteId: null, status: 'Discovered', label: '', discoveredFromFileId: meta.fileId });
            newNmis.push(nmi);
            addTask({ title: `Assign NMI ${nmi} to a customer site and set its network tariff`, description: `NMI ${nmi} was discovered in ${fileName}. Add it to a site (Customers) and record its network tariff before quoting or billing.`, priority: 'High', relatedType: 'Nmi', relatedId: nmi });
          }
          const prev = standing(nmi);
          if (!prev || streamSig(prev.streams) !== streamSig(cfg.streams)) {
            repo.insert('StandingDataSnapshot', { nmi, effectiveFrom: dates[0] || today(), capturedAt: new Date().toISOString(), source: 'NEM12', sourceFileId: meta.fileId, nmiConfiguration: cfg.nmiConfiguration, streams: cfg.streams, networkTariffCode: prev ? prev.networkTariffCode : null, notes: `Captured from the 200 records of ${fileName}` });
          }
          const missing = report.streams.filter(s => s.nmi === nmi).reduce((n, s) => n + (s.quality.N || 0), 0);
          if (missing) addTask({ title: `Missing interval data for NMI ${nmi}: ${util.fmtNum(missing)} intervals flagged N`, description: `File ${fileName} contains intervals with quality N (value 0 = missing). Request substituted or actual data from the metering provider.`, priority: 'Normal', relatedType: 'Nmi', relatedId: nmi });
        }
      }
      if (report.status !== 'Accepted') addTask({ title: `Review NEM12 validation errors in ${fileName}`, description: `${report.status}: ${report.issueTotals.error} error(s), ${report.issueTotals.warning} warning(s). ${report.fatalReason || ''}`.trim(), priority: 'High', relatedType: 'MeterDataFile', relatedId: meta.fileId });
    });
    return { status: report.status, fileId: meta.fileId, report, inserted, newNmis, innerFileName: inner };
  }

  /** Text of a stored upload as it was parsed (the CSV itself, or the single CSV inside a zip). */
  async function rawText(fileId) {
    const meta = rawStore.meta(fileId);
    if (!meta) return null;
    const bytes = rawStore.getBytes(fileId);
    if (!(/\.zip$/i.test(meta.fileName) || (bytes[0] === 0x50 && bytes[1] === 0x4b && bytes[2] === 3))) return decodeText(bytes);
    if (typeof JSZip === 'undefined') return null;
    const zip = await JSZip.loadAsync(bytes);
    const csv = Object.values(zip.files).find(f => !f.dir && /\.csv$/i.test(f.name));
    return csv ? decodeText(await csv.async('uint8array')) : null;
  }

  // ---- quotes ------------------------------------------------------------------------------------------------------------------------------------
  /** The last `months` complete calendar months of consumption data (first of them is the MD lead-in's successor). */
  function referencePeriod(nmi, months = 12) {
    const cov = dataCoverage(nmi);
    if (!cov) return null;
    const lastFull = cov.last === util.monthEnd(cov.last) ? cov.last : util.monthEnd(util.addMonths(util.monthStart(cov.last), -1));
    const firstFull = cov.first === util.monthStart(cov.first) ? cov.first : util.addDays(util.monthEnd(cov.first), 1);
    let from = util.monthStart(util.addMonths(lastFull, -(months - 1)));
    if (from < firstFull) from = firstFull;
    if (from > lastFull) return null;
    return { from, to: lastFull, firstData: cov.first, lastData: cov.last };
  }
  /** Notices aggregated over the 12 reference months: re-word the ones that would otherwise quote only the first month's figures. */
  function quoteNotices(agg, nMonths) {
    const u = agg.usage, f1 = n => util.fmtNum(n, 1);
    return agg.notices.map(n => {
      let message = n.message, months = n.months;
      if (n.code === 'DEMAND_LENGTH_NOT_CALCULATED') { message = `Demand-length charge NOT calculated: maximum demand is above 1,000 kVA (peak ${f1(agg.demand.mdMax)} kVA) in ${n.months} of ${nMonths} months. That charge is out of scope for this prototype and is excluded from the total.`; months = 1; }
      else if (n.code === 'DATA_MISSING') { message = `${util.fmtNum(u.missingIntervals)} of ${util.fmtNum(u.intervalsExpected)} expected intervals in the reference period are missing (quality N or no data). Usage and demand may be understated until the data is substituted.`; months = 1; }
      else if (n.code === 'DATA_ESTIMATED') { message = `${util.fmtPct(u.estimatedIntervals / Math.max(1, u.intervalsPresent), 1)} of the reference period's intervals are estimated or substituted (E/S/F), not actual reads.`; months = 1; }
      else if (n.code === 'EXPORT_NOT_CREDITED') { message = `${util.fmtNum(u.exportKwh)} kWh exported to the grid (B datastream) over the reference period is shown for information only; no export credit is calculated.`; months = 1; }
      return { level: n.level, code: n.code, message, months };
    });
  }
  const monthlyBrief = r => ({ from: r.period.from, to: r.period.to, kwh: r.usage ? r.usage.kwhTotal : 0, md: r.demand ? r.demand.mdEnd : null, networkCents: r.totals ? r.totals.networkCents + r.totals.meteringCents : 0, retailCents: r.totals ? r.totals.retailCents : 0, totalCents: r.totals ? r.totals.totalCents : 0, ok: r.ok });

  /** Price one NMI for a quote: twelve billing periods of historical data, re-priced at the rates effective on the quote start date. */
  function quoteItem({ nmi, tariffCode = null, offerId = null, startDate, compare = true, mdBasis = 'annual', book = loadBook() }) {
    const ctx = nmiContext(nmi, { tariffCode, offerId });
    const ref = referencePeriod(nmi, 12);
    const item = { nmi, siteId: ctx.site ? ctx.site.siteId : null, siteName: ctx.site ? ctx.site.name : '', siteAddress: ctx.site ? ctx.site.address : '', tariffCode: ctx.tariffCode, meteringService: ctx.siteParams.meteringService, assumedPf: ctx.siteParams.assumedPf, offerId: ctx.offer ? ctx.offer.offerId : null, mdBasis, ok: false, notices: [], lines: [] };
    if (!ref) { item.notices.push({ level: 'error', code: 'NO_DATA', message: `NMI ${nmi} has no complete calendar month of interval data to base a quote on.` }); return item; }
    const periods = engine.monthPeriods(ref.from, ref.to);
    const profile = loadProfile(nmi, leadInStart(ref.from), ref.to, { assumedPf: ctx.siteParams.assumedPf });
    // MD basis. 'annual' (default for a forward quote): the reference year's highest half-hourly kVA applies to every month,
    // i.e. the customer's peak is assumed to recur. 'rolling': as billed, which understates early months unless ~24 months of history exist.
    const annualMd = Math.max(0, ...util.dateRange(ref.from, ref.to).map(d => { const x = profile.days.get(d); return x ? x.maxKva : 0; }));
    item.annualMd = annualMd;
    const options = { rateAsAt: startDate, rateFallback: 'latest', mdFixedKva: mdBasis === 'annual' ? annualMd : null };
    const results = periods.map(p => priceWith({ book, profile, ctx, period: p, options }));
    const agg = engine.aggregate(results);
    const k = agg.usage.days > 0 && agg.usage.days < 350 ? 365 / agg.usage.days : 1;       // annualise short histories
    const scaled = { ...agg, lines: agg.lines.map(l => ({ ...l, quantity: l.quantity * k, amountCents: l.amountCents * k })) };
    const fin = engine.finalise(scaled, { gstRate: gstRate() });
    Object.assign(item, {
      ok: agg.ok, refFrom: ref.from, refTo: ref.to, referenceDays: agg.usage.days, annualisationFactor: k,
      rateAsAt: startDate, lines: fin.lines.map(l => ({ group: l.group, code: l.code, label: l.label, description: l.label, quantity: l.quantity, unit: l.unit, rate: l.rate, rateUnit: l.rateUnit, rateVaries: l.rateVaries, amountExGstCents: l.amountExGstCents })),
      subtotalCents: fin.subtotalCents, gstCents: fin.gstCents, totalCents: fin.totalCents, byGroup: fin.byGroup,
      usage: { ...agg.usage, kwhTotal: agg.usage.kwhTotal * k, kwhByBand: Object.fromEntries(Object.entries(agg.usage.kwhByBand).map(([b, v]) => [b, v * k])), mdMax: agg.demand ? agg.demand.mdMax : null, offPeakShare: agg.demand ? agg.demand.offPeakShare : null },
      monthly: results.map(monthlyBrief), notices: quoteNotices(agg, periods.length),
    });
    if (k !== 1) item.notices.push({ level: 'warn', code: 'ANNUALISED', message: `Only ${agg.usage.days} days of complete months are available, so the result is scaled by ${util.fmtNum(k, 3)} to a 365-day year.` });
    if (compare) {
      item.comparison = openTariffs().map(t => {
        const rs = periods.map(p => priceWith({ book, profile, ctx, period: p, options, tariffCode: t.tariffCode }));
        const a = engine.aggregate(rs), f = engine.finalise({ ...a, lines: a.lines.map(l => ({ ...l, amountCents: l.amountCents * k })) }, { gstRate: gstRate() });
        return { tariffCode: t.tariffCode, name: t.name, ok: a.ok, subtotalCents: f.subtotalCents, networkCents: f.byGroup.network + f.byGroup.metering, retailCents: f.byGroup.retail, mdMax: a.demand ? a.demand.mdMax : null, problem: a.ok ? '' : (rs.find(r => !r.ok).notices.find(n => n.level === 'error') || {}).message || 'Cannot be priced' };
      });
    }
    return item;
  }

  function quoteNumber() { return `Q-${today().slice(0, 4)}-${String(repo.nextSeq('quote')).padStart(4, '0')}`; }
  function totalsOf(items) {
    const t = { subtotalCents: 0, gstCents: 0, totalCents: 0, kwh: 0 };
    for (const i of items) if (i.ok) { t.subtotalCents += i.subtotalCents; t.gstCents += i.gstCents; t.totalCents += i.totalCents; t.kwh += i.usage.kwhTotal; }
    return t;
  }
  /** Create (or recalculate) a quote. items = [{ nmi, tariffCode? }] */
  function createQuote({ customerId, offerId, items, startDate, termMonths = 12, validDays = 30, notes = '', compare = true, mdBasis = 'annual' }) {
    const customer = repo.get('Customer', customerId);
    if (!customer) throw new Error('Choose a customer.');
    const offer = repo.get('RetailOffer', offerId);
    if (!offer) throw new Error('Choose a retail offer.');
    if (!items.length) throw new Error('Choose at least one NMI to quote.');
    const book = loadBook();
    const priced = items.map(it => quoteItem({ nmi: it.nmi, tariffCode: it.tariffCode || null, offerId, startDate, compare, mdBasis, book }));
    const row = {
      quoteNumber: quoteNumber(), customerId, customerName: customer.name, offerId, offerName: offer.name, status: 'Draft', startDate, termMonths, mdBasis,
      validUntil: util.addDays(today(), validDays), items: priced, totals: totalsOf(priced), notes, engineVersion: engine.VERSION, gstRate: gstRate(),
      allOk: priced.every(p => p.ok),
    };
    return repo.insert('Quote', row);
  }
  function recalcQuote(quoteId) {
    const q = repo.get('Quote', quoteId);
    if (q.status !== 'Draft') throw new Error('Only draft quotes can be recalculated.');
    const book = loadBook();
    const items = q.items.map(it => quoteItem({ nmi: it.nmi, tariffCode: it.tariffCode, offerId: q.offerId, startDate: q.startDate, compare: true, mdBasis: q.mdBasis || 'annual', book }));
    return repo.update('Quote', quoteId, { items, totals: totalsOf(items), allOk: items.every(p => p.ok), engineVersion: engine.VERSION, gstRate: gstRate() });
  }
  function setQuoteStatus(quoteId, status) { return repo.update('Quote', quoteId, { status, [status.toLowerCase() + 'At']: new Date().toISOString() }); }

  // ---- billing ------------------------------------------------------------------------------------------------------------------------------------
  const invoiceNumber = () => `INV-${String(repo.nextSeq('invoice')).padStart(6, '0')}`;
  function lastBillablePeriod() {
    const ends = repo.intervalStreams().filter(s => nem12.kindOfSuffix(s.suffix) === 'consumption').map(s => s.lastDate).sort();
    if (!ends.length) return null;
    const last = ends[0];                                   // the earliest "last day" across streams: every NMI has data to here
    const to = last === util.monthEnd(last) ? last : util.monthEnd(util.addMonths(util.monthStart(last), -1));
    return { from: util.monthStart(to), to };
  }
  /** Price each selected NMI for the period and create DRAFT invoices (nothing is issued until a person issues it). */
  function runBill({ from, to, nmis, name, includeBilled = false }) {
    if (!(from && to && to >= from)) throw new Error('Choose a valid billing period.');
    if (!nmis.length) throw new Error('Choose at least one NMI.');
    const book = loadBook(), gst = gstRate(), watermark = repo.maxReadingId(), invoiceIds = [], failures = [], skipped = [];
    const billRunId = util.uid('BR');
    repo.atomic(() => {
      for (const nmi of nmis) {
        const ctx = nmiContext(nmi, { asAt: to });
        const existing = repo.list('Invoice', i => i.nmi === nmi && i.status !== 'Void' && i.periodFrom <= to && i.periodTo >= from);
        if (existing.length && !includeBilled) { skipped.push({ nmi, reason: `Already billed on ${existing[0].invoiceNumber || existing[0].invoiceId} (${existing[0].periodFrom} to ${existing[0].periodTo})` }); continue; }
        if (!ctx.site || !ctx.customer) { failures.push({ nmi, messages: ['The NMI is not assigned to a customer site.'] }); continue; }
        if (!ctx.offer) { failures.push({ nmi, messages: [`Site ${ctx.site.name} has no retail offer assigned.`] }); continue; }
        const profile = loadProfile(nmi, leadInStart(from), to, { assumedPf: ctx.siteParams.assumedPf });
        const res = priceWith({ book, profile, ctx, period: { from, to }, options: { rateAsAt: null, rateFallback: 'none' } });
        if (!res.ok) { failures.push({ nmi, messages: res.notices.filter(n => n.level === 'error').map(n => n.message) }); continue; }
        const fin = engine.finalise(res, { gstRate: gst });
        const changed = snapshots(nmi).filter(s => s.effectiveFrom > from && s.effectiveFrom <= to && s.networkTariffCode !== (ctx.snap && ctx.snap.networkTariffCode));
        const notices = res.notices.slice();
        if (changed.length) notices.push({ level: 'warn', code: 'TARIFF_CHANGED', message: `Network tariff standing data changed during this period; the whole period is billed on ${ctx.tariffCode}.` });
        const inv = repo.insert('Invoice', {
          billRunId, invoiceNumber: null, status: 'Draft', customerId: ctx.customer.customerId, siteId: ctx.site.siteId, nmi, tariffCode: ctx.tariffCode, offerId: ctx.offer.offerId,
          periodFrom: from, periodTo: to, issueDate: null, dueDate: null, subtotalCents: fin.subtotalCents, gstCents: fin.gstCents, totalCents: fin.totalCents, gstRate: gst,
          byGroup: fin.byGroup, usage: res.usage, demand: res.demand, notices, dataWatermark: watermark, engineVersion: engine.VERSION,
          customerSnapshot: { name: ctx.customer.name, abn: ctx.customer.abn, billingAddress: ctx.customer.billingAddress || ctx.site.address, contactName: ctx.customer.contactName, paymentTermsDays: ctx.customer.paymentTermsDays },
          siteSnapshot: { name: ctx.site.name, address: ctx.site.address, meteringService: ctx.siteParams.meteringService, assumedPf: ctx.siteParams.assumedPf },
          offerName: ctx.offer.name,
        });
        repo.insertMany('InvoiceLine', fin.lines.map((l, i) => ({
          invoiceId: inv.invoiceId, lineNo: i + 1, group: l.group, code: l.code, description: l.description, detail: l.detail || '', periodFrom: l.from, periodTo: l.to,
          quantity: l.quantity, unit: l.unit, rate: l.rate, rateUnit: l.rateUnit, amountExGstCents: l.amountExGstCents, taxCode: 'GST',
        })));
        invoiceIds.push(inv.invoiceId);
      }
      repo.insert('BillRun', { billRunId, name: name || `Bill run ${util.fmtDate(from)} to ${util.fmtDate(to)}`, periodFrom: from, periodTo: to, status: 'Completed', dataWatermark: watermark, engineVersion: engine.VERSION, settings: { ...engineSettings(), gstRate: gst }, invoiceIds, failures, skipped });
      for (const f of failures) addTask({ title: `Bill run could not price NMI ${f.nmi}`, description: f.messages.join(' '), priority: 'High', relatedType: 'BillRun', relatedId: billRunId });
    });
    return repo.get('BillRun', billRunId);
  }
  function issueInvoices(ids) {
    const out = [];
    repo.atomic(() => {
      for (const id of ids) {
        const inv = repo.get('Invoice', id);
        if (!inv || inv.status !== 'Draft') continue;
        const days = (inv.customerSnapshot && inv.customerSnapshot.paymentTermsDays) || 14;
        out.push(repo.update('Invoice', id, { status: 'Issued', invoiceNumber: invoiceNumber(), issueDate: today(), dueDate: util.addDays(today(), days) }));
      }
    });
    return out;
  }
  const markPaid = id => repo.update('Invoice', id, { status: 'Paid', paidDate: today() });
  const voidInvoice = (id, reason) => repo.update('Invoice', id, { status: 'Void', voidReason: reason || '', voidedAt: new Date().toISOString() });
  /** Intervals whose current version was loaded AFTER this invoice was calculated (data revised since billing). */
  function revisedSinceBilling(inv) {
    let intervals = 0, kwhDelta = 0;
    for (const s of repo.intervalStreams().filter(x => x.nmi === inv.nmi && nem12.kindOfSuffix(x.suffix) === 'consumption')) {
      const then = new Map(repo.currentIntervals(inv.nmi, s.suffix, inv.periodFrom, inv.periodTo, { maxId: inv.dataWatermark }).map(r => [r.intervalDate + '|' + r.intervalNo, r]));
      for (const r of repo.currentIntervals(inv.nmi, s.suffix, inv.periodFrom, inv.periodTo)) {
        const o = then.get(r.intervalDate + '|' + r.intervalNo);
        if (!o || o.readingId !== r.readingId) { intervals++; kwhDelta += r.value - (o ? o.value : 0); }
      }
    }
    return { intervals, kwhDelta };
  }

  // ---- market transactions ------------------------------------------------------------------------------------------------------------------------
  const MARKET_TYPES = {
    'Customer transfer request': ['Confirm the customer has signed the contract and consented to the transfer', 'Confirm NMI standing data and network tariff with the network operator', 'Schedule the first meter-data load and bill run'],
    'Standing data request': ['Load the returned standing data into the NMI record'],
    'Meter data request': ['Ingest the returned NEM12 file and review its validation report'],
    'Network tariff change': ['Confirm the new network tariff effective date and record it in standing data'],
    'Customer details update': [],
    Other: [],
  };
  const MARKET_STATUSES = ['Draft', 'Submitted', 'Acknowledged', 'Completed', 'Rejected', 'Cancelled'];
  function createMarketTransaction({ type, nmi, customerId, proposedDate, reference, notes }) {
    let txn;
    repo.atomic(() => {
      txn = repo.insert('MarketTransaction', { type, nmi: nmi || null, customerId: customerId || null, status: 'Draft', proposedDate: proposedDate || null, reference: reference || '', notes: notes || '', history: [{ at: new Date().toISOString(), status: 'Draft', note: 'Created' }] });
      for (const title of MARKET_TYPES[type] || []) addTask({ title: `${title}${nmi ? ' (' + nmi + ')' : ''}`, description: `Follow-up for ${type.toLowerCase()} ${txn.txnId}.`, relatedType: 'MarketTransaction', relatedId: txn.txnId, dueDate: proposedDate || null });
    });
    return txn;
  }
  function advanceMarketTransaction(txnId, status, note = '') {
    const t = repo.get('MarketTransaction', txnId);
    return repo.update('MarketTransaction', txnId, { status, history: [...(t.history || []), { at: new Date().toISOString(), status, note }] });
  }

  // ---- demo setup -------------------------------------------------------------------------------------------------------------------------------------
  const DEMO_OFFER = 'OF-DEMO';
  function demoOfferRates() {
    const r = (tariffCode, componentCode, bandCode, value, unit, note = '') => ({ rateId: `${DEMO_OFFER}.${tariffCode === '*' ? 'ALL' : tariffCode}.${componentCode}.${bandCode || '-'}`, ownerCode: DEMO_OFFER, tariffCode, componentCode, bandCode, lowerKva: null, upperKva: null, value, unit, effectiveFrom: '2026-07-01', effectiveTo: null, source: 'Demo offer (illustrative prices)', note });
    return [
      r('RT2', 'RET_ENERGY', 'ALL', 12.80, 'c/kWh'),
      r('RT34', 'RET_ENERGY', 'ON_PEAK', 18.50, 'c/kWh'), r('RT34', 'RET_ENERGY', 'SHOULDER', 13.00, 'c/kWh'), r('RT34', 'RET_ENERGY', 'OFF_PEAK', 10.20, 'c/kWh'), r('RT34', 'RET_ENERGY', 'SUPER_OFF_PEAK', 6.90, 'c/kWh'),
      r('RT6', 'RET_ENERGY', 'ON_PEAK', 14.20, 'c/kWh'), r('RT6', 'RET_ENERGY', 'OFF_PEAK', 9.40, 'c/kWh'),
      r('*', 'RET_FIXED', '', 90, 'c/day', 'Retail service fee'),
      r('*', 'RET_OTHER_KWH', 'ENV', 1.90, 'c/kWh', 'Market and environmental charges'),
    ];
  }
  /** Demo customers, sites, NMI assignment, tariffs and a retail offer (the NEM12 data comes through ingestUpload). */
  function setupDemoEntities() {
