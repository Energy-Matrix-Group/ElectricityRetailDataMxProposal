<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electricity Retail Prototype</title>
<meta name="description" content="Single-file prototype: NEM12 ingestion, Western Power tariff book, calculation engine, quotes and bills for contestable SWIS customers.">
<!--
  Electricity retail prototype — ONE self-contained file (HTML + CSS + JS).
  External libraries come only from cdnjs.cloudflare.com (pinned versions, SRI hashes):
    JSZip 3.10.1   reads .zip uploads          SheetJS 0.18.5   Excel export
  Code sections (search for "SECTION"): 1 util · 2 storage + rawStore · 3 repo · 4 nem12 (+ sample generator)
  · 5 seed data · 6 engine · 7 svc · 8 ui (core + screens) · 9 boot.
  Data is persisted in localStorage behind the repo layer; use Export / Import (JSON) to back up.
-->
<style>

/* ============================================================================
   SECTION 1 — util
   Pure helpers used by every other section (no DOM, no storage).

<script data-section="storage-rawstore">
/* ============================================================================
   SECTION 2 — storage driver + rawStore
   storage  : thin key/value driver over localStorage (falls back to memory when the
              browser blocks storage). Production equivalent: connection to SQL Server /
              Azure Blob. Nothing outside `rawStore` and `repo` may call it.
   rawStore : stands in for Azure Blob Storage. Every uploaded file is kept unchanged:
              { fileId, fileName, uploadedAt, sha256, content }  (+ size, encoding).
              WRITE-ONCE: there is no update and no delete.
   ============================================================================ */
class StorageError extends Error {
  constructor(message, detail) {
    super(message);
    this.name = 'StorageError';
    this.quota = !!(detail && detail.quota);
    this.detail = detail || null;
  }
}

const storage = (() => {
  'use strict';
  const PREFIX = 'erp1.';
  const QUOTA_ESTIMATE_CHARS = 5000000;   // typical browser limit (~5M UTF-16 code units); approximate
  const mem = new Map();
  const listeners = [];
  let ls = null, mode = 'memory', lastError = null;

  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      localStorage.setItem(PREFIX + '__probe', '1');
      localStorage.removeItem(PREFIX + '__probe');
      ls = localStorage;
      mode = 'localStorage';
    }
  } catch (e) {
    ls = null;
    lastError = { message: 'Browser storage is unavailable: ' + (e && e.message), quota: false };
  }

  const isQuota = e => !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);

  function get(key) {
    try { return ls ? ls.getItem(PREFIX + key) : (mem.has(key) ? mem.get(key) : null); } catch (e) { return null; }
  }
  function set(key, value) {
    try {
      if (ls) ls.setItem(PREFIX + key, value); else mem.set(key, value);
      return true;
    } catch (e) {
      lastError = { key, message: (e && e.message) || String(e), quota: isQuota(e), at: Date.now() };
      listeners.forEach(f => { try { f(lastError); } catch (_) { /* listener errors must not mask the storage error */ } });
      return false;
    }
  }
  function remove(key) {
    try { if (ls) ls.removeItem(PREFIX + key); else mem.delete(key); } catch (e) { /* ignore */ }
  }

    const out = [];
    try {
      if (ls) {
        for (let i = 0; i < ls.length; i++) {
          const k = ls.key(i);
          if (k && k.startsWith(PREFIX + prefix)) out.push(k.slice(PREFIX.length));
        }
      } else for (const k of mem.keys()) if (k.startsWith(prefix)) out.push(k);
    } catch (e) { /* ignore */ }
    return out;
  }
  function usage() {
    let chars = 0;
    const ks = keys();
    for (const k of ks) { const v = get(k); chars += k.length + PREFIX.length + (v ? v.length : 0); }
    return { chars, keys: ks.length, quotaChars: QUOTA_ESTIMATE_CHARS, mode };
  }

  function clearAll() { for (const k of keys()) remove(k); }
  function restore(snap) { clearAll(); for (const k of Object.keys(snap)) set(k, snap[k]); }
  function onError(fn) { listeners.push(fn); }

  return { get, set, remove, keys, usage, snapshot, restore, clearAll, onError, get mode() { return mode; }, get lastError() { return lastError; } };
})();

const rawStore = (() => {
  'use strict';
  const IDX_KEY = 'raw.idx';
  const CONTENT_PREFIX = 'raw.c.';

    if (!Array.isArray(index)) index = [];

    'Use "Export all data (JSON)" to back up, then remove old data (Data screen) or import into a fresh browser profile.';

   * Store a file exactly as uploaded. `bytes` is a Uint8Array of the original file.
   * Text that survives a lossless UTF-8 round trip is stored as text; anything else

    if (!storage.set(CONTENT_PREFIX + fileId, content)) throw new StorageError(quotaMsg(`"${fileName}"`, bytes.length), storage.lastError);
    index.push(meta);

  function get(fileId) {
    const m = index.find(x => x.fileId === fileId);
    if (!m) return null;
    return Object.freeze({ ...m, content: storage.get(CONTENT_PREFIX + fileId) });
  }
  function getBytes(fileId) {
    const r = get(fileId);
    if (!r || r.content == null) return null;
    return r.encoding === 'base64' ? util.base64ToBytes(r.content) : util.utf8Bytes(r.content);
  }
  /** Re-hash the stored content and compare with the sha256 recorded at upload. */
  function verify(fileId) {
    const bytes = getBytes(fileId), m = meta(fileId);
    return !!(bytes && m && util.sha256Hex(bytes) === m.sha256);
  }
  const totalBytes = () => index.reduce((s, x) => s + (x.size || 0), 0);

  // Write-once: these exist only to make the policy explicit and testable.
  const update = () => { throw new Error('rawStore is write-once: files cannot be edited'); };
  const remove = () => { throw new Error('rawStore is write-once: files cannot be deleted'); };

  // Backup / restore support (used only by repo.exportAll / repo.importAll).
  const exportAll = () => index.map(m => ({ ...m, content: storage.get(CONTENT_PREFIX + m.fileId) }));
  function restoreAll(records) {
    for (const k of storage.keys(CONTENT_PREFIX)) storage.remove(k);
    index = [];
    for (const r of records) {
      const { content, ...m } = r;
      if (!storage.set(CONTENT_PREFIX + m.fileId, content)) throw new StorageError(quotaMsg(`"${m.fileName}"`, m.size || 0), storage.lastError);
      index.push(m);
    }
    if (!storage.set(IDX_KEY, JSON.stringify(index))) throw new StorageError(quotaMsg('the file index', 0), storage.lastError);
  }

  load();
  return { put, list, meta, get, getBytes, findBySha, verify, totalBytes, update, remove, exportAll, restoreAll, reload: load };
})();

<script data-section="repo">
/* ============================================================================
   SECTION 3 — repo
   Stands in for SQL Server: one collection per table, named as the future tables.
   ALL data access goes through these functions (get / list / insert / update …);
   no UI or engine code touches storage.

   Persistence layout (localStorage keys, prefix "erp1."):
     meta                – schema version + counters
     t.<Table>           – JSON array of rows for every ordinary table
     iv.<sourceFileId>   – IntervalReading rows for one source file, packed as
                           day-blocks (one block per 300 record) to fit browser quota.
                           In SQL Server this is one row per interval.
   Rows handed out by the repo are frozen: change data only via update().
   ============================================================================ */
const repo = (() => {
  'use strict';
  const FORMAT = 'electricity-retail-prototype-backup';
  const SCHEMA_VERSION = 1;
  const INTERVAL = 'IntervalReading';

  /** Table catalogue. `sql` documents the intended SQL Server table. */
  const TABLES = {
    Customer: { pk: 'customerId', prefix: 'C', sql: 'dbo.Customer' },
    Site: { pk: 'siteId', prefix: 'S', sql: 'dbo.Site (FK CustomerId)' },
    Nmi: { pk: 'nmi', sql: 'dbo.Nmi (PK = 10-char NMI, FK SiteId nullable)' },
    StandingDataSnapshot: { pk: 'snapshotId', prefix: 'SD', immutable: true, sql: 'dbo.StandingDataSnapshot (append-only history per NMI)' },
    MeterDataFile: { pk: 'fileId', sql: 'dbo.MeterDataFile (FileId = blob name in rawStore)' },
    [INTERVAL]: { pk: 'readingId', immutable: true, special: true, sql: 'dbo.IntervalReading (bigint identity; one row per interval version; never updated)' },
    NetworkTariff: { pk: 'tariffCode', sql: 'dbo.NetworkTariff' },
    TariffComponent: { pk: 'componentId', prefix: 'TC', sql: 'dbo.TariffComponent' },
    TimeBand: { pk: 'timeBandId', prefix: 'TB', sql: 'dbo.TimeBand' },
    Rate: { pk: 'rateId', prefix: 'R', sql: 'dbo.Rate (EffectiveFrom date, EffectiveTo date NULL)' },
    PublicHoliday: { pk: 'holidayId', prefix: 'PH', sql: 'dbo.PublicHoliday' },
    RetailOffer: { pk: 'offerId', prefix: 'OF', sql: 'dbo.RetailOffer' },
    Quote: { pk: 'quoteId', prefix: 'Q', sql: 'dbo.Quote (+ calc snapshot as JSON/child tables)' },
    BillRun: { pk: 'billRunId', prefix: 'BR', sql: 'dbo.BillRun' },
    Invoice: { pk: 'invoiceId', prefix: 'INV', sql: 'dbo.Invoice' },
    InvoiceLine: { pk: 'invoiceLineId', prefix: 'IL', sql: 'dbo.InvoiceLine (FK InvoiceId)' },
    MarketTransaction: { pk: 'txnId', prefix: 'MT', sql: 'dbo.MarketTransaction' },
    Task: { pk: 'taskId', prefix: 'T', sql: 'dbo.Task' },
    Setting: { pk: 'key', sql: 'dbo.Setting (key/value configuration)' },
  };
  const NORMAL = Object.keys(TABLES).filter(n => !TABLES[n].special);

  let meta = { schemaVersion: SCHEMA_VERSION, counters: {}, flags: {}, createdAt: new Date().toISOString() };
  let tables = {};
  let iv = { byStream: new Map(), byFile: new Map(), count: 0, maxId: 0 };
  let loadErrors = [];
  let txn = null;

  const def = name => { const d = TABLES[name]; if (!d) throw new Error('Unknown table: ' + name); return d; };
  const safeParse = s => { try { return s ? JSON.parse(s) : null; } catch (e) { return undefined; } };
  const round9 = x => Math.round(x * 1e9) / 1e9;
  const quotaError = (what) => new StorageError(
    `Could not save ${what}: browser storage is full or unavailable. Your last change was NOT saved. ` +
    'Use "Export all data (JSON)" to back up, then free space on the Data screen.', storage.lastError);

  // ---- persistence of ordinary tables ----------------------------------------------
  function persistTable(name) {
    if (!storage.set('t.' + name, JSON.stringify(Array.from(tables[name].values())))) throw quotaError(name);
  }
  function saveMeta() {
    if (!storage.set('meta', JSON.stringify(meta))) throw quotaError('settings');
  }
  function touch(name) { if (txn && !txn.snap.has(name)) txn.snap.set(name, new Map(tables[name])); }

  // ---- interval codec: rows <-> day-blocks ---------------------------------------------
  function encodeBlock(run) {
    const r0 = run[0];
    const ids = run.map(r => r.readingId);
    const consecutive = ids.every((id, i) => id === ids[0] + i);
    const q = [];
    for (const r of run) {
      const last = q[q.length - 1], m = r.method || '', rc = r.reasonCode || '', rd = r.reasonDescription || '';
      if (last && last[0] === r.quality && last[1] === m && last[3] === rc && last[4] === rd) last[2]++;
      else q.push([r.quality, m, 1, rc, rd]);
    }
    // The unit factor is stored in the block, so stored history never depends on a later change to the UOM table.
    const factor = (util.uomInfo(r0.uom) || { factor: 1 }).factor;
    return {
      i: consecutive ? ids[0] : undefined, ids: consecutive ? undefined : ids, k: r0.intervalNo,
      n: r0.nmi, s: r0.suffix, r: r0.registerId || '', m: r0.meterSerial || '', d: r0.intervalDate, l: r0.intervalLength,
      u: r0.uom, nu: r0.unit, f: factor, x: run.map(r => r.rawValue), q,
      ud: r0.updateDateTime, ml: r0.msatsLoadDateTime || '', sl: r0.sourceLine || 0,
    };
  }

  function encodeChunk(fileId, rows) {
    const groups = new Map();
    for (const r of rows) {
      const gk = [r.nmi, r.suffix, r.intervalDate, r.updateDateTime, r.msatsLoadDateTime || '', r.registerId || '', r.meterSerial || '', r.intervalLength, r.uom, r.sourceLine || 0].join('|');
      (groups.get(gk) || groups.set(gk, []).get(gk)).push(r);
    }
    const blocks = [];
    for (const g of groups.values()) {
      g.sort((a, b) => a.intervalNo - b.intervalNo);
      let run = [g[0]];
      for (let i = 1; i < g.length; i++) {
        if (g[i].intervalNo === g[i - 1].intervalNo + 1) run.push(g[i]);
        else { blocks.push(encodeBlock(run)); run = [g[i]]; }
      }
      blocks.push(encodeBlock(run));
    }
    blocks.sort((a, b) => (a.i != null ? a.i : a.ids[0]) - (b.i != null ? b.i : b.ids[0]));
    return JSON.stringify({ v: 1, f: fileId, b: blocks });
  }
  function decodeChunk(chunk) {
    const rows = [];
    for (const b of chunk.b) {
      const N = b.x.length;
      let qi = 0, qleft = 0, qcur = null;
      for (let j = 0; j < N; j++) {
        if (qleft === 0) { qcur = b.q[qi++]; qleft = qcur[2]; }
        qleft--;
        const intervalNo = b.k + j;
        rows.push(Object.freeze({
          readingId: b.ids ? b.ids[j] : b.i + j, nmi: b.n, suffix: b.s, registerId: b.r, meterSerial: b.m,
          intervalDate: b.d, intervalNo, intervalLength: b.l, startMinute: (intervalNo - 1) * b.l,
          uom: b.u, unit: b.nu, rawValue: b.x[j], value: round9(b.x[j] * b.f),
          quality: qcur[0], method: qcur[1], reasonCode: qcur[3], reasonDescription: qcur[4],
          updateDateTime: b.ud, msatsLoadDateTime: b.ml, sourceFileId: chunk.f, sourceLine: b.sl,
        }));
      }
    }
    return rows;
  }
  function addRowsToIndex(rows) {
    for (const r of rows) {
      const key = r.nmi + '|' + r.suffix;
      let byDate = iv.byStream.get(key);
      if (!byDate) iv.byStream.set(key, (byDate = new Map()));
      const dayRows = byDate.get(r.intervalDate);
      if (dayRows) dayRows.push(r); else byDate.set(r.intervalDate, [r]);
      const fr = iv.byFile.get(r.sourceFileId);
      if (fr) fr.push(r); else iv.byFile.set(r.sourceFileId, [r]);
      if (r.readingId > iv.maxId) iv.maxId = r.readingId;
      iv.count++;
    }
  }

  // ---- load -----------------------------------------------------------------------------
  function loadFromStorage() {
    loadErrors = [];
    const m = safeParse(storage.get('meta'));
    if (m === undefined) loadErrors.push('Settings record is corrupt and was reset.');
    meta = m && typeof m === 'object' ? { schemaVersion: SCHEMA_VERSION, counters: {}, flags: {}, ...m } : { schemaVersion: SCHEMA_VERSION, counters: {}, flags: {}, createdAt: new Date().toISOString() };
    tables = {};
    for (const name of NORMAL) {
      const map = new Map();
      const arr = safeParse(storage.get('t.' + name));
      if (arr === undefined) loadErrors.push(`Table ${name} is corrupt in browser storage and was skipped.`);
      for (const row of Array.isArray(arr) ? arr : []) map.set(row[TABLES[name].pk], util.deepFreeze(row));
      tables[name] = map;
    }
    iv = { byStream: new Map(), byFile: new Map(), count: 0, maxId: 0 };
    streamsMemo = { count: -1, value: null };
    for (const k of storage.keys('iv.')) {
      const chunk = safeParse(storage.get(k));
      if (!chunk || !Array.isArray(chunk.b)) { loadErrors.push(`Interval chunk ${k} is corrupt and was skipped.`); continue; }
      addRowsToIndex(decodeChunk(chunk));
    }
    iv.maxId = Math.max(iv.maxId, meta.counters.reading | 0);
    rawStore.reload();
  }

  // ---- generic CRUD -----------------------------------------------------------------------
  const matcher = where => (typeof where === 'function' ? where : where ? (r => Object.keys(where).every(k => r[k] === where[k])) : null);

  function get(table, id) {
    if (def(table).special) { for (const rows of iv.byFile.values()) for (const r of rows) if (r.readingId === id) return r; return null; }
    return tables[table].get(id) || null;
  }
  function list(table, where) {
    const m = matcher(where);
    if (def(table).special) {
      const out = [];
      for (const rows of iv.byFile.values()) for (const r of rows) if (!m || m(r)) out.push(r);
      return out.sort((a, b) => a.readingId - b.readingId);
    }
    const all = Array.from(tables[table].values());
    return m ? all.filter(m) : all;
  }
  const find = (table, where) => list(table, where)[0] || null;
  const count = table => (def(table).special ? iv.count : tables[table].size);

  function insert(table, row) {
    const d = def(table);
    if (d.special) throw new Error('Use repo.insertReadings() for IntervalReading');
    return insertMany(table, [row])[0];
  }
  function insertMany(table, rows) {
    const d = def(table);
    if (d.special) throw new Error('Use repo.insertReadings() for IntervalReading');
    const t = tables[table], now = new Date().toISOString(), added = [];
    touch(table);
    try {
      for (const row of rows) {
        const r = util.clone(row);
        if (r[d.pk] == null || r[d.pk] === '') r[d.pk] = util.uid(d.prefix);
        if (t.has(r[d.pk])) throw new Error(`${table}: duplicate key ${r[d.pk]}`);
        r.createdAt = r.createdAt || now;
        r.modifiedAt = now;
        t.set(r[d.pk], util.deepFreeze(r));
        added.push(r);
      }
      persistTable(table);
    } catch (e) {
      for (const r of added) t.delete(r[d.pk]);
      throw e;
    }
    return added;
  }
  function update(table, id, patch) {
    const d = def(table);
    if (d.immutable) throw new Error(`${table} is append-only: rows are never updated`);
    const t = tables[table], old = t.get(id);
    if (!old) throw new Error(`${table}: ${id} not found`);
    touch(table);
    const next = util.deepFreeze({ ...old, ...util.clone(patch), [d.pk]: id, createdAt: old.createdAt, modifiedAt: new Date().toISOString() });
    t.set(id, next);
    try { persistTable(table); } catch (e) { t.set(id, old); throw e; }
    return next;
  }
  function remove(table, id) {
    const d = def(table);
    if (d.immutable) throw new Error(`${table} is append-only: rows are never deleted`);
    const t = tables[table], old = t.get(id);
    if (!old) return false;
    touch(table);
    t.delete(id);
    try { persistTable(table); } catch (e) { t.set(id, old); throw e; }
    return true;
  }
  /** Run several repo calls as one unit; on error every touched table is restored. */
  function atomic(fn) {
    if (txn) return fn();
    txn = { snap: new Map(), counters: JSON.stringify(meta.counters), flags: JSON.stringify(meta.flags) };
    try {
      const out = fn();
      txn = null;
      return out;
    } catch (e) {
      const t = txn;
      txn = null;
      for (const [name, rows] of t.snap) { tables[name] = rows; try { persistTable(name); } catch (_) { /* best effort */ } }
      meta.counters = JSON.parse(t.counters);
      meta.flags = JSON.parse(t.flags);
      try { saveMeta(); } catch (_) { /* best effort */ }
      throw e;
    }
  }
  /** Next integer in a named sequence (quote / invoice numbering). */
  function nextSeq(name) {
    meta.counters[name] = (meta.counters[name] | 0) + 1;
    saveMeta();
    return meta.counters[name];
  }
  const getFlag = k => meta.flags[k];
  function setFlag(k, v) { meta.flags[k] = v; saveMeta(); }

  // ---- IntervalReading: append-only, versioned -------------------------------------------------
  /**
   * Append interval rows. Every interval is a NEW row (with its UpdateDateTime and
   * sourceFileId); nothing already stored is ever changed. Assigns readingId (identity).
   */
  function insertReadings(rows) {
    if (!rows.length) return { inserted: 0, firstId: null, lastId: null };
    if (rows.some(r => !r.sourceFileId)) throw new Error('IntervalReading rows must carry a sourceFileId');
    const base = iv.maxId;
    const stamped = rows.map((r, i) => Object.freeze({ ...r, readingId: base + 1 + i }));
    const writes = [];
    for (const [fileId, fileRows] of util.groupBy(stamped, r => r.sourceFileId)) {
      writes.push([fileId, encodeChunk(fileId, (iv.byFile.get(fileId) || []).concat(fileRows))]);
    }
    const undo = [];
    for (const [fileId, text] of writes) {
      const key = 'iv.' + fileId, prev = storage.get(key);
      if (!storage.set(key, text)) {
        for (const [k, p] of undo) { if (p === null) storage.remove(k); else storage.set(k, p); }
        throw quotaError('interval data');
      }
      undo.push([key, prev]);
    }
    addRowsToIndex(stamped);
    meta.counters.reading = iv.maxId;
    try { saveMeta(); } catch (_) { /* counter is re-derived from the data on load */ }
    return { inserted: stamped.length, firstId: base + 1, lastId: base + stamped.length };
  }

  const isNewer = (a, b) => a.updateDateTime > b.updateDateTime || (a.updateDateTime === b.updateDateTime && a.readingId > b.readingId);
  /**
   * Latest version of every interval of one day: highest UpdateDateTime wins, ties go to
   * the most recently loaded row. If the winning version uses a different interval length
   * than older versions, only rows of the winning interval length are returned.
   */
  function pickCurrentForDay(rows, filter) {
    let win = null;
    for (const r of rows) { if ((!filter || filter(r)) && (!win || isNewer(r, win))) win = r; }
    if (!win) return [];
    const best = new Map();
    for (const r of rows) {
      if (r.intervalLength !== win.intervalLength || (filter && !filter(r))) continue;
      const cur = best.get(r.intervalNo);
      if (!cur || isNewer(r, cur)) best.set(r.intervalNo, r);
    }
    return Array.from(best.values()).sort((a, b) => a.intervalNo - b.intervalNo);
  }
  const filterFor = opts => {
    if (!opts || (opts.maxId == null && !opts.asAt)) return null;
    return r => (opts.maxId == null || r.readingId <= opts.maxId) && (!opts.asAt || r.updateDateTime <= opts.asAt);
  };
  /**
   * currentIntervals(nmi, suffix, from, to) — the latest UpdateDateTime per interval.
   *   from / to : inclusive ISO dates
   *   opts.maxId: only rows loaded up to this readingId (data as known at a bill run)
   *   opts.asAt : only versions with UpdateDateTime <= this 14-digit stamp
   */
  function currentIntervals(nmi, suffix, from, to, opts) {
    const byDate = iv.byStream.get(nmi + '|' + suffix);
    if (!byDate) return [];
    const filter = filterFor(opts), out = [];
    for (let d = util.dayNum(from), e = util.dayNum(to); d <= e; d++) {
      const rows = byDate.get(util.fromDayNum(d));
      if (rows) for (const r of pickCurrentForDay(rows, filter)) out.push(r);
    }
    return out;
  }
  /** Every stored version of every interval of one day (for the version-history view). */
  function readingVersions(nmi, suffix, date) {
    const byDate = iv.byStream.get(nmi + '|' + suffix);
    return byDate && byDate.has(date) ? byDate.get(date).slice().sort((a, b) => a.intervalNo - b.intervalNo || (isNewer(a, b) ? -1 : 1)) : [];
  }
  /** One summary row per (NMI, datastream suffix) from the current versions (memoised until rows are added). */
  let streamsMemo = { count: -1, value: null };
  function intervalStreams() {
    if (streamsMemo.count === iv.count && streamsMemo.value) return streamsMemo.value;
    const out = [];
    for (const [key, byDate] of iv.byStream) {
      const [nmi, suffix] = key.split('|');
      let first = null, last = null, rowsTotal = 0, current = 0, lastUpdate = '', L = null, uom = null, unit = null, registerId = '';
      const quality = {};
      for (const [d, rows] of byDate) {
        if (first === null || d < first) first = d;
        if (last === null || d > last) last = d;
        rowsTotal += rows.length;
        for (const r of pickCurrentForDay(rows)) {
          current++;
          quality[r.quality] = (quality[r.quality] || 0) + 1;
          if (r.updateDateTime > lastUpdate) { lastUpdate = r.updateDateTime; L = r.intervalLength; uom = r.uom; unit = r.unit; registerId = r.registerId; }
        }
      }
      out.push({ nmi, suffix, registerId, intervalLength: L, uom, unit, firstDate: first, lastDate: last, days: byDate.size, rowsTotal, rowsCurrent: current, quality, lastUpdate });
    }
    out.sort((a, b) => (a.nmi + a.suffix < b.nmi + b.suffix ? -1 : 1));
    streamsMemo = { count: iv.count, value: Object.freeze(out) };
    return streamsMemo.value;
  }
  const maxReadingId = () => iv.maxId;
  const readingsForFile = fileId => (iv.byFile.get(fileId) || []).slice();

  // ---- backup / restore / reset ---------------------------------------------------------------------
  function exportAll() {
    const out = {
      format: FORMAT, schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(),
      meta: { counters: meta.counters, flags: meta.flags, createdAt: meta.createdAt },
      tables: {}, intervalChunks: {}, rawFiles: rawStore.exportAll(),
    };
    for (const name of NORMAL) out.tables[name] = Array.from(tables[name].values());
    for (const [fileId, rows] of iv.byFile) out.intervalChunks[fileId] = JSON.parse(encodeChunk(fileId, rows));
    return out;
  }
  /** Same document as exportAll() but built without parsing the interval chunks again (large backups). */
  function exportJson() {
    const tabs = {};
    for (const name of NORMAL) tabs[name] = Array.from(tables[name].values());
    const chunks = [];
    for (const [fileId, rows] of iv.byFile) chunks.push(JSON.stringify(fileId) + ':' + encodeChunk(fileId, rows));
    return '{"format":' + JSON.stringify(FORMAT) + ',"schemaVersion":' + SCHEMA_VERSION + ',"exportedAt":' + JSON.stringify(new Date().toISOString()) +
      ',"meta":' + JSON.stringify({ counters: meta.counters, flags: meta.flags, createdAt: meta.createdAt }) +
      ',"tables":' + JSON.stringify(tabs) + ',"intervalChunks":{' + chunks.join(',') + '},"rawFiles":' + JSON.stringify(rawStore.exportAll()) + '}';
  }
  /** Replace ALL data with a backup produced by exportAll()/exportJson(). Rolls back if it cannot be stored. */
  function importAll(doc) {
    if (!doc || doc.format !== FORMAT) throw new Error('Not a backup file from this prototype (missing format marker).');
    if (!(doc.schemaVersion <= SCHEMA_VERSION)) throw new Error(`Backup schema version ${doc.schemaVersion} is newer than this app (${SCHEMA_VERSION}).`);
    const snap = storage.snapshot();
    try {
      storage.clearAll();
      const m = { schemaVersion: SCHEMA_VERSION, counters: {}, flags: {}, createdAt: new Date().toISOString(), ...(doc.meta || {}) };
      if (!storage.set('meta', JSON.stringify(m))) throw quotaError('imported settings');
      for (const name of NORMAL) {
        const rows = (doc.tables && doc.tables[name]) || [];
        if (!storage.set('t.' + name, JSON.stringify(rows))) throw quotaError(name);
      }
      for (const [fileId, chunk] of Object.entries(doc.intervalChunks || {})) {
        if (!storage.set('iv.' + fileId, JSON.stringify(chunk))) throw quotaError('interval data');
      }
      rawStore.restoreAll(doc.rawFiles || []);
      loadFromStorage();
    } catch (e) {
      storage.restore(snap);
      loadFromStorage();
      throw e;
    }
  }
  /** Delete everything (raw files included). Only used by the explicit "erase all data" action. */
  function resetAll() {
    storage.clearAll();
    loadFromStorage();
  }

  function stats() {
    const rowsPerTable = {};
    for (const name of Object.keys(TABLES)) rowsPerTable[name] = count(name);
    return { rowsPerTable, raw: { files: rawStore.list().length, bytes: rawStore.totalBytes() }, storage: storage.usage(), loadErrors: loadErrors.slice() };
  }

  loadFromStorage();
  return {
    TABLES, SCHEMA_VERSION, get, list, find, count, insert, insertMany, update, remove, atomic, nextSeq, getFlag, setFlag,
    insertReadings, currentIntervals, readingVersions, intervalStreams, maxReadingId, readingsForFile, pickCurrentVersion: pickCurrentForDay,
    exportAll, exportJson, importAll, resetAll, stats, reload: loadFromStorage,
    get loadErrors() { return loadErrors; },
  };
})();

<script data-section="nem12">
/* ============================================================================
   SECTION 4 — nem12  (pure functions: no DOM, no storage)
   Parser + validator for NEM12 interval-metering files, the 2004 NEMMCO MDFF
   specification v007 used in Western Australia.

     100  header            100,NEM12,CCYYMMDDhhmm,FromParticipant,ToParticipant
     200  NMI data details  200,NMI,NMIConfiguration,RegisterID,NMISuffix,MDMDataStreamIdentifier,
                                MeterSerialNumber,UOM,IntervalLength,NextScheduledReadDate
     300  interval data     300,IntervalDate,Value1..ValueN,QualityMethod,ReasonCode,ReasonDescription,
                                UpdateDateTime,MSATSLoadDateTime
     400  interval event    400,StartInterval,EndInterval,QualityMethod,ReasonCode,ReasonDescription
     500  B2B details       500,TransCode,RetServiceOrder,ReadDateTime,IndexRead
     900  end of data

   N = 1440 / IntervalLength (read from the 200 record, never assumed to be 48).
   Interval k covers [(k-1)*L, k*L) minutes after midnight; for 30-minute data interval 1
   is the period ENDING 00:30 and interval 48 ends at 00:00 of the next day. Its start
   time (used for time bands) is therefore (k-1)*L minutes.
   ============================================================================ */
const nem12 = (() => {
  'use strict';

  const QUALITY_FLAGS = {
    A: 'Actual', E: 'Forward estimate', F: 'Final substitute', N: 'Null (value 0 = MISSING)', S: 'Substituted', V: 'Variable (flags in 400 records)',
  };
  const B2B_TRANS_CODES = 'ACDEGNORS';
  const SUFFIX_KIND = { E: 'consumption', B: 'export', Q: 'reactive', K: 'reactive' };
  const SUFFIX_LABEL = { consumption: 'Consumption (energy out of the network)', export: 'Export (energy into the grid, e.g. solar)', reactive: 'Reactive energy', other: 'Other / not used by pricing' };
  const kindOfSuffix = s => SUFFIX_KIND[String(s || '').charAt(0).toUpperCase()] || 'other';
  const VALID_LENGTHS = [1, 5, 10, 15, 30];
  const NUMERIC = /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
  const QUALITY_TOKEN = /^[A-Za-z]\d{0,2}$/;
  const MAX_KEPT = { error: 2000, warning: 2000, info: 300 };

  const fmtRanges = rs => rs.map(([a, b]) => (a === b ? String(a) : a + '–' + b)).join(', ');

  /** Which intervals are covered by 400 records? Returns uncovered and multiply-covered ranges (1-based, inclusive). */
  function checkCoverage(events, N) {
    const cover = new Uint16Array(N + 2);
    for (const e of events) for (let i = e.start; i <= e.end; i++) cover[i]++;
    const gaps = [], overlaps = [];
    let gs = 0, os = 0;
    for (let i = 1; i <= N + 1; i++) {
      const c = i <= N ? cover[i] : 1;
      if (c === 0) { if (!gs) gs = i; } else if (gs) { gaps.push([gs, i - 1]); gs = 0; }
      if (c > 1) { if (!os) os = i; } else if (os) { overlaps.push([os, i - 1]); os = 0; }
    }
    return { gaps, overlaps };
  }

  /**
   * parse(text) -> { header, blocks[], trailer, issues[], issueTotals, issueByCode, counts, streams[], fatal, fatalReason }
   * Never throws on bad input: every problem becomes an issue with a line number.
   *   sev 'error'   : the record/day is not usable (its data is NOT ingested) or the structure is wrong
   *   sev 'warning' : data is accepted but something is unusual
   */
  function parse(text) {
    text = String(text == null ? '' : text);
    const issues = [], totals = { error: 0, warning: 0, info: 0 }, byCode = {}, kept = { error: 0, warning: 0, info: 0 };
    const add = (sev, code, line, msg, ctx) => {
      totals[sev]++;
      byCode[code] = (byCode[code] || 0) + 1;
      if (kept[sev] < MAX_KEPT[sev]) { kept[sev]++; issues.push({ sev, code, line, msg, ...(ctx || {}) }); }
    };
    const counts = { 100: 0, 200: 0, 300: 0, 400: 0, 500: 0, 900: 0, other: 0 };
    const res = { header: null, blocks: [], trailer: null, issues, issueTotals: totals, issueByCode: byCode, counts, streams: [], nmis: [], fatal: false, fatalReason: '', lineCount: 0 };
    const fatal = reason => { if (!res.fatal) { res.fatal = true; res.fatalReason = reason; } };

    // ---- line endings ----
    const crlf = (text.match(/\r\n/g) || []).length, nl = (text.match(/\n/g) || []).length, cr = (text.match(/\r/g) || []).length;
    const lfOnly = nl - crlf, crOnly = cr - crlf;
    if (lfOnly || crOnly) {
      add('warning', 'LINE_ENDINGS', 0, crlf
        ? `Mixed line endings: ${crlf} CRLF, ${lfOnly} LF-only, ${crOnly} CR-only. NEM12 lines must end in CRLF.`
        : `Lines end in ${crOnly ? 'CR' : 'LF'} only; the NEM12 specification requires CRLF line endings.`);
    }
    const lines = text.split(/\r\n|\n|\r/);
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    res.lineCount = lines.length;
    if (!lines.length || (lines.length === 1 && lines[0].trim() === '')) {
      add('error', 'EMPTY_FILE', 0, 'The file is empty.');
      fatal('The file is empty.');
      return finish(res, add);
    }

    const seenDays = new Set();
    let block = null, day = null, seen100 = false, seen900 = false, first = true;

    // ---- record parsers --------------------------------------------------------------------
    function parseHeader(f, line) {
      const [, version = '', dt = '', from = '', to = ''] = f;
      const dtp = util.parseDT12(dt);
      res.header = { line, version, dateTime: dt, from, to, date: dtp ? dtp.date : null };
      if (f.length < 5) add('error', 'REC_FIELDS', line, `100 record needs 5 fields (RecordIndicator, VersionHeader, DateTime, FromParticipant, ToParticipant); found ${f.length}.`);
      if (version.toUpperCase() === 'NEM13') {
        add('error', 'NOT_NEM12', line, 'VersionHeader is NEM13 (accumulated meter data). Only NEM12 interval files are supported.');
        fatal('NEM13 accumulated-data files are not supported.');
      } else if (version.toUpperCase() !== 'NEM12') {
        add('error', 'HEADER_VERSION', line, `VersionHeader must be NEM12 (found "${version}").`);
        fatal('The 100 record is not a NEM12 header.');
      }
      if (!dtp) add('error', 'BAD_DATE', line, `100 record DateTime "${dt}" is not a valid CCYYMMDDhhmm timestamp.`);
      if (!from) add('warning', 'HEADER_PARTICIPANT', line, 'FromParticipant is blank.');
      if (!to) add('warning', 'HEADER_PARTICIPANT', line, 'ToParticipant is blank.');
    }

    function parse200(f, line) {
      const [, nmi = '', config = '', registerId = '', suffix = '', mdm = '', serial = '', uom = '', ilRaw = '', nextRead = ''] = f;
      const b = {
        line, nmi, nmiConfiguration: config, registerId, suffix: suffix.toUpperCase(), mdm, meterSerial: serial, uom, unit: null, factor: 1,
        intervalLength: null, N: null, nextScheduledRead: nextRead, kind: kindOfSuffix(suffix), days: [], skippedDays: 0, invalid: false,
      };
      const ctx = { nmi, suffix: b.suffix };
      const bad = (code, msg) => { add('error', code, line, msg, ctx); b.invalid = true; };
      if (f.length < 9) bad('REC_FIELDS', `200 record needs at least 9 fields (through IntervalLength); found ${f.length}.`);
      else if (f.length > 10) add('warning', 'EXTRA_FIELDS', line, `200 record has ${f.length} fields; the specification defines 10.`, ctx);
      if (!nmi) bad('NMI_MISSING', '200 record has no NMI.');
      else if (!/^[A-Za-z0-9]{10}$/.test(nmi)) add('warning', 'NMI_FORMAT', line, `NMI "${nmi}" is not 10 alphanumeric characters.`, ctx);
      if (!/^[A-Za-z][A-Za-z0-9]$/.test(suffix)) bad('SUFFIX_INVALID', `NMISuffix "${suffix}" must be 2 characters (e.g. E1, B1, Q1).`);
      else {
        if (!SUFFIX_KIND[b.suffix.charAt(0)]) add('warning', 'SUFFIX_UNKNOWN', line, `Datastream suffix ${b.suffix} is not E, B, Q or K; it is stored but not used by pricing.`, ctx);
        if (config && !config.toUpperCase().includes(b.suffix)) add('warning', 'SUFFIX_NOT_IN_CONFIG', line, `Suffix ${b.suffix} is not listed in NMIConfiguration "${config}".`, ctx);
      }
      const ui = util.uomInfo(uom);
      if (!ui) bad('UOM_UNSUPPORTED', `UOM "${uom}" is not supported. Expected Wh, kWh, MWh, varh, kvarh or Mvarh.`);
      else {
        b.unit = ui.unit; b.factor = ui.factor;
        if ((b.kind === 'consumption' || b.kind === 'export') && ui.unit !== 'kWh') add('warning', 'UOM_SUFFIX_MISMATCH', line, `Suffix ${b.suffix} is an energy datastream but UOM is ${uom}.`, ctx);
        if (b.kind === 'reactive' && ui.unit !== 'kvarh') add('warning', 'UOM_SUFFIX_MISMATCH', line, `Suffix ${b.suffix} is a reactive datastream but UOM is ${uom}.`, ctx);
      }
      const il = /^\d+$/.test(ilRaw) ? +ilRaw : NaN;
      if (!(il >= 1 && 1440 % il === 0)) bad('INTERVAL_LENGTH', `IntervalLength "${ilRaw}" is invalid: it must be a whole number of minutes that divides 1440 (e.g. 5, 15, 30).`);
      else {
        b.intervalLength = il; b.N = 1440 / il;
        if (!VALID_LENGTHS.includes(il)) add('warning', 'INTERVAL_LENGTH_UNUSUAL', line, `IntervalLength ${il} is not one of 1, 5, 10, 15, 30 minutes.`, ctx);
      }
      if (nextRead && !util.parseCCYYMMDD(nextRead)) add('warning', 'BAD_DATE', line, `NextScheduledReadDate "${nextRead}" is not a valid CCYYMMDD date.`, ctx);
      return b;
    }

    function parse300(f, line, b) {
      const dateStr = f[1] || '';
      const d = { line, date: util.parseCCYYMMDD(dateStr), values: null, flag: '', method: '', reasonCode: '', reasonDescription: '', updateDateTime: '', msatsLoadDateTime: '', defaultedUpdate: false, events: [], b2b: [], qualities: null, invalid: false, sawB2b: false };
      const ctx = { nmi: b.nmi, suffix: b.suffix, date: d.date || dateStr };
      const bad = (code, msg) => { add('error', code, line, msg, ctx); d.invalid = true; };
      if (b.invalid) { d.invalid = true; d.silent = true; return d; }   // block already reported
      if (!d.date) { bad('BAD_DATE', `IntervalDate "${dateStr}" is not a valid CCYYMMDD date.`); return d; }
      const N = b.N;
      let q = -1;
      for (let i = 2; i < f.length; i++) if (QUALITY_TOKEN.test(f[i])) { q = i; break; }
      if (q < 0) { bad('QUALITY_MISSING', `No QualityMethod field found after the interval values (expected ${N} values for ${b.intervalLength}-minute data).`); return d; }
      const rawVals = f.slice(2, q);
      if (rawVals.length !== N) {
        bad('VALUE_COUNT', `Expected ${N} interval values for IntervalLength ${b.intervalLength} but found ${rawVals.length}.`);
        return d;
      }
      const values = new Array(N);
      let badIdx = -1, negIdx = -1;
      for (let i = 0; i < N; i++) {
        const s = rawVals[i];
        if (!NUMERIC.test(s)) { badIdx = i; break; }
        values[i] = +s;
        if (values[i] < 0 && negIdx < 0) negIdx = i;
      }
      if (badIdx >= 0) { bad('BAD_VALUE', `Interval value ${badIdx + 1} ("${rawVals[badIdx]}") is not numeric.`); return d; }
      if (negIdx >= 0) { bad('NEGATIVE_VALUE', `Interval value ${negIdx + 1} is negative (${values[negIdx]}); NEM12 interval values cannot be negative.`); return d; }
      d.values = values;
      const tail = f.slice(q);
      if (tail.length > 5) add('warning', 'EXTRA_FIELDS', line, `300 record has ${tail.length - 5} field(s) after MSATSLoadDateTime.`, ctx);
      const qt = tail[0];
      d.flag = qt.charAt(0); d.method = qt.slice(1);
      if (!QUALITY_FLAGS[d.flag]) { bad('UNKNOWN_FLAG', `Unknown quality flag "${d.flag}" in QualityMethod "${qt}". Valid flags: A, E, F, N, S, V.`); return d; }
      if (d.method && !/^\d{2}$/.test(d.method)) add('warning', 'BAD_METHOD', line, `Method part of QualityMethod "${qt}" should be a 2-digit code.`, ctx);
      if (d.flag === 'V' && d.method) add('warning', 'BAD_METHOD', line, 'QualityMethod V must not carry a method code (methods are given in the 400 records).', ctx);
      d.reasonCode = tail[1] || ''; d.reasonDescription = tail[2] || '';
      if ((d.flag === 'S' || d.flag === 'F') && !d.reasonCode) add('warning', 'REASON_MISSING', line, `Quality ${d.flag} should carry a ReasonCode.`, ctx);
      const upd = tail[3] || '', load = tail[4] || '';
      const updP = util.parseDT14(upd);
      if (updP) d.updateDateTime = upd;
      else {
        d.defaultedUpdate = true;
        const hd = res.header && util.parseDT12(res.header.dateTime);
        d.updateDateTime = hd ? res.header.dateTime + '00' : '19700101000000';
        add('warning', upd ? 'BAD_DATETIME' : 'UPDATE_DT_MISSING', line,
          upd ? `UpdateDateTime "${upd}" is not a valid CCYYMMDDhhmmss timestamp; the file header time is used instead.`
            : 'UpdateDateTime is missing; the file header time is used so versions can still be ordered.', ctx);
      }
      if (load) { if (util.parseDT14(load)) d.msatsLoadDateTime = load; else add('warning', 'BAD_DATETIME', line, `MSATSLoadDateTime "${load}" is not a valid CCYYMMDDhhmmss timestamp.`, ctx); }
      if (updP && (d.flag === 'A' || d.flag === 'S' || d.flag === 'F') && updP.date < d.date) add('warning', 'UPDATE_BEFORE_INTERVAL', line, `UpdateDateTime ${upd} is before the interval date ${d.date}.`, ctx);
      if (d.flag === 'N' && values.some(v => v !== 0)) add('warning', 'N_NONZERO', line, 'Quality N means the value is missing and should be 0, but non-zero values were supplied.', ctx);
      return d;
    }

    function parse400(f, line, d, b) {
      const ctx = { nmi: b.nmi, suffix: b.suffix, date: d.date };
      if (d.invalid) return;
      const N = b.N, start = /^\d+$/.test(f[1] || '') ? +f[1] : NaN, end = /^\d+$/.test(f[2] || '') ? +f[2] : NaN;
      if (f.length < 4) { add('error', 'REC_FIELDS', line, `400 record needs at least 4 fields; found ${f.length}.`, ctx); d.badEvents = true; return; }
      if (!(start >= 1 && end >= start && end <= N)) {
        add('error', 'EVENT_RANGE', line, `400 record interval range ${f[1]}–${f[2]} is invalid for a day of ${N} intervals (need 1 ≤ start ≤ end ≤ ${N}).`, ctx);
        d.badEvents = true; return;
      }
      const qt = f[3] || '', flag = qt.charAt(0), method = qt.slice(1);
      if (!QUALITY_TOKEN.test(qt) || !QUALITY_FLAGS[flag]) {
        add('error', 'UNKNOWN_FLAG', line, `Unknown quality flag in 400 record QualityMethod "${qt}".`, ctx);
        d.badEvents = true; return;
      }
      if (flag === 'V') { add('error', 'EVENT_FLAG_V', line, '400 record QualityMethod cannot be V.', ctx); d.badEvents = true; return; }
      if (method && !/^\d{2}$/.test(method)) add('warning', 'BAD_METHOD', line, `Method part of QualityMethod "${qt}" should be a 2-digit code.`, ctx);
      if (d.flag !== 'V') {
        add('warning', 'EVENT_ON_NON_V', line, `400 record follows a 300 record with quality ${d.flag}, not V; it is kept for audit but does not change interval flags.`, ctx);
      }
      d.events.push({ line, start, end, flag, method, reasonCode: f[4] || '', reasonDescription: f[5] || '' });
    }

    function parse500(f, line, d, b) {
      const ctx = { nmi: b.nmi, suffix: b.suffix, date: d.date };
      const code = f[1] || '';
      if (code.length !== 1 || !B2B_TRANS_CODES.includes(code.toUpperCase())) add('warning', 'B2B_TRANSCODE', line, `500 record TransCode "${code}" is not one of ${B2B_TRANS_CODES.split('').join(', ')}.`, ctx);
      if (f[3] && !util.parseDT14(f[3])) add('warning', 'BAD_DATETIME', line, `500 record ReadDateTime "${f[3]}" is not a valid CCYYMMDDhhmmss timestamp.`, ctx);
      d.b2b.push({ line, transCode: code, serviceOrder: f[2] || '', readDateTime: f[3] || '', indexRead: f[4] || '' });
    }

    function finaliseDay(d, b) {
      if (!b) return;                                   // orphan 300 (already reported)
      const ctx = { nmi: b.nmi, suffix: b.suffix, date: d.date };
      if (!d.invalid && d.flag === 'V') {
        if (!d.events.length && !d.badEvents) {
          add('error', 'V_NO_400', d.line, `Quality V requires 400 records covering all ${b.N} intervals, but none follow this 300 record.`, ctx);
          d.invalid = true;
        } else if (d.badEvents) {
          d.invalid = true;                             // the bad 400 record(s) were already reported
        } else {
          const { gaps, overlaps } = checkCoverage(d.events, b.N);
          if (gaps.length) { add('error', 'V_COVERAGE_GAP', d.line, `400 records leave interval(s) ${fmtRanges(gaps)} of ${b.N} without a quality flag (they must cover the whole day with no gaps).`, ctx); d.invalid = true; }
          if (overlaps.length) { add('error', 'V_COVERAGE_OVERLAP', d.line, `400 records overlap on interval(s) ${fmtRanges(overlaps)}.`, ctx); d.invalid = true; }
          if (!d.invalid) {
            d.qualities = new Array(b.N);
            for (const e of d.events) for (let i = e.start; i <= e.end; i++) d.qualities[i - 1] = { flag: e.flag, method: e.method, reasonCode: e.reasonCode, reasonDescription: e.reasonDescription };
          }
        }
      }
      if (d.invalid) { b.skippedDays++; return; }
      const key = b.nmi + '|' + b.suffix + '|' + d.date;
      if (seenDays.has(key)) add('warning', 'DUPLICATE_DAY', d.line, `${b.nmi} ${b.suffix} ${d.date} appears more than once in this file; both versions are stored and the later UpdateDateTime wins.`, ctx);
      seenDays.add(key);
      b.days.push(d);
    }
    const closeDay = () => { if (day) { finaliseDay(day, block); day = null; } };
    const noteEmptyBlock = () => {
      if (block && !block.invalid && block.days.length === 0 && block.skippedDays === 0) add('warning', 'NO_300', block.line, `200 record for ${block.nmi}/${block.suffix} is not followed by any 300 records.`, { nmi: block.nmi, suffix: block.suffix });
    };

    // ---- main loop ----------------------------------------------------------------------------
    for (let i = 0; i < lines.length; i++) {
      const lineNo = i + 1, raw = lines[i];
      if (raw.trim() === '') { if (!seen900) add('warning', 'BLANK_LINE', lineNo, 'Blank line ignored.'); continue; }
      const f = raw.split(',').map(s => s.trim());
      const rec = f[0];
      if (seen900) { add('error', 'REC_ORDER', lineNo, `Record ${rec} found after the 900 end record.`); continue; }
      if (first) {
        first = false;
        if (rec !== '100') { add('error', 'REC_ORDER', lineNo, `The file must begin with a 100 header record (first record is ${rec}).`); fatal('The file does not begin with a 100 header record.'); }
      }
      switch (rec) {
        case '100':
          counts[100]++;
          if (seen100) add('error', 'REC_ORDER', lineNo, 'More than one 100 header record.');
          else { seen100 = true; parseHeader(f, lineNo); }
          break;
        case '200':
          counts[200]++;
          closeDay(); noteEmptyBlock();
          block = parse200(f, lineNo);
          res.blocks.push(block);
          break;
        case '300':
          counts[300]++;
          closeDay();
          if (!block) { add('error', 'REC_ORDER', lineNo, '300 record without a preceding 200 record.'); day = { invalid: true, orphan: true, line: lineNo, events: [], b2b: [] }; }
          else day = parse300(f, lineNo, block);
          break;
        case '400':
          counts[400]++;
          if (!day) add('error', 'REC_ORDER', lineNo, '400 record without a preceding 300 record.');
          else if (day.sawB2b) add('error', 'REC_ORDER', lineNo, '400 record after a 500 record; record order is 300, then 400 records, then 500 records.', { nmi: block && block.nmi, suffix: block && block.suffix, date: day.date });
          else if (block) parse400(f, lineNo, day, block);
          break;
        case '500':
          counts[500]++;
          if (!day) add('error', 'REC_ORDER', lineNo, '500 record without a preceding 300 record.');
          else { day.sawB2b = true; if (block && !day.invalid) parse500(f, lineNo, day, block); }
          break;
        case '900':
          counts[900]++;
          closeDay(); noteEmptyBlock();
          seen900 = true;
          res.trailer = { line: lineNo };
          break;
        default:
          counts.other++;
          add('error', 'REC_UNKNOWN', lineNo, `Unknown record indicator "${rec}" (expected 100, 200, 300, 400, 500 or 900).`);
      }
    }
    closeDay();
    if (!seen900) { noteEmptyBlock(); add('error', 'NO_900', lines.length, 'The file does not end with a 900 record (it may be truncated).'); }
    if (!seen100) fatal('The file has no 100 header record.');
    if (!res.blocks.length) { add('error', 'NO_200', 0, 'The file contains no 200 (NMI data details) records.'); fatal('The file contains no NMI data.'); }
    return finish(res, add);
  }

  /** Stream summaries and date-gap checks, computed once parsing is complete. */
  function finish(res, add) {
    const streams = new Map();
    for (const b of res.blocks) {
      const key = b.nmi + '|' + b.suffix;
      let s = streams.get(key);
      if (!s) streams.set(key, s = { nmi: b.nmi, suffix: b.suffix, registerId: b.registerId, meterSerial: b.meterSerial, uom: b.uom, unit: b.unit, intervalLength: b.intervalLength, kind: b.kind, dates: new Set(), skippedDays: 0, intervals: 0, quality: {} });
      s.skippedDays += b.skippedDays;
      for (const d of b.days) {
        s.dates.add(d.date);
        s.intervals += b.N;
        if (d.qualities) for (const q of d.qualities) s.quality[q.flag] = (s.quality[q.flag] || 0) + 1;
        else s.quality[d.flag] = (s.quality[d.flag] || 0) + b.N;
      }
    }
    res.streams = [];
    for (const s of streams.values()) {
      const dates = Array.from(s.dates).sort();
      const gaps = [];
      for (let i = 1; i < dates.length; i++) {
        const missing = util.daysBetween(dates[i - 1], dates[i]) - 1;
        if (missing > 0) gaps.push({ from: util.addDays(dates[i - 1], 1), to: util.addDays(dates[i], -1), days: missing });
      }
      gaps.slice(0, 10).forEach(g => add('warning', 'DATE_GAP', 0,
        `${s.nmi} ${s.suffix}: no data for ${g.days === 1 ? g.from : g.from + ' to ' + g.to} (${g.days} day${g.days === 1 ? '' : 's'}) inside the file's date range.`, { nmi: s.nmi, suffix: s.suffix }));
      if (gaps.length > 10) add('warning', 'DATE_GAP', 0, `${s.nmi} ${s.suffix}: ${gaps.length - 10} more date gaps not listed.`, { nmi: s.nmi, suffix: s.suffix });
      const { dates: _drop, ...rest } = s;
      res.streams.push({ ...rest, firstDate: dates[0] || null, lastDate: dates[dates.length - 1] || null, days: dates.length, gaps });
    }
    res.nmis = Array.from(new Set(res.blocks.map(b => b.nmi))).filter(Boolean);
    return res;
  }

  /** Flatten the usable days of a parse result into IntervalReading rows (one row per interval). */
  function toReadingRows(parsed, sourceFileId) {
    const rows = [];
    for (const b of parsed.blocks) {
      if (b.invalid) continue;
      const L = b.intervalLength, N = b.N;
      for (const d of b.days) {
        for (let k = 0; k < N; k++) {
          const q = d.qualities ? d.qualities[k] : d;
          rows.push({
            nmi: b.nmi, suffix: b.suffix, registerId: b.registerId, meterSerial: b.meterSerial,
            intervalDate: d.date, intervalNo: k + 1, intervalLength: L, startMinute: k * L,
            uom: b.uom, unit: b.unit, rawValue: d.values[k], value: util.normaliseValue(d.values[k], b.factor),
            quality: q.flag, method: q.method || '', reasonCode: q.reasonCode || '', reasonDescription: q.reasonDescription || '',
            updateDateTime: d.updateDateTime, msatsLoadDateTime: d.msatsLoadDateTime || '', sourceFileId, sourceLine: d.line,
          });
        }
      }
    }
    return rows;
  }

  /**
   * Serialisable validation report (kept with the file in MeterDataFile.validation).
   * status: Accepted (no errors) | Partial (errors, but some days usable) | Rejected (nothing usable).
   */
  function buildReport(parsed, { strict = false } = {}) {
    const validDays = parsed.blocks.reduce((n, b) => n + b.days.length, 0);
    const skippedDays = parsed.blocks.reduce((n, b) => n + b.skippedDays, 0);
    const errors = parsed.issueTotals.error;
    let status = 'Accepted';
    if (parsed.fatal || validDays === 0) status = 'Rejected';
    else if (errors > 0) status = strict ? 'Rejected' : 'Partial';
    const order = { error: 0, warning: 1, info: 2 };
    const issues = parsed.issues.slice().sort((a, b) => order[a.sev] - order[b.sev] || (a.line || 0) - (b.line || 0));
    const keep = issues.slice(0, 400);
    return {
      status, strict, fatalReason: parsed.fatalReason || '',
      header: parsed.header ? { version: parsed.header.version, dateTime: parsed.header.dateTime, from: parsed.header.from, to: parsed.header.to } : null,
      counts: { ...parsed.counts, lines: parsed.lineCount, validDays, skippedDays },
      issueTotals: { ...parsed.issueTotals }, issueByCode: { ...parsed.issueByCode },
      issues: keep, issuesTruncated: issues.length > keep.length || Object.values(parsed.issueTotals).reduce((a, b) => a + b, 0) > issues.length,
      streams: parsed.streams.map(s => ({ ...s, gaps: s.gaps.slice(0, 20) })),
      nmis: parsed.nmis,
    };
  }

  return { QUALITY_FLAGS, SUFFIX_KIND, SUFFIX_LABEL, B2B_TRANS_CODES, VALID_LENGTHS, kindOfSuffix, parse, toReadingRows, buildReport, checkCoverage, fmtRanges };
})();
</script>
<script data-section="nem12-sample">
/* ============================================================================
   SECTION 4b — nem12 sample-data generator (extends `nem12`; still pure)
   Builds 13 months of realistic 30-minute data (E1 kWh + Q1 kvarh) for two test NMIs
   as genuine NEM12 text, so it goes through exactly the same ingestion path as a real
   upload. Deterministic for a given seed + window, which lets generateRevision()
   reproduce the "true" values later and re-send them as a newer file version.
     8001TEST01  office/retail, heat-sensitive, ~110 kVA peak        -> RT2 / RT34 territory
     8001TEST02  24/7 light industrial, ~0.75-1.2 MVA peak           -> RT6 territory
   Planted data-quality events (relative to the window, so they always fall inside it):
     S  whole days substituted (S14 like-day)          V  a day with 400 records (N or S ranges)
     N  a whole day with no data                       E  the latest 2 days as forward estimates (E52)
   ============================================================================ */
(function () {
  'use strict';
  const SPECS = [
    { nmi: '8001TEST01', serial: 'TST0000001', seed: 1001, kind: 'office', name: 'Office / retail, ~110 kVA peak' },
    { nmi: '8001TEST02', serial: 'TST0000002', seed: 2002, kind: 'industrial', name: '24/7 light industrial, ~1 MVA peak' },
  ];

  /** piecewise-linear interpolation over [[hour, value], …] */
  const pw = (h, pts) => {
    if (h <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (h <= pts[i][0]) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; return y0 + ((y1 - y0) * (h - x0)) / (x1 - x0); }
    }
    return pts[pts.length - 1][1];
  };
  const dayOfYear = iso => util.daysBetween(iso.slice(0, 4) + '-01-01', iso) + 1;
  const dayType = (date, holidays) => (holidays.has(date) ? 'hol' : ({ 0: 'sun', 6: 'sat' })[util.dow(date)] || 'wd');
  const ccyymmdd = iso => iso.replace(/-/g, '');
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  const OFFICE_OCC = { wd: [[0, 0.1], [6, 0.1], [8, 1], [17, 1], [19, 0.15], [24, 0.1]], sat: [[0, 0.08], [7, 0.08], [9, 0.5], [13, 0.5], [14, 0.1], [24, 0.08]], sun: [[0, 0.08], [24, 0.08]] };
  const INDUSTRIAL_SHIFT = { wd: [[0, 0.12], [5, 0.12], [6.5, 1], [21.5, 1], [23, 0.12], [24, 0.12]], sat: [[0, 0.1], [6, 0.1], [7, 0.62], [17, 0.62], [18, 0.1], [24, 0.1]], sun: [[0, 0.1], [24, 0.1]] };

  /** Daily mean temperature (°C): Perth-like seasonal cycle plus persistent weather anomalies; shared by both NMIs. */
  function buildWeather(dates, rng) {
    const out = new Map();
    let anomaly = 0;
    for (const d of dates) {
      anomaly = 0.6 * anomaly + 2.4 * util.gaussian(rng);
      out.set(d, 19.3 + 6.0 * Math.cos((2 * Math.PI * (dayOfYear(d) - 35)) / 365.25) + anomaly);
    }
    return out;
  }

  /** The "true" 48-interval kWh and kvarh series for every day of the window. */
  function buildTruth(spec, dates, weather, holidays, surgeDate) {
    const rng = util.mulberry32(spec.seed);
    const truth = new Map();
    for (const date of dates) {
      const dt0 = dayType(date, holidays);
      const dt = dt0 === 'hol' ? 'sun' : dt0;
      const dayNoise = 1 + 0.04 * util.gaussian(rng);
      const kwh = new Array(48), kvarh = new Array(48);
      let batchLeft = 0, batchKw = 0;
      for (let i = 0; i < 48; i++) {
        const h = (i + 0.5) / 2;
        const T = weather.get(date) + 6 * Math.sin((2 * Math.PI * (h - 9)) / 24);
        let kw, pf;
        if (spec.kind === 'office') {
          const occ = pw(h, OFFICE_OCC[dt]);
          kw = 11 + 38 * occ + 2.8 * Math.max(0, T - 22) * (0.15 + 0.85 * occ) + 1.2 * Math.max(0, 13 - T) * (0.1 + 0.9 * occ);
          pf = 0.84 + 0.11 * occ + 0.008 * util.gaussian(rng);
        } else {
          const shift = pw(h, INDUSTRIAL_SHIFT[dt]);
          kw = 330 + 270 * shift + 9 * Math.max(0, T - 20) * (0.7 + 0.3 * shift);
          if (batchLeft === 0 && dt0 === 'wd' && h >= 10 && h < 14 && rng() < 0.07) { batchLeft = 1 + Math.floor(rng() * 3); batchKw = 70 + 90 * rng(); }
          const batch = batchLeft > 0;
          if (batch) { kw += batchKw; batchLeft--; }
          pf = 0.93 - (batch ? 0.05 : 0) - 0.03 * (1 - shift) + 0.01 * util.gaussian(rng);
          if (surgeDate === date && (i === 24 || i === 25)) { kw += 330; pf = 0.88; }   // forced plant start-up surge
        }
        kw *= dayNoise * (1 + 0.035 * util.gaussian(rng));
        pf = clamp(pf, 0.78, 0.985);
        kwh[i] = kw * 0.5;
        kvarh[i] = kw * 0.5 * Math.tan(Math.acos(pf));
      }
      truth.set(date, { kwh, kvarh });
    }
    return truth;
  }

  const firstWeekdayFrom = (dates, idx, holidays) => {
    for (let i = idx; i < dates.length; i++) if (dayType(dates[i], holidays) === 'wd') return dates[i];
    return dates[idx];
  };

  /** Where the data-quality events go, relative to the window. */
  function makePlan(spec, dates, holidays) {
    const n = dates.length, at = f => Math.min(n - 1, Math.floor(n * f));
    const plan = [];
    if (spec.kind === 'office') {
      for (let k = 0; k < 3; k++) plan.push({ date: dates[at(0.28) + k], type: 'S_DAY' });
      plan.push({ date: dates[at(0.55)], type: 'V_PARTIAL', flag: 'N', from: 15, to: 26 });
    } else {
      plan.push({ date: dates[at(0.18)], type: 'N_DAY' });
      plan.push({ date: dates[at(0.42)], type: 'V_PARTIAL', flag: 'S', from: 21, to: 30 });
    }
    for (let k = 2; k >= 1; k--) if (n - k >= 0) plan.push({ date: dates[n - k], type: 'E_TAIL' });
    return plan.filter(p => p.date);
  }

  const f3 = v => v.toFixed(3);
  const stamp = (iso, hh, mm, ss) => ccyymmdd(iso) + util.pad2(hh) + util.pad2(mm) + util.pad2(ss);

  /** 300 (+400) lines for one day of one stream. mode 'base' = as first delivered (with planted problems); 'revision' = corrected data. */
  function dayLines({ date, idx, truth, plan, suffixIsQ, now, mode, likeTruth, rng }) {
    const series = suffixIsQ ? truth.get(date).kvarh : truth.get(date).kwh;
    const like = suffixIsQ ? likeTruth.kvarh : likeTruth.kwh;
    const upd = stamp(util.addDays(date, 1), 2, 15, (idx * 7) % 60), load = stamp(util.addDays(date, 1), 2, 20, (idx * 7) % 60);
    const dateStr = ccyymmdd(date);
    const zeros = Array(48).fill(0);
    const L300 = (vals, qt, rc, rd, u, l) => ['300', dateStr, ...vals.map(f3), qt, rc, rd, u, l].join(',');
    if (mode === 'revision') {
      if (!plan) return [];
      if (plan.type === 'N_DAY') return [L300(like, 'F14', '0', 'Final substitute - like day', now, '')];   // data was never recovered: final substitute
      return [L300(series, 'A', '', '', now, '')];
    }
    if (!plan) return [L300(series, 'A', '', '', upd, load)];
    switch (plan.type) {
      case 'S_DAY': return [L300(like, 'S14', '0', 'Comms failure - like day substitution', upd, load)];
      case 'N_DAY': return [L300(zeros, 'N', '0', 'Meter offline - no data received', upd, load)];
      case 'E_TAIL': return [L300(series.map(v => v * (1 + 0.04 * util.gaussian(rng))), 'E52', '0', 'Forward estimate pending validated read', now, '')];
      case 'V_PARTIAL': {
        const vals = series.slice();
        const ev = [];
        if (plan.from > 1) ev.push(`400,1,${plan.from - 1},A,,`);
        if (plan.flag === 'N') { for (let i = plan.from - 1; i < plan.to; i++) vals[i] = 0; ev.push(`400,${plan.from},${plan.to},N,0,Meter comms failure`); }
        else { for (let i = plan.from - 1; i < plan.to; i++) vals[i] = like[i]; ev.push(`400,${plan.from},${plan.to},S14,0,Substituted - like day`); }
        if (plan.to < 48) ev.push(`400,${plan.to + 1},48,A,,`);
        return [L300(vals, 'V', '', '', upd, load), ...ev];
      }
      default: return [L300(series, 'A', '', '', upd, load)];
    }
  }

  function build({ from, to, now, seed, holidays, mode }) {
    const dates = util.dateRange(from, to);
    const hol = holidays instanceof Set ? holidays : new Set(holidays || []);
    const weather = buildWeather(dates, util.mulberry32((seed | 0) ^ 0x5eed));
    const nextRead = ccyymmdd(util.addDays(now.slice(0, 4) + '-' + now.slice(4, 6) + '-' + now.slice(6, 8), 30));
    const files = [];
    for (const spec of SPECS) {
      const specSeeded = { ...spec, seed: spec.seed + (seed | 0) * 7919 };
      const planList = makePlan(spec, dates, hol);
      const surgeDate = spec.kind === 'industrial' ? firstWeekdayFrom(dates, Math.floor(dates.length * 0.62), hol) : null;
      const truth = buildTruth(specSeeded, dates, weather, hol, surgeDate);
      const planByDate = new Map(planList.map(p => [p.date, p]));
      const rng = util.mulberry32(specSeeded.seed ^ 0xe57);
      const useDates = mode === 'revision' ? dates.filter(d => planByDate.has(d)) : dates;
      const lines = [['100', 'NEM12', now.slice(0, 12), 'MDPTEST', 'GASRETAIL'].join(',')];
      for (const [reg, suffix, uom, mdm] of [['1', 'E1', 'kWh', 'N1'], ['2', 'Q1', 'kvarh', 'N2']]) {
        lines.push(['200', spec.nmi, 'E1Q1', reg, suffix, mdm, spec.serial, uom, '30', nextRead].join(','));
        for (const date of useDates) {
          const idx = dates.indexOf(date);
          const d7 = util.addDays(date, -7), likeDate = truth.has(d7) ? d7 : util.addDays(date, 7);
          const likeTruth = truth.get(likeDate) || truth.get(date);
          lines.push(...dayLines({ date, idx, truth, plan: planByDate.get(date), suffixIsQ: suffix === 'Q1', now, mode, likeTruth, rng }));
        }
      }
      lines.push('900');
      const tag = mode === 'revision' ? 'REVISION' : 'SAMPLE';
      files.push({
        nmi: spec.nmi, name: spec.name,
        fileName: `${tag}_${spec.nmi}_NEM12_${ccyymmdd(from)}-${ccyymmdd(to)}.csv`,
        text: lines.join('\r\n') + '\r\n',
        plan: planList, surgeDate,
        summary: describe(planList, surgeDate, mode),
      });
    }
    return { from, to, seed, now, mode, files };
  }

  function describe(plan, surge, mode) {
    const parts = [];
    const c = t => plan.filter(p => p.type === t);
    if (mode === 'revision') return `Re-sends ${plan.length} day(s) with newer UpdateDateTime: substituted/estimated/missing intervals replaced by actual (A) or final-substitute (F) values.`;
    if (c('S_DAY').length) parts.push(`${c('S_DAY').length} substituted days (S14)`);
    if (c('N_DAY').length) parts.push(`${c('N_DAY').length} day with no data (N)`);
    c('V_PARTIAL').forEach(p => parts.push(`1 variable-quality day (V + 400 records: intervals ${p.from}–${p.to} ${p.flag === 'N' ? 'missing (N)' : 'substituted (S14)'})`));
    if (c('E_TAIL').length) parts.push(`${c('E_TAIL').length} forward-estimate days (E52)`);
    if (surge) parts.push(`one plant start-up surge on ${surge}`);
    return parts.join('; ');
  }

  /** Default window: the 13 most recent complete calendar months. */
  function defaultWindow(todayIso) {
    const to = util.monthEnd(util.addMonths(util.monthStart(todayIso), -1));
    return { from: util.monthStart(util.addMonths(to, -12)), to };
  }

  function generateSample(opts = {}) {
    const w = defaultWindow(opts.today || util.todayWst());
    return build({ from: opts.from || w.from, to: opts.to || w.to, now: opts.now || util.nowStampWst(), seed: opts.seed == null ? 1 : opts.seed, holidays: opts.holidays, mode: 'base' });
  }
  /** Corrected data for the days that generateSample() delivered as S / N / E, with a newer UpdateDateTime. */
  function generateRevision(opts) {
    if (!opts || !opts.from || !opts.to) throw new Error('generateRevision needs the same from/to/seed used for the sample');
    return build({ from: opts.from, to: opts.to, now: opts.now || util.nowStampWst(), seed: opts.seed == null ? 1 : opts.seed, holidays: opts.holidays, mode: 'revision' });
  }

  Object.assign(nem12, { generateSample, generateRevision, defaultSampleWindow: defaultWindow, SAMPLE_SPECS: SPECS });
})();

   SECTION 5 — seed data  (the tariff book is DATA, not code)
   Western Power 2026-27 price list (1 Jul 2026 – 30 Jun 2027, cents, ex GST) loaded as
   Rate rows with EffectiveFrom / EffectiveTo, so next year's list is a data load
   (Tariff book > Import CSV) and never a code change.

   Rate row:  ownerCode ('WP' = Western Power network, or a retail offer id)
              tariffCode (RTxx, or '*' = applies to every tariff)
              componentCode / bandCode  (what the price is for)
              lowerKva / upperKva       (RT6 demand bands only)
              value + unit, effectiveFrom, effectiveTo (null = open ended)
   TimeBand row: tariffCode, bandCode, days ('ALL' | 'MON,TUE,…'), holidays
              ('INCLUDE' band applies on public holidays too, 'EXCLUDE' it does not,
               'ONLY' it applies only on public holidays), startMinute, endMinute (exclusive).
   ============================================================================ */
const seed = (() => {

    })),
  ];

  const comp = (tariffCode, componentCode, label, kind, unit, group, sortOrder) =>
    ({ componentId: `${tariffCode}.${componentCode}`, tariffCode, componentCode, label, kind, unit, group, sortOrder });
  const components = [

    comp('RT34', 'FIXED', 'Fixed charge', 'DAILY', 'c/day', 'Network', 1),
    comp('RT34', 'ENERGY', 'Energy charge (time of use)', 'ENERGY', 'c/kWh', 'Network', 2),
    comp('RT34', 'METERING', 'Metering charge', 'DAILY', 'c/day', 'Metering', 3),
    comp('RT6', 'DEMAND', 'Metered demand charge', 'DEMAND_BANDED', 'c/day + c/kVA/day', 'Network', 1),

  const ALL_DAYS = 'ALL', WEEKDAYS = 'MON,TUE,WED,THU,FRI', WEEKEND = 'SAT,SUN';

    ({ timeBandId: `${tariffCode}.${bandCode}.${n}`, tariffCode, bandCode, label, days, holidays, startMinute, endMinute, effectiveFrom: null, effectiveTo: null, sortOrder });
  const timeBands = [
    tb('RT2', 1, 'ALL', 'All times', ALL_DAYS, 'INCLUDE', 0, 1440, 1),
    // RT34: every day including public holidays (WST)
    tb('RT34', 1, 'OFF_PEAK', 'Off-peak', ALL_DAYS, 'INCLUDE', 0, 360, 1),          // 00:00-06:00

    tb('RT34', 4, 'ON_PEAK', 'On-peak', ALL_DAYS, 'INCLUDE', 900, 1260, 4),          // 15:00-21:00
    tb('RT34', 5, 'SHOULDER', 'Shoulder', ALL_DAYS, 'INCLUDE', 1260, 1380, 5),       // 21:00-23:00
    tb('RT34', 6, 'OFF_PEAK', 'Off-peak', ALL_DAYS, 'INCLUDE', 1380, 1440, 6),       // 23:00-24:00
    // RT6: Mon-Fri excluding public holidays 15:00-21:00 on-peak; every other time off-peak
    tb('RT6', 1, 'OFF_PEAK', 'Off-peak', ALL_DAYS, 'ONLY', 0, 1440, 1),              // public holidays: off-peak all day
    tb('RT6', 2, 'OFF_PEAK', 'Off-peak', WEEKEND, 'EXCLUDE', 0, 1440, 2),            // Sat, Sun (a holiday on a Sat/Sun is covered by the row above)
    tb('RT6', 3, 'OFF_PEAK', 'Off-peak', WEEKDAYS, 'EXCLUDE', 0, 900, 3),            // Mon-Fri 00:00-15:00
    tb('RT6', 4, 'ON_PEAK', 'On-peak', WEEKDAYS, 'EXCLUDE', 900, 1260, 4),           // Mon-Fri 15:00-21:00
    tb('RT6', 5, 'OFF_PEAK', 'Off-peak', WEEKDAYS, 'EXCLUDE', 1260, 1440, 5),        // Mon-Fri 21:00-24:00

  const rate = (tariffCode, componentCode, bandCode, value, unit, extra = {}) => ({

    rate('RT6', 'DEMAND_FIXED', 'B2', 34468.200, 'c/day', { lowerKva: 300, upperKva: 1000 }),
    rate('RT6', 'DEMAND_RATE', 'B2', 88.518, 'c/kVA/day', { lowerKva: 300, upperKva: 1000 }),
    rate('RT6', 'DEMAND_FIXED', 'B3', 96430.800, 'c/day', { lowerKva: 1000, upperKva: 1500 }),
    rate('RT6', 'DEMAND_RATE', 'B3', 46.173, 'c/kVA/day', { lowerKva: 1000, upperKva: 1500 }),
    // RT6 discount parameters: DF, and the MD range over which it tapers to zero
    rate('RT6', 'PARAM', 'DF', 0.30, 'factor', { note: 'Discount factor DF' }),
    rate('RT6', 'PARAM', 'TAPER_START', 1000, 'kVA', { note: 'Discount is OffPeakShare x DF below this MD' }),
    rate('RT6', 'PARAM', 'TAPER_END', 1500, 'kVA', { note: 'Discount is zero at or above this MD' }),
    rate('RT6', 'PARAM', 'DEMAND_LENGTH_KVA', 1000, 'kVA', { note: 'Demand-length charge applies above this MD (not calculated by the prototype)' }),

    // Metering reference service add-ons (c/meter/day), selectable per site; tariffCode '*' = any tariff
    ...[['M1', 3.613], ['M3', 41.244], ['M4', 82.490], ['M5', 22.039], ['M7-SIM', 191.058], ['M7-AMI', 3.613]]

  // ---- WA public holidays -------------------------------------------------------------------------------------
  // Seeded from the WA public holiday calendar; weekend holidays carry the additional (substitute) weekday where WA

  const H = (date, name, note = '') => ({ holidayId: 'PH-' + date.replace(/-/g, ''), date, name, state: 'WA', note });
  const holidays = [

    H('2026-03-02', 'Labour Day'), H('2026-04-03', 'Good Friday'), H('2026-04-05', 'Easter Sunday'), H('2026-04-06', 'Easter Monday'),
    H('2026-04-25', 'Anzac Day', 'Saturday'), H('2026-06-01', 'Western Australia Day'), H('2026-09-28', "King's Birthday"),
    H('2026-12-25', 'Christmas Day'), H('2026-12-26', 'Boxing Day', 'Saturday'), H('2026-12-28', 'Boxing Day (additional)', 'Substitute for Saturday 26 Dec'),

    H('2027-01-01', "New Year's Day"), H('2027-01-26', 'Australia Day'),
    H('2027-03-01', 'Labour Day'), H('2027-03-26', 'Good Friday'), H('2027-03-28', 'Easter Sunday'), H('2027-03-29', 'Easter Monday'),
    H('2027-04-25', 'Anzac Day', 'Sunday'), H('2027-04-26', 'Anzac Day (additional)', 'Substitute for Sunday 25 Apr: confirm proclamation'),
    H('2027-06-07', 'Western Australia Day'), H('2027-09-27', "King's Birthday"),
    H('2027-12-25', 'Christmas Day', 'Saturday'), H('2027-12-26', 'Boxing Day', 'Sunday'),
    H('2027-12-27', 'Christmas Day (additional)', 'Substitute for Saturday 25 Dec'), H('2027-12-28', 'Boxing Day (additional)', 'Substitute for Sunday 26 Dec'),
  ];

  const settings = [
    { key: 'company', value: { name: 'Your Company Pty Ltd', abn: '00 000 000 000', address: 'Level 1, 1 Example Street, Perth WA 6000', phone: '08 0000 0000', email: 'accounts@example.com.au', bankName: 'Example Bank', accountName: 'Your Company Pty Ltd', bsb: '000-000', accountNumber: '00000000' } },
    { key: 'gstRate', value: 0.10 },
    { key: 'engine', value: { mdMode: 'daily', mdWindowMonths: 12, defaultPowerFactor: 0.9 } },
    { key: 'terms.quote', value: 'This quote is indicative. It re-prices the customer\'s historical half-hourly interval data at the rates shown, so actual charges will vary with consumption, maximum demand and any change to network tariffs. Prices exclude GST unless stated. Network charges are passed through at Western Power\'s regulated prices. The quote is valid until the date shown and is subject to contract.' },
    { key: 'terms.invoice', value: 'Payment is due by the due date shown. Please quote the invoice number as your payment reference. Network charges are Western Power regulated charges passed through at cost.' },
  ];

  const byTable = { NetworkTariff: tariffs, TariffComponent: components, TimeBand: timeBands, Rate: rates, PublicHoliday: holidays, Setting: settings };
  const pkOf = (table, row) => row[repo.TABLES[table].pk];

  /** Insert every seed row that is not already present (never overwrites edits). Returns inserted counts. */
  function restoreMissing(only) {
    const counts = {};
    repo.atomic(() => {
      for (const [table, rows] of Object.entries(byTable)) {
        if (only && !only.includes(table)) continue;
        const missing = rows.filter(r => !repo.get(table, pkOf(table, r)));
        if (missing.length) repo.insertMany(table, missing);
        counts[table] = missing.length;
      }
    });
    return counts;
  }
  /** First-run seeding. */
  function run() {
    if (repo.getFlag('seeded')) return false;
    restoreMissing();
    repo.setFlag('seeded', true);
    return true;
  }

  return { FROM, TO, SOURCE, byTable, tariffs, components, timeBands, rates, holidays, settings, restoreMissing, run };
})();
