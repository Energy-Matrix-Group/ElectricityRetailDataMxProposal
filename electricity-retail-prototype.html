      view.innerHTML = pageHead({ title: 'Something went wrong' }) + callout('bad', `<b>${esc(e.message || String(e))}</b><br><span class="small">${esc((e.stack || '').split('\n').slice(0, 3).join(' · '))}</span>`);
    }
    renderNav(); renderBanners();
    document.title = `${(def.title && (typeof def.title === 'function' ? def.title(args) : def.title)) || 'Electricity Retail'} · Electricity Retail Prototype`;
    document.body.classList.remove('nav-open');
    main.scrollTop = name === state.lastName && location.hash === state.lastHash ? keep : 0;
    state.lastName = name; state.lastHash = location.hash;
  }
  const refresh = () => { const m = $('#main'), t = m.scrollTop; state.lastHash = location.hash; state.lastName = state.name; render(); m.scrollTop = t; };

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-action]');
    if (a && actions[a.dataset.action]) { e.preventDefault(); Promise.resolve(actions[a.dataset.action](a, e)).catch(err => { console.error(err); toast(err.message || String(err), 'bad'); }); return; }
    const row = e.target.closest('[data-go]');
    if (row && !e.target.closest('a, button, input, select, textarea, label')) go(row.dataset.go);
  });
  document.addEventListener('change', e => { const a = e.target.closest('[data-change]'); if (a && actions[a.dataset.change]) Promise.resolve(actions[a.dataset.change](a, e)).catch(err => toast(err.message || String(err), 'bad')); });
  document.addEventListener('input', e => { const a = e.target.closest('[data-input]'); if (a && actions[a.dataset.input]) actions[a.dataset.input](a, e); });
  document.addEventListener('submit', e => { const f = e.target.closest('form[data-submit]'); if (f && actions[f.dataset.submit]) { e.preventDefault(); Promise.resolve(actions[f.dataset.submit](f, e)).catch(err => toast(err.message || String(err), 'bad')); } });
  window.addEventListener('hashchange', render);
  storage.onError(err => { state.storageError = err; renderBanners(); toast('Not saved: browser storage is full or unavailable.', 'bad'); });

  // ---- charts (inline SVG; dataviz rules: thin marks, 4px rounded data end, 2px lines, hairline grid, tooltips) -----------------
  let tipAttr = null;
  const charts = (() => {
    const W = 900, registry = new Map();
    let uid = 0;
    const niceStep = (max, ticks = 5) => {
      if (!(max > 0)) return { max: 1, step: 0.2 };
      const raw = max / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
      const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
      return { max: Math.ceil(max / step) * step, step };
    };
    const compact = v => (Math.abs(v) >= 1e6 ? fmtNum(v / 1e6, v % 1e6 ? 1 : 0) + 'M' : Math.abs(v) >= 1e3 ? fmtNum(v / 1e3, v % 1e3 ? 1 : 0) + 'k' : fmtNum(v, v < 10 && v % 1 ? 1 : 0));
    const tipAttrs = (label, rows) => ` data-tip="${esc(JSON.stringify({ l: label, r: rows }))}"`;
    tipAttr = tipAttrs;
    function frame(height, left = 54) {
      return { H: height, L: left, R: 10, T: 10, B: 26, get pw() { return W - this.L - this.R; }, get ph() { return this.H - this.T - this.B; } };
    }
    function yAxis(f, max, step, fmt) {
      let s = '';
      for (let v = 0; v <= max + 1e-9; v += step) {
        const y = f.T + f.ph - (v / max) * f.ph;
        s += `<line class="gridline" x1="${f.L}" x2="${W - f.R}" y1="${y}" y2="${y}"/><text x="${f.L - 8}" y="${y + 3.5}" text-anchor="end">${esc(fmt ? fmt(v) : compact(v))}</text>`;
      }
      return s;
    }
    /** bars: [{ label, value, tip? }] */
    function bars({ data, height = 230, yFmt, tipFmt, color = 'var(--s1)', label = 'Bar chart', every }) {
      const f = frame(height), max = niceStep(Math.max(...data.map(d => d.value), 0)), slot = f.pw / data.length, bw = Math.min(24, slot * 0.72);
      const step = every || Math.max(1, Math.ceil(data.length / 14));
      let s = yAxis(f, max.max, max.step, yFmt);
      data.forEach((d, i) => {
        const h = (d.value / max.max) * f.ph, x = f.L + i * slot + (slot - bw) / 2, y = f.T + f.ph - h, base = f.T + f.ph, r = Math.min(4, h, bw / 2);
        const path = h > 0.5 ? `M${x},${base} V${y + r} a${r},${r} 0 0 1 ${r},${-r} H${x + bw - r} a${r},${r} 0 0 1 ${r},${r} V${base} Z` : '';
        s += `<g class="bar" tabindex="0"${tipAttrs(d.label, d.tip || [{ k: color, v: (tipFmt || fmtNum)(d.value) }])}><rect class="hit" x="${f.L + i * slot}" y="${f.T}" width="${slot}" height="${f.ph}"/>${path ? `<path d="${path}" fill="${color}"/>` : ''}</g>`;
        if (i % step === 0) s += `<text x="${x + bw / 2}" y="${f.H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
      });
      s += `<line class="axis" stroke="var(--line-2)" x1="${f.L}" x2="${W - f.R}" y1="${f.T + f.ph}" y2="${f.T + f.ph}"/>`;
      return `<svg class="chart" viewBox="0 0 ${W} ${height}" role="img" aria-label="${esc(label)}">${s}</svg>`;
    }
    /** stacked bars (surface gap between segments): data [{label, parts:[{name,value,color}]}] */
    function stacked({ data, height = 230, yFmt, label = 'Stacked bar chart', every }) {
      const f = frame(height), totals = data.map(d => d.parts.reduce((s, p) => s + p.value, 0)), max = niceStep(Math.max(...totals, 0)), slot = f.pw / data.length, bw = Math.min(24, slot * 0.72);
      const step = every || Math.max(1, Math.ceil(data.length / 14));
      let s = yAxis(f, max.max, max.step, yFmt);
      data.forEach((d, i) => {
        const x = f.L + i * slot + (slot - bw) / 2;
        let y = f.T + f.ph, seg = '';
        const nonZero = d.parts.filter(p => p.value > 0);
        nonZero.forEach((p, k) => {
          const h = (p.value / max.max) * f.ph, top = y - h, gap = k < nonZero.length - 1 ? 2 : 0, r = k === nonZero.length - 1 ? Math.min(4, h, bw / 2) : 0;
          seg += r > 0 ? `<path d="M${x},${y} V${top + r} a${r},${r} 0 0 1 ${r},${-r} H${x + bw - r} a${r},${r} 0 0 1 ${r},${r} V${y} Z" fill="${p.color}"/>` : `<rect x="${x}" y="${top}" width="${bw}" height="${Math.max(0, h - gap)}" fill="${p.color}"/>`;
          y = top;
        });
        s += `<g class="bar" tabindex="0"${tipAttrs(d.label, [...d.parts.map(p => ({ k: p.color, n: p.name, v: fmtNum(p.value) })), { n: 'Total', v: fmtNum(totals[i]) }])}><rect class="hit" x="${f.L + i * slot}" y="${f.T}" width="${slot}" height="${f.ph}"/>${seg}</g>`;
        if (i % step === 0) s += `<text x="${x + bw / 2}" y="${f.H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
      });
      return `<svg class="chart" viewBox="0 0 ${W} ${height}" role="img" aria-label="${esc(label)}">${s}</svg>`;
    }
    /** line chart: series [{ name, color, values[] (null = gap) }], xLabels[]; crosshair tooltip lists every series */
    function lines({ series, xLabels, height = 240, yFmt, tipFmt, label = 'Line chart', every, area = false, yMax }) {
      const f = frame(height), n = xLabels.length, all = series.flatMap(s => s.values).filter(v => v != null), max = niceStep(yMax || Math.max(...all, 0));
      const X = i => f.L + (n <= 1 ? f.pw / 2 : (i / (n - 1)) * f.pw), Y = v => f.T + f.ph - (v / max.max) * f.ph;
      const step = every || Math.max(1, Math.ceil(n / 12));
      let s = yAxis(f, max.max, max.step, yFmt);
      xLabels.forEach((l, i) => { if (i % step === 0) s += `<text x="${X(i)}" y="${f.H - 8}" text-anchor="middle">${esc(l)}</text>`; });
      series.forEach((sr, si) => {
        let d = '', pen = false, first = null, last = null;
        sr.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; if (first === null) first = i; last = i; });
        if (area && si === 0 && first !== null) s += `<path d="${d}L${X(last)},${f.T + f.ph}L${X(first)},${f.T + f.ph}Z" fill="${sr.color}" opacity=".10"/>`;
        s += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${sr.dash ? ` stroke-dasharray="${sr.dash}"` : ''}/>`;
        if (last !== null) s += `<circle cx="${X(last)}" cy="${Y(sr.values[last])}" r="4" fill="${sr.color}" stroke="var(--surface)" stroke-width="2"/>`;
      });
      const id = 'c' + (++uid);
      registry.set(id, { xLabels, series, f, n, tipFmt: tipFmt || (v => fmtNum(v, 1)) });
      s += `<line class="xh" x1="0" x2="0" y1="${f.T}" y2="${f.T + f.ph}" stroke="var(--line-2)" stroke-width="1" style="display:none"/><rect class="hit lh" data-chart="${id}" x="${f.L}" y="${f.T}" width="${f.pw}" height="${f.ph}"/>`;
      return `<svg class="chart" viewBox="0 0 ${W} ${height}" role="img" aria-label="${esc(label)}">${s}</svg>`;
    }
    const legend = items => `<div class="legend">${items.map(i => `<span><i class="${i.line ? 'ln' : ''}" style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
    return { bars, stacked, lines, legend, registry, niceStep, compact, W };
  })();

  // chart tooltips: built with textContent (labels are untrusted data)
  const tip = $('#chart-tip');
  function showTip(x, y, label, rows) {
    tip.textContent = '';
    const l = document.createElement('div'); l.className = 'tl'; l.textContent = label; tip.appendChild(l);
    for (const r of rows) {
      const row = document.createElement('div'); row.className = 'row';
      if (r.k) { const k = document.createElement('i'); k.className = 'key'; k.style.background = r.k; row.appendChild(k); }
      const v = document.createElement('span'); v.className = 'tv'; v.textContent = r.v; row.appendChild(v);
      if (r.n) { const n = document.createElement('span'); n.className = 'tl'; n.textContent = r.n; row.appendChild(n); }
      tip.appendChild(row);
    }
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 14)) + 'px';
    tip.style.top = Math.min(window.innerHeight - h - 8, Math.max(8, y - h - 10 < 8 ? y + 18 : y - h - 10)) + 'px';
  }
  const hideTip = () => { tip.style.display = 'none'; const xh = $('.xh[style*="block"]'); if (xh) xh.style.display = 'none'; };
  document.addEventListener('pointermove', e => {
    const t = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) { try { const d = JSON.parse(t.dataset.tip); showTip(e.clientX, e.clientY, d.l, d.r); } catch (_) { /* ignore */ } return; }
    const lh = e.target.closest ? e.target.closest('[data-chart]') : null;
    if (lh) {
      const c = charts.registry.get(lh.dataset.chart);
      if (!c) return;
      const svg = lh.ownerSVGElement, box = svg.getBoundingClientRect(), sx = (e.clientX - box.left) * (charts.W / box.width);
      const i = Math.max(0, Math.min(c.n - 1, Math.round(((sx - c.f.L) / c.f.pw) * (c.n - 1))));
      const xh = $('.xh', svg), x = c.f.L + (c.n <= 1 ? c.f.pw / 2 : (i / (c.n - 1)) * c.f.pw);
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.display = 'block';
      showTip(e.clientX, e.clientY, c.xLabels[i], c.series.map(s => ({ k: s.color, v: s.values[i] == null ? '–' : c.tipFmt(s.values[i]), n: s.name })));
      return;
    }
    hideTip();
  });
  document.addEventListener('pointerleave', hideTip);
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); try { const d = JSON.parse(t.dataset.tip); showTip(r.left + r.width / 2, r.top, d.l, d.r); } catch (_) { /* ignore */ } } });
  document.addEventListener('focusout', hideTip);

  // ---- global actions ---------------------------------------------------------------------------------------------------------
  act('export-all', () => {
    download(`electricity-retail-backup-${stampName()}.json`, repo.exportJson(), 'application/json');
    toast('Backup downloaded: every table, interval version and raw file.');
  });
  act('import-all', () => $('#import-file').click());
  $('#import-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const doc = JSON.parse(await file.text());
      const ok = await confirmDialog({ title: 'Replace all data?', message: `Importing <b>${esc(file.name)}</b> will <b>replace everything</b> currently stored in this browser (all tables, interval data and raw files) with the contents of the backup. Export first if you may need the current data.`, confirmLabel: 'Replace all data', danger: true });
      if (!ok) return;
      repo.importAll(doc);
      toast('Backup imported.');
      go('#/dashboard');
    } catch (err) { toast('Import failed: ' + (err.message || err), 'bad'); }
  });
  act('dismiss-storage-error', () => { state.storageError = null; renderBanners(); });
  act('toggle-nav', () => document.body.classList.toggle('nav-open'));

  return { $, $$, money, icon, badge, statusBadge, callout, kpi, empty, card, btn, link, pageHead, table, tabs, noticeList, toast, openDialog, formDialog, confirmDialog, infoDialog, download, exportXlsx, stampName, tipAttr: (l, r) => tipAttr(l, r),
    register, act, go, render, refresh, state, charts, screens, parseHash, renderNav, renderBanners, NAV };
})();
</script>
<script data-section="ui-meter">
/* ============================================================================
   SECTION 8a — ui screens: Meter data (upload, files + validation reports, interval explorer)
   ============================================================================ */
(() => {
  'use strict';
  const { $, $$, card, btn, badge, statusBadge, callout, kpi, table, empty, pageHead, icon, charts, toast, tipAttr } = ui;
  const { esc, fmtNum, fmtDate, fmtTs, fmtPct } = util;
  const FLAG_KIND = { A: 'good', E: 'warn', S: 'warn', F: 'warn', N: 'bad', V: 'info' };
  const KIND_LABEL = { consumption: 'consumption', export: 'export', reactive: 'reactive', other: 'other' };
  const mmmYY = ym => `${util.MON[+ym.slice(5, 7) - 1]} ${ym.slice(2, 4)}`;

  function qualityMix(q) {
    const t = Object.values(q || {}).reduce((s, v) => s + v, 0) || 1;
    const a = q.A || 0, e = (q.E || 0) + (q.S || 0) + (q.F || 0), n = q.N || 0;
    const seg = (c, w, title) => (w > 0 ? `<i style="width:${((w / t) * 100).toFixed(2)}%;background:${c}" title="${esc(title)}"></i>` : '');
    return `<div class="stripe" style="height:10px;min-width:90px">${seg('var(--q-actual)', a, 'Actual')}${seg('var(--q-est)', e, 'Estimated / substituted')}${seg('var(--q-miss)', n, 'Missing')}</div>` +
      `<div class="small muted nowrap">A ${fmtPct(a / t, 1)}${e ? ` · E/S/F ${fmtPct(e / t, 1)}` : ''}${n ? ` · N ${fmtPct(n / t, 1)}` : ''}</div>`;
  }
  const qualityLegend = () => `<div class="legend"><span><i style="background:var(--q-actual)"></i>Actual (A)</span><span><i style="background:var(--q-est)"></i>Estimated / substituted (E, S, F)</span><span><i style="background:var(--q-miss)"></i>Missing (N or no data)</span></div>`;
  const siteLabel = nmi => {
    const n = repo.get('Nmi', nmi), s = n && n.siteId ? repo.get('Site', n.siteId) : null, c = s ? repo.get('Customer', s.customerId) : null;
    return s ? `<a href="#/customers/${esc(c.customerId)}">${esc(c.name)}</a> · ${esc(s.name)}` : badge('Unassigned', 'warn');
  };

  // ============================== overview ==================================================================
  function ingestResults() {
    const res = ui.state.lastIngest;
    if (!res || !res.length) return '';
    return card({
      title: 'Result of the last upload',
      actions: btn('Dismiss', 'dismiss-ingest', { kind: 'sm ghost' }),
      body: res.map(r => {
        if (r.status === 'skipped') return callout('info', `<b>${esc(r.fileName)}</b>: skipped (identical file already stored).`);
        if (r.status === 'error') return callout('bad', `<b>${esc(r.fileName)}</b>: ${esc(r.message || 'could not be stored')}`);
        const rep = r.report, kind = { Accepted: 'good', Partial: 'warn', Rejected: 'bad' }[r.status] || 'info';
        const t = rep.issueTotals;
        return callout(kind, `<b>${esc(r.fileName)}</b>${r.innerFileName ? ` <span class="small">(zip containing ${esc(r.innerFileName)})</span>` : ''}: <b>${esc(r.status)}</b>. ` +
          (r.status === 'Rejected' ? `Nothing was ingested${rep.fatalReason ? ': ' + esc(rep.fatalReason) : ''}. ` : `${fmtNum(r.inserted)} interval rows added as new versions across ${rep.streams.length} datastream(s), ${fmtNum(rep.counts.validDays)} day(s)${rep.counts.skippedDays ? `, ${rep.counts.skippedDays} day(s) skipped` : ''}. `) +
          `${t.error} error(s), ${t.warning} warning(s). ${r.summary ? `<br><span class="small">${esc(r.summary)}</span>` : ''} <a href="#/meter-data/file/${esc(r.fileId)}">View validation report</a>` +
          (r.newNmis && r.newNmis.length ? `<br><span class="small">New NMI(s) discovered: ${r.newNmis.map(esc).join(', ')}. A task was created to assign them to a customer site.</span>` : ''), 'info');
      }).join(''),
    });
  }

  function overview() {
    const files = repo.list('MeterDataFile').sort((a, b) => b.uploadedAt.localeCompare(a.uploadedAt));
    const streams = repo.intervalStreams();
    const sampleLoaded = !!svc.setting('sample.params', null);
    const upload = card({
      title: 'Upload NEM12 files',
      body: `<div class="dropzone" id="dz" tabindex="0" role="button" aria-label="Choose NEM12 files to upload"><b>${icon('upload')} Drop NEM12 .csv or .zip files here, or click to choose</b><span class="muted">WA uses the 2004 NEMMCO MDFF specification v007 (records 100, 200, 300, 400, 500, 900). A .zip must contain exactly one CSV.</span></div>
        <input type="file" id="file-input" accept=".csv,.zip,.txt,text/csv,application/zip" multiple hidden>
        <div class="toolbar" style="margin:12px 0 0"><label class="check"><input type="checkbox" id="strict"> Strict mode: reject the whole file if any error is found</label><span class="spacer"></span>
          ${btn('Generate sample NEM12 (13 months, 2 test NMIs)', 'gen-sample', { kind: 'primary', ic: 'play' })}${btn('Generate revision file', 'gen-revision', { ic: 'refresh', title: 'Corrects the substituted, missing and estimated intervals in the sample data with a newer UpdateDateTime, to demonstrate versioning' })}</div>
        <p class="small muted" style="margin:10px 0 0">Every file is saved unchanged to the raw store first (SHA-256 recorded), then parsed. Each interval is inserted as a <b>new</b> row with its UpdateDateTime and source file; nothing is overwritten. ${sampleLoaded ? '' : 'The sample generator creates realistic 30-minute E1 (kWh) and Q1 (kvarh) data including S, E and N intervals.'}</p>`,
    });
    const filesTable = card({
      title: `Uploaded files (${files.length})`, flush: true,
      body: table({
        rows: files, go: f => `#/meter-data/file/${f.fileId}`, emptyHtml: empty('No files yet', 'Upload a NEM12 file or generate the sample data above.'),
        cols: [
          { label: 'File', render: f => `<b>${esc(f.fileName)}</b>${f.innerFileName ? `<div class="small muted">zip → ${esc(f.innerFileName)}</div>` : ''}` },
          { label: 'Uploaded', render: f => fmtTs(f.uploadedAt), cls: 'nowrap' },
          { label: 'Size', th: 'num', cls: 'num', render: f => util.fmtBytes(f.size) },
          { label: 'SHA-256', render: f => `<span class="mono" title="${esc(f.sha256)}">${esc(f.sha256.slice(0, 10))}…</span>` },
          { label: 'Status', render: f => statusBadge(f.status) },
          { label: 'NMIs', render: f => esc((f.nmis || []).join(', ')) },
          { label: 'Data from – to', cls: 'nowrap', render: f => (f.dateFrom ? `${fmtDate(f.dateFrom)} – ${fmtDate(f.dateTo)}` : '–') },
          { label: 'Rows added', th: 'num', cls: 'num', render: f => fmtNum(f.intervalRowsInserted) },
          { label: 'Errors / warnings', render: f => `${f.validation.issueTotals.error ? badge(f.validation.issueTotals.error + ' error' + (f.validation.issueTotals.error > 1 ? 's' : ''), 'bad') : ''} ${f.validation.issueTotals.warning ? badge(f.validation.issueTotals.warning + ' warning' + (f.validation.issueTotals.warning > 1 ? 's' : ''), 'warn') : ''}${!f.validation.issueTotals.error && !f.validation.issueTotals.warning ? badge('clean', 'good', 'check') : ''}` },
          { label: '', render: f => `<a class="btn sm" href="#/meter-data/file/${esc(f.fileId)}">Report</a> ${btn('Raw', 'download-raw', { kind: 'sm', ic: 'download', data: { id: f.fileId }, title: 'Download the stored file exactly as uploaded' })}` },
        ],
      }),
    });
    const streamsTable = card({
      title: `Datastreams: current versions (${streams.length})`, flush: true,
      actions: qualityLegend(),
      body: table({
        rows: streams, emptyHtml: empty('No interval data yet'),
        cols: [
          { label: 'NMI', render: s => `<a href="#/meter-data/stream/${esc(s.nmi)}/${esc(s.suffix)}"><b class="mono">${esc(s.nmi)}</b></a>` },
          { label: 'Suffix', render: s => `<b>${esc(s.suffix)}</b> <span class="small muted">${KIND_LABEL[nem12.kindOfSuffix(s.suffix)]}</span>` },
          { label: 'UOM → unit', render: s => `${esc(s.uom)} → ${esc(s.unit)}` },
          { label: 'Interval', th: 'num', cls: 'num', render: s => s.intervalLength + ' min' },
          { label: 'From – to', cls: 'nowrap', render: s => `${fmtDate(s.firstDate)} – ${fmtDate(s.lastDate)}` },
          { label: 'Days', th: 'num', cls: 'num', render: s => fmtNum(s.days) },
          { label: 'Intervals', th: 'num', cls: 'num', render: s => fmtNum(s.rowsCurrent) },
          { label: 'Older versions kept', th: 'num', cls: 'num', render: s => fmtNum(s.rowsTotal - s.rowsCurrent) },
          { label: 'Quality', render: s => qualityMix(s.quality) },
          { label: 'Customer · site', render: s => siteLabel(s.nmi) },
          { label: '', render: s => `<a class="btn sm" href="#/meter-data/stream/${esc(s.nmi)}/${esc(s.suffix)}">Explore</a>` },
        ],
      }),
    });
    return pageHead({ title: 'Meter data', sub: 'NEM12 interval data: ingest, validate, version and explore.' }) + upload + ingestResults() + filesTable + streamsTable;
  }

  async function handleFiles(list) {
    const strict = $('#strict') && $('#strict').checked, results = [];
    for (const f of Array.from(list)) {
      const bytes = new Uint8Array(await f.arrayBuffer());
      try {
        let r = await svc.ingestUpload({ fileName: f.name, bytes, strict });
        if (r.status === 'duplicate') {
          const ok = await ui.confirmDialog({
            title: 'This file was already uploaded',
            message: `<b>${esc(f.name)}</b> is byte-for-byte identical (SHA-256) to ${r.duplicates.map(d => `<b>${esc(d.fileName)}</b> (${fmtTs(d.uploadedAt)})`).join(', ')}.<br>Store and ingest it again? The raw file is kept either way; ingesting again adds identical interval versions (the newest still wins).`, confirmLabel: 'Ingest again',
          });
          if (!ok) { results.push({ fileName: f.name, status: 'skipped' }); continue; }
          r = await svc.ingestUpload({ fileName: f.name, bytes, strict, allowDuplicate: true });
        }
        results.push({ fileName: f.name, ...r });
      } catch (e) { results.push({ fileName: f.name, status: 'error', message: e.message || String(e) }); }
    }
    ui.state.lastIngest = results;
    ui.refresh();
    const bad = results.filter(r => r.status === 'Rejected' || r.status === 'error').length;
    toast(bad ? `${bad} file(s) were rejected or failed: see the result panel.` : `${results.length} file(s) processed.`, bad ? 'bad' : '');
  }

  function bindUpload(view) {
    const dz = $('#dz', view), inp = $('#file-input', view);
    if (!dz) return;
    dz.addEventListener('click', () => inp.click());
    dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
    inp.addEventListener('change', () => { if (inp.files.length) handleFiles(inp.files); });
    ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  }

  // ============================== file report ======================================================================

        body: issues.length ? `<div class="table-wrap"><table class="data" id="issues"><thead><tr><th></th><th>Check</th><th class="num">Line</th><th>Datastream</th><th>Message</th></tr></thead><tbody>${issues.map(i => `<tr data-sev="${i.sev}"><td>${badge(i.sev, sevKind[i.sev])}</td><td><code>${esc(i.code)}</code></td><td class="num">${i.line ? btn(i.line, 'view-raw', { kind: 'sm ghost', data: { id: fileId, line: i.line }, title: 'Show this line of the raw file' }) : '–'}</td><td class="nowrap">${i.nmi ? `<span class="mono">${esc(i.nmi)}</span> ${esc(i.suffix || '')}${i.date ? ' · ' + esc(i.date) : ''}` : ''}</td><td>${esc(i.msg)}</td></tr>`).join('')}</tbody></table></div>` : empty('No issues', 'The file passed every check.'),

  // ============================== interval explorer ==========================================================================
  const dayState = rows => {
    const n = rows.filter(r => r.quality === 'N').length, est = rows.filter(r => r.quality === 'E' || r.quality === 'S' || r.quality === 'F').length;
    return n ? 'm' : est ? 'e' : 'a';
  };
  function qualityCalendar(rows, from, to, nmi, suffix, expectedPerDay) {
    const byDay = util.groupBy(rows, r => r.intervalDate);
    const months = [];
    for (let m = util.monthStart(from); m <= to; m = util.addDays(util.monthEnd(m), 1)) months.push(m);
    return `<div class="qcal">${months.map(m => {
      const end = util.monthEnd(m), pad = (util.dow(m) + 6) % 7;
      let cells = '<i class="d pad"></i>'.repeat(pad);
      for (const d of util.dateRange(m, end)) {
        if (d < from || d > to) { cells += '<i class="d pad"></i>'; continue; }
        const r = byDay.get(d);
        let cls = '', desc;
        if (!r) { desc = 'No data'; }
        else {
          const q = {}; for (const x of r) q[x.quality] = (q[x.quality] || 0) + 1;
          cls = r.length < expectedPerDay ? 'm' : dayState(r);
          desc = Object.entries(q).map(([k, v]) => `${k} ${v}`).join(' · ') + (r.length < expectedPerDay ? ` · ${expectedPerDay - r.length} missing` : '');
        }
        cells += `<a class="d ${cls}" href="#/meter-data/stream/${esc(nmi)}/${esc(suffix)}?day=${d}"${tipAttr(`${util.DOW[util.dow(d)]} ${fmtDate(d)}`, [{ v: !r ? 'No data' : cls === 'm' ? 'Missing intervals' : cls === 'e' ? 'Estimated / substituted' : 'Actual', n: desc }])} aria-label="${esc(d + ': ' + desc)}"></a>`;
      }
      return `<div class="mo"><b>${esc(util.fmtMonth(util.ymKey(m)))}</b><div class="days">${cells}</div></div>`;
    }).join('')}</div>`;
  }

  function explorer(nmi, suffix, q) {
    const streams = repo.intervalStreams().filter(s => s.nmi === nmi), stream = streams.find(s => s.suffix === suffix);
    if (!stream) return pageHead({ title: 'Datastream not found' }) + callout('bad', 'No data for that NMI and suffix.') + ui.link('Back to meter data', '#/meter-data');
    const from = q.from && q.from >= stream.firstDate ? q.from : stream.firstDate, to = q.to && q.to <= stream.lastDate ? q.to : stream.lastDate;
    const kind = nem12.kindOfSuffix(suffix), L = stream.intervalLength, perDay = 1440 / L, unit = stream.unit;
    const rows = repo.currentIntervals(nmi, suffix, from, to);
    const hol = svc.loadBook().holidays;
    const total = util.sum(rows, r => r.value), nDays = new Set(rows.map(r => r.intervalDate)).size;
    const qc = {}; rows.forEach(r => { qc[r.quality] = (qc[r.quality] || 0) + 1; });
    const toKw = v => (v * 60) / L;                                    // kWh in one interval -> kW
    // monthly
    const monthly = new Map();
    rows.forEach(r => { const k = util.ymKey(r.intervalDate); monthly.set(k, (monthly.get(k) || 0) + r.value); });
    // daily
    const daily = new Map();
    rows.forEach(r => daily.set(r.intervalDate, (daily.get(r.intervalDate) || 0) + r.value));
    const dayKeys = util.dateRange(from, to);
    // average profile
    const sums = { wd: new Float64Array(perDay), we: new Float64Array(perDay) }, cnt = { wd: new Float64Array(perDay), we: new Float64Array(perDay) };
    rows.forEach(r => { const d = util.dow(r.intervalDate), k = d >= 1 && d <= 5 && !hol.has(r.intervalDate) ? 'wd' : 'we'; sums[k][r.intervalNo - 1] += r.value; cnt[k][r.intervalNo - 1]++; });
    const prof = k => Array.from(sums[k], (s, i) => (cnt[k][i] ? toKw(s / cnt[k][i]) : null));
    const times = Array.from({ length: perDay }, (_, i) => util.minToHHMM(i * L));
    let peakRow = null; rows.forEach(r => { if (!peakRow || r.value > peakRow.value) peakRow = r; });
    const isEnergy = unit === 'kWh', rate = isEnergy ? 'kW' : 'kvar';

    // kVA series for consumption streams
    let kvaChart = '';
    if (kind === 'consumption') {
      const ctx = svc.nmiContext(nmi), profile = svc.loadProfile(nmi, svc.leadInStart(from), to, { assumedPf: ctx.siteParams.assumedPf });
      const winStart = d => util.addDays(util.addMonths(d, -12), 1), vals = [], mds = [];
      const dm = d => { const x = profile.days.get(d); return x ? x.maxKva : 0; };
      for (const d of dayKeys) { vals.push(profile.days.has(d) ? dm(d) : null); let m = 0; for (let n = util.dayNum(winStart(d)), e = util.dayNum(d); n <= e; n++) m = Math.max(m, dm(util.fromDayNum(n))); mds.push(m); }
      kvaChart = card({
        title: 'Maximum demand (kVA)',
        body: charts.lines({ series: [{ name: 'Daily peak half-hour kVA', color: 'var(--s1)', values: vals }, { name: 'Rolling 12-month MD (RT6 basis)', color: 'var(--s2)', values: mds }], xLabels: dayKeys.map(d => `${+d.slice(8)} ${util.MON[+d.slice(5, 7) - 1]} ${d.slice(2, 4)}`), tipFmt: v => fmtNum(v, 1) + ' kVA', yFmt: charts.compact, label: 'Daily peak kVA and rolling 12-month maximum demand' }) + charts.legend([{ name: 'Daily peak half-hour kVA', color: 'var(--s1)', line: true }, { name: 'Rolling 12-month MD (RT6 basis)', color: 'var(--s2)', line: true }]),
        footer: `${profile.hasReactive ? 'kVA = √(kW² + kvar²) per half hour from the E and Q datastreams.' : `<b>No Q/K (reactive) datastream:</b> kVA is kW ÷ ${ctx.siteParams.assumedPf} (the site's assumed power factor).`} The rolling MD only covers the 12 months before the first day shown when earlier data exists.`,
      });
    }
    const dayParam = q.day && rows.some(r => r.intervalDate === q.day) ? q.day : (q.day || '');
    return `<div class="crumbs no-print"><a href="#/meter-data">Meter data</a> › ${esc(nmi)} ${esc(suffix)}</div>` +
      pageHead({
        title: `<span class="mono">${esc(nmi)}</span> · ${esc(suffix)} <span class="muted" style="font-weight:400;font-size:14px">${KIND_LABEL[kind]}</span>`,
        sub: `${siteLabel(nmi)} · ${esc(stream.uom)} → ${esc(unit)} · ${L}-minute intervals (${perDay} per day) · ${fmtDate(stream.firstDate)} – ${fmtDate(stream.lastDate)}`,
        actions: btn('Export to Excel', 'export-intervals', { ic: 'sheet', data: { nmi, suffix, from, to } }) + ui.link('Back', '#/meter-data', { kind: 'btn' }),
      }) +
      (streams.length > 1 ? `<div class="tabs">${streams.map(s => `<a class="tab${s.suffix === suffix ? ' active' : ''}" href="#/meter-data/stream/${esc(nmi)}/${esc(s.suffix)}">${esc(s.suffix)} <span class="small muted">${KIND_LABEL[nem12.kindOfSuffix(s.suffix)]}</span></a>`).join('')}</div>` : '') +
      `<form class="toolbar" data-submit="explorer-range" data-nmi="${esc(nmi)}" data-suffix="${esc(suffix)}"><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px">From <input type="date" name="from" class="in" value="${from}" min="${stream.firstDate}" max="${stream.lastDate}"></label><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px">To <input type="date" name="to" class="in" value="${to}" min="${stream.firstDate}" max="${stream.lastDate}"></label><button class="btn" type="submit">Apply</button><span class="spacer"></span><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px">Show day <input type="date" name="day" class="in" value="${esc(dayParam)}" min="${stream.firstDate}" max="${stream.lastDate}"></label><button class="btn" type="submit" name="go" value="day">Show</button></form>` +
      `<div class="kpis">${kpi(`Total ${unit}`, fmtNum(total, 0), `${fmtNum(nDays)} days · ${fmtNum(rows.length)} intervals`)}${kpi('Average per day', fmtNum(nDays ? total / nDays : 0, 1), unit)}${kpi(`Peak interval (${rate})`, fmtNum(peakRow ? toKw(peakRow.value) : 0, 1), peakRow ? `${fmtDate(peakRow.intervalDate)} ${util.minToHHMM(peakRow.startMinute)}` : '')}${kpi('Data quality', fmtPct((qc.A || 0) / (rows.length || 1), 1) + ' actual', `${fmtNum((qc.E || 0) + (qc.S || 0) + (qc.F || 0))} E/S/F · ${fmtNum(qc.N || 0)} N`)}</div>` +
      (dayParam ? dayDetail(nmi, suffix, dayParam, stream) : '') +
      card({ title: `Monthly ${unit}`, body: charts.bars({ data: Array.from(monthly, ([k, v]) => ({ label: mmmYY(k), value: v, tip: [{ k: 'var(--s1)', v: fmtNum(v, 0) + ' ' + unit }] })), tipFmt: v => fmtNum(v, 0) + ' ' + unit, yFmt: charts.compact, label: `Monthly ${unit}`, every: 1 }) }) +
      card({ title: `Daily ${unit}`, body: charts.lines({ series: [{ name: `Daily ${unit}`, color: 'var(--s1)', values: dayKeys.map(d => (daily.has(d) ? daily.get(d) : null)) }], xLabels: dayKeys.map(d => `${+d.slice(8)} ${util.MON[+d.slice(5, 7) - 1]} ${d.slice(2, 4)}`), area: true, tipFmt: v => fmtNum(v, 0) + ' ' + unit, yFmt: charts.compact, label: `Daily ${unit}` }) }) +
      kvaChart +
      card({
        title: `Average ${rate} profile by time of day`,
        body: charts.lines({ series: [{ name: 'Weekdays', color: 'var(--s1)', values: prof('wd') }, { name: 'Weekends and public holidays', color: 'var(--s2)', values: prof('we') }], xLabels: times, every: 4, tipFmt: v => fmtNum(v, 1) + ' ' + rate, yFmt: charts.compact, label: `Average ${rate} by time of day` }) + charts.legend([{ name: 'Weekdays', color: 'var(--s1)', line: true }, { name: 'Weekends and public holidays', color: 'var(--s2)', line: true }]),
        footer: `Time shown is the interval START time (interval 1 is the period ending ${util.minToHHMM(L)}). Public holidays come from the Public holidays table.`,
      }) +
      card({ title: 'Data quality calendar', body: qualityCalendar(rows, from, to, nmi, suffix, perDay) + qualityLegend(), footer: 'Click a day to see its intervals, flags and every stored version.' });
  }

  function dayDetail(nmi, suffix, day, stream) {

          { label: `Value (${stream.unit})`, th: 'num', cls: 'num', render: r => fmtNum(r.value, 3) }, { label: 'Quality', render: r => badge(r.quality + (r.method || ''), FLAG_KIND[r.quality] || '') },
          { label: 'Reason', render: r => esc((r.reasonCode ? r.reasonCode + ' ' : '') + (r.reasonDescription || '')) }, { label: 'UpdateDateTime', cls: 'nowrap', render: r => util.fmtDT14(r.updateDateTime) },
          { label: 'Source file', render: r => { const f = files.get(r.sourceFileId); return f ? `<a href="#/meter-data/file/${esc(f.fileId)}">${esc(f.fileName.length > 34 ? f.fileName.slice(0, 31) + '…' : f.fileName)}</a> <span class="small muted">line ${r.sourceLine}</span>` : esc(r.sourceFileId); } },
          { label: 'Versions', th: 'num', cls: 'num', render: r => (vcount.get(r.intervalNo) > 1 ? badge(vcount.get(r.intervalNo), 'info') : '1') },

    });

  ui.qualityMix = qualityMix; ui.siteLabel = siteLabel; ui.qualityLegend = qualityLegend;
  ui.act('dismiss-ingest', () => { ui.state.lastIngest = null; ui.refresh(); });

  ui.act('filter-issues', el => {

  ui.act('show-versions', el => {

    });
  });
  ui.act('explorer-range', (form, e) => {
    const f = new FormData(form), nmi = form.dataset.nmi, suffix = form.dataset.suffix;
    const day = e.submitter && e.submitter.value === 'day' ? f.get('day') : '';

    if (day) qs.set('day', day);

  });
  ui.act('export-intervals', el => {
    const { nmi, suffix, from, to } = el.dataset, files = svc.asMap(repo.list('MeterDataFile'), 'fileId');
    const rows = repo.currentIntervals(nmi, suffix, from, to);
    ui.exportXlsx(`intervals-${nmi}-${suffix}-${from}-${to}.xlsx`, [{ name: 'Current intervals', rows: [['NMI', 'Suffix', 'Date', 'Interval', 'Start', 'End', 'Value', 'Unit', 'Quality', 'Method', 'ReasonCode', 'ReasonDescription', 'UpdateDateTime', 'SourceFile', 'SourceLine'],
      ...rows.map(r => [r.nmi, r.suffix, r.intervalDate, r.intervalNo, util.minToHHMM(r.startMinute), util.minToHHMM(r.startMinute + r.intervalLength), r.value, r.unit, r.quality, r.method, r.reasonCode, r.reasonDescription, r.updateDateTime, (files.get(r.sourceFileId) || {}).fileName || r.sourceFileId, r.sourceLine])] }]);
  });
  ui.act('gen-sample', async el => {
    if (svc.setting('sample.params', null) && !(await ui.confirmDialog({ title: 'Generate the sample data again?', message: 'The sample files were already generated. Generating again stores another full set of raw files and interval versions (about 1.5 MB of browser storage). The newest versions win, so results will not change.', confirmLabel: 'Generate again' }))) return;
    el.disabled = true; el.textContent = 'Generating…';
    await new Promise(r => setTimeout(r, 30));
    try {
      const out = await svc.loadSampleData();
      ui.state.lastIngest = out.results;
      toast(`Sample data loaded for ${fmtDate(out.window.from)} – ${fmtDate(out.window.to)}.`);
    } catch (e) { toast(e.message || String(e), 'bad'); }
    ui.refresh();
  });
  ui.act('gen-revision', async el => {
    el.disabled = true;
    try { const out = await svc.loadSampleRevision(); ui.state.lastIngest = out.results; toast('Revision file ingested: corrected intervals were appended as newer versions.'); } catch (e) { toast(e.message || String(e), 'bad'); }
    ui.refresh();
  });

  ui.register('meter-data', {
    title: args => (args[0] === 'file' ? 'Validation report' : args[0] === 'stream' ? 'Interval explorer' : 'Meter data'), nav: 'meter-data',
    render: (args, q) => (args[0] === 'file' ? fileReport(args[1]) : args[0] === 'stream' ? explorer(args[1], args[2], q) : overview()),
    mount: view => bindUpload(view),
  });
})();
</script>
<script data-section="ui-tariff">
/* ============================================================================
   SECTION 8b — ui screens: Tariff book (view / edit rates, time bands, RT6 checks) and Public holidays
   ============================================================================ */
(() => {
  'use strict';
  const { $, $$, card, btn, badge, statusBadge, callout, kpi, table, empty, pageHead, icon, toast, tabs } = ui;
  const { esc, fmtNum, fmtDate } = util;
  const f3 = n => fmtNum(n, 3);
  const COMPONENT_UNITS = { FIXED: 'c/day', METERING: 'c/day', ENERGY: 'c/kWh', DEMAND_FIXED: 'c/day', DEMAND_RATE: 'c/kVA/day', PARAM: 'factor', METERING_ADDON: 'c/meter/day', RET_ENERGY: 'c/kWh', RET_FIXED: 'c/day', RET_OTHER_KWH: 'c/kWh', RET_OTHER_DAY: 'c/day' };
  const NETWORK_COMPONENTS = ['FIXED', 'METERING', 'ENERGY', 'DEMAND_FIXED', 'DEMAND_RATE', 'PARAM', 'METERING_ADDON'];
  const RETAIL_COMPONENTS = ['RET_ENERGY', 'RET_FIXED', 'RET_OTHER_KWH', 'RET_OTHER_DAY'];
  const BAND_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
  const ownerLabel = code => (code === 'WP' ? 'Western Power (network)' : (repo.get('RetailOffer', code) || {}).name || code);
  const rateKey = r => [r.ownerCode, r.tariffCode, r.componentCode, r.bandCode || ''].join('|');
  const isActive = (r, d) => (!r.effectiveFrom || r.effectiveFrom <= d) && (!r.effectiveTo || r.effectiveTo >= d);

  // ============================== rate grid (shared with Retail offers) ==========================================
  /** Overlaps: two rows with the same key whose date ranges intersect. Returns Map rateId -> message. */
  function overlapsOf(rates) {
    const out = new Map(), groups = util.groupBy(rates, rateKey);
    for (const g of groups.values()) {
      for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
        const a = g[i], b = g[j];
        if ((a.effectiveTo || '9999-12-31') >= b.effectiveFrom && (b.effectiveTo || '9999-12-31') >= a.effectiveFrom) {
          out.set(a.rateId, `Overlaps another rate row for the same charge (effective ${b.effectiveFrom} to ${b.effectiveTo || 'open'}). The row with the latest EffectiveFrom wins.`);
          out.set(b.rateId, `Overlaps another rate row for the same charge (effective ${a.effectiveFrom} to ${a.effectiveTo || 'open'}). The row with the latest EffectiveFrom wins.`);
        }
      }
    }
    return out;
  }
  function rateFilters(ownerCode, q) {
    const f = { tariff: q.tariff || '', component: q.component || '', asat: q.asat === undefined ? '' : q.asat };
    return f;
  }
  /** Renders the filter bar + editable table for the rates owned by `ownerCode`. */
  function rateGrid({ ownerCode, q, base, title, tariffs, components }) {
    const f = rateFilters(ownerCode, q);
    const all = repo.list('Rate', r => r.ownerCode === ownerCode);
    const overlaps = overlapsOf(all);
    let rows = all.filter(r => (!f.tariff || r.tariffCode === f.tariff) && (!f.component || r.componentCode === f.component) && (!f.asat || isActive(r, f.asat)));
    rows.sort((a, b) => a.tariffCode.localeCompare(b.tariffCode) || a.componentCode.localeCompare(b.componentCode) || (a.bandCode || '').localeCompare(b.bandCode || '') || a.effectiveFrom.localeCompare(b.effectiveFrom));
    const tariffOpts = ['<option value="">All tariffs</option>', ...tariffs.map(t => `<option value="${esc(t)}"${f.tariff === t ? ' selected' : ''}>${esc(t)}</option>`)].join('');
    const compOpts = ['<option value="">All components</option>', ...components.map(c => `<option value="${c}"${f.component === c ? ' selected' : ''}>${c}</option>`)].join('');
    const inp = (r, field, type, cls = '') => `<input class="in cell ${cls}" type="${type}" ${type === 'number' ? 'step="any"' : ''} value="${esc(r[field] == null ? '' : r[field])}" data-change="rate-edit" data-id="${esc(r.rateId)}" data-field="${field}" aria-label="${field}">`;
    const bar = `<div class="toolbar" data-base="${esc(base)}" data-owner="${esc(ownerCode)}">
      <select class="in" style="width:auto" data-change="rates-filter" aria-label="Tariff">${tariffOpts}</select>
      <select class="in" style="width:auto" data-change="rates-filter" aria-label="Component">${compOpts}</select>
      <label class="field" style="grid-auto-flow:column;align-items:center;gap:6px">Effective on <input class="in" style="width:auto" type="date" value="${esc(f.asat)}" data-change="rates-filter" name="asat"></label>
      <button class="btn sm ghost" data-action="rates-clear" data-base="${esc(base)}">All dates</button><span class="spacer"></span>
      ${btn('Add rate', 'rate-add', { ic: 'plus', kind: 'primary sm', data: { owner: ownerCode } })}${btn('Roll forward…', 'rate-roll', { ic: 'refresh', kind: 'sm', data: { owner: ownerCode }, title: 'Copy the rates effective in one period to the next, optionally with a % uplift' })}
      ${btn('Import CSV', 'rate-import', { ic: 'upload', kind: 'sm', data: { owner: ownerCode } })}${btn('Export CSV', 'rate-export', { ic: 'download', kind: 'sm', data: { owner: ownerCode, tariff: f.tariff, component: f.component, asat: f.asat } })}${btn('Excel', 'rate-xlsx', { ic: 'sheet', kind: 'sm', data: { owner: ownerCode } })}</div>`;
    const tbl = table({
      rows, emptyHtml: empty('No rates match', 'Change the filters, or add / import rates.'), rowClass: r => (overlaps.has(r.rateId) ? 'warn' : ''),
      cols: [
        { label: 'Tariff', render: r => `<b>${esc(r.tariffCode)}</b>` }, { label: 'Component', render: r => `<code>${esc(r.componentCode)}</code>` }, { label: 'Band / code', render: r => esc(r.bandCode || '') },
        { label: 'Lower kVA', th: 'num', cls: 'num', render: r => (r.lowerKva == null && !/^DEMAND/.test(r.componentCode) ? '' : inp(r, 'lowerKva', 'number', 'num')) },
        { label: 'Upper kVA', th: 'num', cls: 'num', render: r => (r.upperKva == null && !/^DEMAND/.test(r.componentCode) ? '' : inp(r, 'upperKva', 'number', 'num')) },
        { label: 'Value', th: 'num', cls: 'num', render: r => inp(r, 'value', 'number', 'num') }, { label: 'Unit', render: r => `<span class="small muted">${esc(r.unit)}</span>` },
        { label: 'Effective from', render: r => inp(r, 'effectiveFrom', 'date') }, { label: 'Effective to', render: r => inp(r, 'effectiveTo', 'date') },
        { label: 'Note', render: r => `${inp(r, 'note', 'text')}${overlaps.has(r.rateId) ? `<div class="small" style="color:var(--warn)">${icon('warn')} ${esc(overlaps.get(r.rateId))}</div>` : ''}` },
        { label: '', render: r => `${btn('', 'rate-dup', { ic: 'copy', kind: 'sm ghost', data: { id: r.rateId }, title: 'Duplicate as the next period' })}${btn('', 'rate-del', { ic: 'trash', kind: 'sm ghost', data: { id: r.rateId }, title: 'Delete this rate row' })}` },
      ],
    });
    return card({ title: `${title} <span class="muted" style="font-weight:400;font-size:13px">(${rows.length} of ${all.length} rows${f.asat ? ' effective ' + fmtDate(f.asat) : ', all dates'})</span>`, flush: true, body: bar + tbl,
      footer: `Prices are in cents, ex GST. Each row has an EffectiveFrom / EffectiveTo; the engine resolves the row effective on each billing day, so a new price list is a <b>data load</b> (add rows or import a CSV) and never a code change. Edits save when you leave a field.` });
  }
  ui.rateGrid = rateGrid;
  ui.RATE_HELP = { COMPONENT_UNITS, NETWORK_COMPONENTS, RETAIL_COMPONENTS };

  const rateFields = ownerCode => {
    const retail = ownerCode !== 'WP';
    const tariffs = repo.list('NetworkTariff').map(t => t.tariffCode);
    return [
      { name: 'tariffCode', label: retail ? 'Network tariff (or * for any)' : 'Tariff (or * for every tariff)', type: 'select', options: retail ? ['*', ...tariffs] : [...tariffs, '*'], required: true },
      { name: 'componentCode', label: 'Component', type: 'select', options: retail ? RETAIL_COMPONENTS : NETWORK_COMPONENTS, required: true, help: retail ? 'RET_ENERGY per band · RET_FIXED c/day · RET_OTHER_KWH / RET_OTHER_DAY need a short code in Band' : 'DEMAND_FIXED and DEMAND_RATE need a band code and kVA range · PARAM: DF, TAPER_START, TAPER_END, DEMAND_LENGTH_KVA · METERING_ADDON: service code (M1…)' },
      { name: 'bandCode', label: 'Band / code', help: retail ? 'e.g. ON_PEAK, ALL, * (any band), ENV' : 'e.g. ON_PEAK, ALL, B1, M5, DF' },
      { name: 'value', label: 'Value', type: 'number', step: 'any', required: true }, { name: 'unit', label: 'Unit', help: 'Filled in from the component when blank' },
      { name: 'lowerKva', label: 'Lower kVA (demand bands)', type: 'number', step: 'any' }, { name: 'upperKva', label: 'Upper kVA (demand bands)', type: 'number', step: 'any' },
      { name: 'effectiveFrom', label: 'Effective from', type: 'date', required: true }, { name: 'effectiveTo', label: 'Effective to (blank = open ended)', type: 'date' },
      { name: 'note', label: 'Note', full: true },
    ];
  };
  const cleanRate = (ownerCode, v) => ({
    ownerCode, tariffCode: v.tariffCode, componentCode: v.componentCode, bandCode: v.bandCode || '', lowerKva: v.lowerKva, upperKva: v.upperKva, value: v.value, unit: v.unit || COMPONENT_UNITS[v.componentCode] || '',
    effectiveFrom: v.effectiveFrom, effectiveTo: v.effectiveTo || null, source: ownerCode === 'WP' ? 'Entered manually' : 'Retail offer', note: v.note || '',
  });
  const rateIdFor = r => [r.ownerCode, r.tariffCode === '*' ? 'ALL' : r.tariffCode, r.componentCode, r.bandCode || '-', r.effectiveFrom].join('.');
  const validateRate = v => (v.effectiveTo && v.effectiveTo < v.effectiveFrom ? 'Effective to is before effective from.' : !(typeof v.value === 'number' && v.value >= 0) ? 'Value must be a number, zero or more.' : null);

  ui.act('rates-filter', el => {
    const bar = el.closest('.toolbar'), [tariff, comp] = $$('select', bar), asat = $('input[name=asat]', bar).value;
    const qs = new URLSearchParams();
    if (tariff.value) qs.set('tariff', tariff.value); if (comp.value) qs.set('component', comp.value); qs.set('asat', asat);
    const base = bar.dataset.base;
    ui.go(base + (base.includes('?') ? '&' : '?') + qs);
  });
  ui.act('rates-clear', el => { const base = el.dataset.base; ui.go(base + (base.includes('?') ? '&' : '?') + 'asat='); });
  ui.act('rate-edit', el => {
    const { id, field } = el.dataset, num = ['value', 'lowerKva', 'upperKva'].includes(field);
    let v = el.value.trim();
    if (num) v = v === '' ? null : Number(v);
    if (v === '' && field !== 'note') v = null;
    const row = repo.get('Rate', id), next = { ...row, [field]: v };
    const err = validateRate(next) || (field === 'effectiveFrom' && !next.effectiveFrom ? 'Effective from is required.' : null);
    if (err) { el.classList.add('invalid'); toast(err, 'bad'); return; }
    repo.update('Rate', id, { [field]: v });
    el.classList.remove('invalid');
    toast('Rate saved.');
    ui.refresh();
  });
  ui.act('rate-add', el => {
    const owner = el.dataset.owner;
    ui.formDialog({
      title: 'Add rate', wide: true, submitLabel: 'Add rate', fields: rateFields(owner), values: { tariffCode: owner === 'WP' ? 'RT2' : '*', componentCode: owner === 'WP' ? 'ENERGY' : 'RET_ENERGY', effectiveFrom: svc.today(), value: 0 },
      onSubmit: v => {
        const err = validateRate(v); if (err) return err;
        const row = cleanRate(owner, v), id = rateIdFor(row);
        repo.insert('Rate', { rateId: repo.get('Rate', id) ? util.uid('R') : id, ...row });
        toast('Rate added.');
      },
    });
  });
  ui.act('rate-del', async el => {
    const r = repo.get('Rate', el.dataset.id);
    if (!(await ui.confirmDialog({ title: 'Delete this rate row?', message: `${esc(r.tariffCode)} · ${esc(r.componentCode)} ${esc(r.bandCode || '')} = ${f3(r.value)} ${esc(r.unit)} (effective ${esc(r.effectiveFrom)} to ${esc(r.effectiveTo || 'open')}).`, confirmLabel: 'Delete', danger: true }))) return;
    repo.remove('Rate', r.rateId); toast('Rate deleted.'); ui.refresh();
  });
  ui.act('rate-dup', el => {
    const r = repo.get('Rate', el.dataset.id), from = r.effectiveTo ? util.addDays(r.effectiveTo, 1) : util.addMonths(r.effectiveFrom, 12);
    const row = { ...r, effectiveFrom: from, effectiveTo: r.effectiveTo ? util.addDays(util.addMonths(r.effectiveTo, 12), 0) : null, source: 'Duplicated', rateId: undefined };
    delete row.createdAt; delete row.modifiedAt; row.rateId = rateIdFor(row);
    if (repo.get('Rate', row.rateId)) row.rateId = util.uid('R');
    repo.insert('Rate', row); toast(`Duplicated for ${row.effectiveFrom}: edit the new row's value.`); ui.refresh();
  });
  ui.act('rate-roll', el => {
    const owner = el.dataset.owner, rates = repo.list('Rate', r => r.ownerCode === owner);
    const froms = Array.from(new Set(rates.map(r => r.effectiveFrom))).sort();
    ui.formDialog({
      title: 'Roll rates forward', submitLabel: 'Create rows',
      intro: '<p>Copies every rate that is effective on the chosen date into a new period, optionally with an uplift. Existing rows are untouched: review and edit the new ones afterwards.</p>',
      fields: [{ name: 'source', label: 'Copy the rates effective on', type: 'date', required: true }, { name: 'from', label: 'New period starts', type: 'date', required: true }, { name: 'to', label: 'New period ends (blank = open ended)', type: 'date' }, { name: 'uplift', label: 'Uplift % applied to price values', type: 'number', step: 'any', help: 'Not applied to kVA thresholds or PARAM rows.' }],
      values: { source: froms.length ? froms[froms.length - 1] : svc.today(), from: froms.length ? util.addMonths(froms[froms.length - 1], 12) : svc.today(), to: '', uplift: 0 },
      onSubmit: v => {
        if (v.to && v.to < v.from) return 'The new period ends before it starts.';
        const src = rates.filter(r => isActive(r, v.source));
        if (!src.length) return 'No rates are effective on that date.';
        const exist = new Set(rates.filter(r => r.effectiveFrom === v.from).map(rateKey));
        const rows = src.filter(r => !exist.has(rateKey(r))).map(r => {
          const price = r.componentCode !== 'PARAM' ? r.value * (1 + (v.uplift || 0) / 100) : r.value;
          const row = { ...r, value: Math.round(price * 1e6) / 1e6, effectiveFrom: v.from, effectiveTo: v.to || null, source: `Rolled forward from ${v.source}${v.uplift ? ` (+${v.uplift}%)` : ''}` };
          delete row.createdAt; delete row.modifiedAt; row.rateId = rateIdFor(row);
          return row;
        });
        if (!rows.length) return 'Every rate already has a row starting on that date.';
        repo.insertMany('Rate', rows);
        toast(`${rows.length} rate rows created for ${fmtDate(v.from)}.`);
      },
    });
  });
  const CSV_COLS = ['ownerCode', 'tariffCode', 'componentCode', 'bandCode', 'lowerKva', 'upperKva', 'value', 'unit', 'effectiveFrom', 'effectiveTo', 'note'];
  ui.act('rate-export', el => {
    const { owner, tariff, component, asat } = el.dataset;
    const rows = repo.list('Rate', r => r.ownerCode === owner && (!tariff || r.tariffCode === tariff) && (!component || r.componentCode === component) && (!asat || isActive(r, asat)));
    ui.download(`rates-${owner}-${ui.stampName()}.csv`, util.csvStringify([CSV_COLS, ...rows.map(r => CSV_COLS.map(c => (r[c] == null ? '' : r[c])))]), 'text/csv');
  });
  ui.act('rate-xlsx', el => {
    const rows = repo.list('Rate', r => r.ownerCode === el.dataset.owner);
    ui.exportXlsx(`rates-${el.dataset.owner}-${ui.stampName()}.xlsx`, [{ name: 'Rates', rows: [CSV_COLS, ...rows.map(r => CSV_COLS.map(c => (r[c] == null ? '' : r[c])))] }]);
  });
  ui.act('rate-import', el => {
    const owner = el.dataset.owner, inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.csv,text/csv';
    inp.addEventListener('change', async () => {
      if (!inp.files[0]) return;
      const rows = util.csvParse(await inp.files[0].text());
      const head = rows.shift().map(h => h.trim()), idx = Object.fromEntries(CSV_COLS.map(c => [c, head.indexOf(c)]));
      const missing = ['tariffCode', 'componentCode', 'value', 'effectiveFrom'].filter(c => idx[c] < 0);
      if (missing.length) return toast(`CSV is missing column(s): ${missing.join(', ')}. Expected: ${CSV_COLS.join(', ')}`, 'bad');
      const good = [], bad = [];
      rows.forEach((r, i) => {
        const g = c => (idx[c] >= 0 ? (r[idx[c]] || '').trim() : '');
        const v = { tariffCode: g('tariffCode'), componentCode: g('componentCode'), bandCode: g('bandCode'), value: g('value') === '' ? NaN : Number(g('value')), unit: g('unit'), lowerKva: g('lowerKva') === '' ? null : Number(g('lowerKva')), upperKva: g('upperKva') === '' ? null : Number(g('upperKva')), effectiveFrom: g('effectiveFrom'), effectiveTo: g('effectiveTo') || null, note: g('note') };
        const problem = !v.tariffCode ? 'tariffCode is blank' : !v.componentCode ? 'componentCode is blank' : !Number.isFinite(v.value) ? 'value is not a number' : !util.isIsoDate(v.effectiveFrom) ? 'effectiveFrom must be YYYY-MM-DD' : v.effectiveTo && !util.isIsoDate(v.effectiveTo) ? 'effectiveTo must be YYYY-MM-DD' : validateRate(v);
        if (problem) bad.push(`Row ${i + 2}: ${problem}`); else { const row = cleanRate(owner, v); row.source = 'CSV import ' + inp.files[0].name; row.rateId = repo.get('Rate', rateIdFor(row)) || good.some(x => x.rateId === rateIdFor(row)) ? util.uid('R') : rateIdFor(row); good.push(row); }
      });
      ui.openDialog({
        title: 'Import rates from CSV', wide: true,
        bodyHtml: `${bad.length ? ui.callout('bad', `<b>${bad.length} row(s) have problems and will be skipped:</b><ul>${bad.slice(0, 10).map(b => `<li>${esc(b)}</li>`).join('')}</ul>`) : ''}${good.length ? ui.callout('info', `<b>${good.length} rate row(s)</b> will be added as new rows (nothing existing is changed).`) + table({ rows: good.slice(0, 15), cols: [{ label: 'Tariff', render: r => esc(r.tariffCode) }, { label: 'Component', render: r => esc(r.componentCode) }, { label: 'Band', render: r => esc(r.bandCode) }, { label: 'Value', th: 'num', cls: 'num', render: r => f3(r.value) }, { label: 'From', render: r => r.effectiveFrom }, { label: 'To', render: r => r.effectiveTo || 'open' }] }) + (good.length > 15 ? `<p class="small muted">…and ${good.length - 15} more</p>` : '') : empty('Nothing to import')}`,
        footerHtml: `<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary"${good.length ? '' : ' disabled'}>Add ${good.length} rate(s)</button>`,
        onSubmit: () => { repo.insertMany('Rate', good); toast(`${good.length} rate rows imported.`); ui.refresh(); },
      });
    });
    inp.click();
  });

  // ============================== tariff overview ====================================================================
  function bandStrips(tariffCode, asAt) {
    const rows = repo.list('TimeBand', b => b.tariffCode === tariffCode && (!b.effectiveFrom || b.effectiveFrom <= asAt) && (!b.effectiveTo || b.effectiveTo >= asAt));
    if (!rows.length) return '';
    const res = engine.makeBandResolver(rows), codes = [];
    for (const b of rows.slice().sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0))) if (!codes.includes(b.bandCode)) codes.push(b.bandCode);
    const col = c => BAND_COLORS[codes.indexOf(c) % BAND_COLORS.length], label = c => (rows.find(r => r.bandCode === c) || {}).label || c;
    const types = [['Mon–Fri', 2, false], ['Saturday', 6, false], ['Sunday', 0, false], ['Public holiday', 2, true]];
    const strip = (dow, hol) => {
      const t = res.table(dow, hol);
      let out = '', start = 0;
      for (let m = 1; m <= 1440; m++) if (m === 1440 || t[m] !== t[start]) { out += `<i style="width:${((m - start) / 1440) * 100}%;background:${t[start] ? col(t[start]) : 'repeating-linear-gradient(45deg,var(--bad) 0 4px,transparent 4px 8px)'}" title="${esc((t[start] ? label(t[start]) : 'NOT COVERED') + ' ' + util.minToHHMM(start) + '–' + util.minToHHMM(m))}"></i>`; start = m; }
      return out;
    };
    return `<div style="display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center;font-size:12px">${types.map(([n, d, h]) => `<span class="muted">${n}</span><div class="stripe">${strip(d, h)}</div>`).join('')}<span></span><div class="small muted" style="display:flex;justify-content:space-between"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></div><div class="legend">${codes.map(c => `<span><i style="background:${col(c)}"></i>${esc(label(c))}</span>`).join('')}</div>`;
  }
  function tariffCard(t, asAt) {
    const book = svc.loadBook(), comps = book.components.filter(c => c.tariffCode === t.tariffCode).sort((a, b) => a.sortOrder - b.sortOrder);
    const rb = engine.makeRateBook(book.rates, { ownerCode: 'WP', tariffCode: t.tariffCode });
    const rate = (c, b = '') => { const p = rb.pick(c, b, asAt); return p ? `<b>${f3(p.row.value)}</b> <span class="small muted">${esc(p.row.unit)}</span>` : '<span class="small" style="color:var(--bad)">no rate effective</span>'; };

          body += `<tr><td>Discount (DF)</td><td>off-peak share × DF below ${fmtNum(rb.param('TAPER_START', asAt))} kVA, tapering to zero at ${fmtNum(rb.param('TAPER_END', asAt))} kVA</td><td><b>${f3(rb.param('DF', asAt))}</b></td></tr>`;

  // ============================== RT6 checks ===============================================================================
  /** Visible test: the charge just below and just above 300 kVA (and the other band boundaries), computed live from the Rate rows. */
  function rt6BoundaryHtml(asAt) {
    const book = svc.loadBook(), rb = engine.makeRateBook(book.rates, { ownerCode: 'WP', tariffCode: 'RT6' }), bands = rb.demandBands(asAt);
    if (bands.length < 2) return callout('warn', `No RT6 demand bands are effective on ${fmtDate(asAt)}.`);
    const P = { DF: rb.param('DF', asAt) ?? 0.3, taperStart: rb.param('TAPER_START', asAt) ?? 1000, taperEnd: rb.param('TAPER_END', asAt) ?? 1500 };
    const edge = bands.slice(1).map(b => b.lower);
    const pts = [];
    for (const e of edge) pts.push(e - 0.01, e - 0.001, e, e + 0.001, e + 0.01);
    pts.push(bands[bands.length - 1].upper - 0.001, bands[bands.length - 1].upper);
    const calc = pts.map(md => ({ md, ...engine.rt6Daily(md, 0, bands, P) }));
    const first = edge[0], below = engine.rt6Daily(first - 0.001, 0, bands, P), at = engine.rt6Daily(first, 0, bands, P), step = at.amount - below.amount;
    const analysis = bands.slice(1).map((b, i) => { const prev = bands[i], cum = prev.fixed + prev.rate * (b.lower - prev.lower); return { b, prev, cum, gap: cum - b.fixed }; });
    return callout(Math.abs(step) < 1 ? 'good' : 'warn',
      `<b>Just below ${fmtNum(first)} kVA the daily charge is ${f3(below.amount)} c/day (${ui.money(below.amount)}); at ${fmtNum(first)} kVA it is ${f3(at.amount)} c/day (${ui.money(at.amount)}).</b> ` +
      (Math.abs(step) < 1 ? 'The table is continuous at this boundary.' : `The published table steps <b>${step < 0 ? 'down' : 'up'} by ${f3(Math.abs(step))} c/day</b> (${ui.money(Math.abs(step))}/day, about ${ui.money(Math.abs(step) * 365)}/year) as MD crosses ${fmtNum(first)} kVA, so a customer just over the threshold pays <i>less</i> than one just under it. ` +
        `The band fixed amounts are implemented <b>exactly as published</b>. Confirm the method against Western Power's calculator spreadsheet before relying on it near ${fmtNum(first)} kVA.`)) +
      `<p class="small muted">All charges below are the <b>daily charge before the off-peak discount</b>, for rates effective ${fmtDate(asAt)}: fixed for the band holding MD + band rate × (MD − band lower threshold).</p>` +
      table({
        rows: calc, rowClass: r => (edge.includes(r.md) ? 'group' : ''),
        cols: [
          { label: 'MD (kVA)', th: 'num', cls: 'num', render: r => fmtNum(r.md, 3) }, { label: 'Band', render: r => `${fmtNum(r.band.lower)}–${Number.isFinite(r.band.upper) ? fmtNum(r.band.upper) : '∞'}${r.extrapolated ? ' (extended)' : ''}` },
          { label: 'Fixed (c/day)', th: 'num', cls: 'num', render: r => f3(r.fixed) }, { label: 'Rate × (MD − lower)', th: 'num', cls: 'num', render: r => f3(r.variable) },
          { label: 'Daily charge (c/day)', th: 'num', cls: 'num', render: r => `<b>${f3(r.amount)}</b>` }, { label: 'Daily charge ($)', th: 'num', cls: 'num', render: r => fmtNum(r.amount / 100, 4) },
        ],
      }) +
      `<h4 style="margin:14px 0 6px">Why the table steps: continuity check at each band boundary</h4>` +
      table({
        rows: analysis,
        cols: [
          { label: 'Boundary', render: a => `${fmtNum(a.b.lower)} kVA` }, { label: 'Fixed published for the next band', th: 'num', cls: 'num', render: a => f3(a.b.fixed) },
          { label: 'Fixed that would make it continuous', th: 'num', cls: 'num', render: a => f3(a.cum) }, { label: 'Difference', th: 'num', cls: 'num', render: a => (Math.abs(a.gap) < 0.001 ? badge('continuous', 'good', 'check') : badge(`${f3(a.gap)} c/day`, 'warn')) },
          { label: 'Reading', render: a => (Math.abs(a.gap) < 0.001 ? 'No step: the published fixed amount already includes the lower band charge.' : `The published fixed amount equals ${f3(a.prev.rate)} × ${fmtNum(a.b.lower - a.prev.lower)} kVA only; the lower band's own fixed ${f3(a.prev.fixed)} c/day is not carried forward.`) },
        ],
      });
  }
  ui.rt6BoundaryHtml = rt6BoundaryHtml;

  function rt6Tab(q) {

    return `<form class="toolbar" data-submit="tariff-rt6-asat"><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px">Rates effective on <input class="in" style="width:auto" type="date" name="asat" value="${asAt}"></label><button class="btn sm" type="submit">Apply</button></form>` +

        <div class="form-grid" id="rt6calc" data-asat="${asAt}"><label class="field">MD (kVA)<input class="in" type="number" step="any" value="412.5" data-input="rt6-calc" id="c-md"></label><label class="field">Off-peak share of kWh in the billing period (%)<input class="in" type="number" step="any" value="78" data-input="rt6-calc" id="c-share"></label><label class="field">Days in the billing period<input class="in" type="number" value="30" data-input="rt6-calc" id="c-days"></label><label class="field">Metering add-on (c/day, optional)<input class="in" type="number" step="any" value="0" data-input="rt6-calc" id="c-meter"></label></div><div id="rt6-out" style="margin-top:12px"></div>`,
      }) +
      card({
        title: 'Method assumptions to confirm', body: `<ul style="margin:0;padding-left:18px;display:grid;gap:4px"><li><b>MD</b> is the highest half-hourly kVA in the rolling 12 months ending on each billing day (365-day window, today inclusive), calculated daily. A "period end" mode (one MD for the whole period) is available under Data &amp; settings to compare against Western Power's calculator.</li>
        <li><b>kVA</b> per half hour = √(kW² + kvar²), with kW = kWh ÷ (IntervalLength ÷ 60) and kvar likewise from kvarh (E and Q/K datastreams). Shorter intervals are summed to the half hour first. With no Q/K datastream the site's assumed power factor (default 0.9) is used and a warning is shown.</li>
        <li><b>Off-peak share</b> = off-peak kWh ÷ total consumption kWh in the billing period, where on-peak is Mon–Fri excluding public holidays, 15:00–21:00 (by interval start time).</li>
        <li><b>Discount</b>: MD &lt; 1,000: share × DF · 1,000 ≤ MD &lt; 1,500: ((1,500 − MD) ÷ 500) × share × DF · MD ≥ 1,500: none. DF = 0.30.</li>
        <li><b>Demand-length charge</b> (MD &gt; 1,000 kVA) is out of scope: a "not calculated" notice is shown wherever it would apply.</li></ul>`,
      });
  }

      ['Band', `${fmtNum(r.band.lower)}–${Number.isFinite(r.band.upper) ? fmtNum(r.band.upper) : '∞'} kVA${r.extrapolated ? ' (top band extended)' : ''}`], ['Fixed for band', f3(r.fixed) + ' c/day'], [`Rate × (MD − ${fmtNum(r.band.lower)}) = ${f3(r.band.rate)} × ${fmtNum(md - r.band.lower, 3)}`, f3(r.variable) + ' c/day'],
