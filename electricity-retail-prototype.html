  // ============================== public holidays ===================================================================================
  function holidaysScreen(q) {
    const all = repo.list('PublicHoliday').sort((a, b) => a.date.localeCompare(b.date));
    const years = Array.from(new Set(all.map(h => h.date.slice(0, 4)))).sort();
    const year = q.year || (years.includes(svc.today().slice(0, 4)) ? svc.today().slice(0, 4) : 'all');
    const rows = year === 'all' ? all : all.filter(h => h.date.startsWith(year));
    const streams = repo.intervalStreams(), dataYears = new Set();
    streams.forEach(s => { for (let y = +s.firstDate.slice(0, 4); y <= +s.lastDate.slice(0, 4); y++) dataYears.add(String(y)); });
    for (const r of repo.list('Rate')) { if (r.ownerCode === 'WP') { for (let y = +r.effectiveFrom.slice(0, 4); y <= +(r.effectiveTo || r.effectiveFrom).slice(0, 4); y++) dataYears.add(String(y)); } }
    const missing = Array.from(dataYears).filter(y => !years.includes(y)).sort();
    const inp = (h, field, type, w = '') => `<input class="in cell" style="${w}" type="${type}" value="${esc(h[field] || '')}" data-change="hol-edit" data-id="${esc(h.holidayId)}" data-field="${field}">`;
    return pageHead({ title: 'Public holidays (WA)', sub: 'Used by RT6 time bands (a public holiday is off-peak all day) and the demand-discount off-peak share. RT34 bands apply every day regardless.', actions: btn('Add holiday', 'hol-add', { ic: 'plus', kind: 'primary' }) + btn('Restore seeded WA holidays', 'restore-seed', { ic: 'refresh', title: 'Re-adds any seeded holiday that has been deleted' }) }) +
      callout('info', '<b>Verify before relying on these dates.</b> The seed covers 2025–2027 from the WA public holiday calendar, including the additional weekday when a holiday falls on a weekend. Some dates (King\'s Birthday, substitute days) are proclaimed by the WA Government: confirm against the official Department of Mines, Industry Regulation and Safety list and edit here.') +
      (missing.length ? callout('warn', `No holidays are loaded for <b>${missing.join(', ')}</b>, which your data or rates cover. RT6 bills for those years would treat every weekday as normal.`) : '') +
      `<div class="toolbar"><div class="chips">${['all', ...years].map(y => `<a class="chip${y === year ? ' active' : ''}" href="#/holidays?year=${y}">${y === 'all' ? 'All years' : y}</a>`).join('')}</div><span class="spacer"></span><span class="muted small">${rows.length} holiday(s) shown · ${all.length} stored</span></div>` +
      card({
        flush: true, body: table({
          rows, emptyHtml: empty('No holidays for this year', 'Add them, or restore the seeded WA holidays.'),
          cols: [
            { label: 'Date', render: h => inp(h, 'date', 'date') }, { label: 'Day', render: h => util.DOW[util.dow(h.date)] + (util.dow(h.date) === 0 || util.dow(h.date) === 6 ? ' <span class="small muted">(weekend)</span>' : '') },
            { label: 'Holiday', render: h => inp(h, 'name', 'text', 'min-width:240px') }, { label: 'State', render: h => inp(h, 'state', 'text', 'width:70px') }, { label: 'Note', render: h => inp(h, 'note', 'text', 'min-width:220px') },
            { label: '', render: h => btn('', 'hol-del', { ic: 'trash', kind: 'sm ghost', data: { id: h.holidayId }, title: 'Delete' }) },
          ],
        }),
      });
  }
  ui.act('hol-edit', el => {
    const { id, field } = el.dataset, v = el.value.trim();
    if (field === 'date') {
      if (!util.isIsoDate(v)) { el.classList.add('invalid'); return toast('Enter a valid date.', 'bad'); }
      if (repo.list('PublicHoliday', h => h.date === v && h.holidayId !== id).length) { el.classList.add('invalid'); return toast('That date is already a public holiday.', 'bad'); }
    }
    if (field === 'name' && !v) { el.classList.add('invalid'); return toast('A holiday needs a name.', 'bad'); }
    repo.update('PublicHoliday', id, { [field]: v }); toast('Holiday saved.'); ui.refresh();
  });
  ui.act('hol-del', async el => {
    const h = repo.get('PublicHoliday', el.dataset.id);
    if (!(await ui.confirmDialog({ title: 'Delete holiday?', message: `${esc(h.name)} on ${fmtDate(h.date)}. RT6 bills will treat that day as a normal day.`, confirmLabel: 'Delete', danger: true }))) return;
    repo.remove('PublicHoliday', h.holidayId); ui.refresh();
  });
  ui.act('hol-add', () => ui.formDialog({
    title: 'Add public holiday', fields: [{ name: 'date', label: 'Date', type: 'date', required: true }, { name: 'name', label: 'Holiday', required: true }, { name: 'state', label: 'State' }, { name: 'note', label: 'Note', full: true }], values: { state: 'WA' }, submitLabel: 'Add',
    onSubmit: v => { if (repo.list('PublicHoliday', h => h.date === v.date).length) return 'That date is already a public holiday.'; repo.insert('PublicHoliday', { holidayId: 'PH-' + v.date.replace(/-/g, ''), ...v }); },
  }));
  ui.register('holidays', { title: 'Public holidays', nav: 'holidays', render: (args, q) => holidaysScreen(q) });
})();
</script>
<script data-section="ui-customers">
/* ============================================================================
   SECTION 8c — ui screens: Customers (sites, NMIs, standing data) and Retail offers
   ============================================================================ */
(() => {
  'use strict';
  const { $, $$, card, btn, badge, statusBadge, callout, kpi, table, empty, pageHead, icon, toast } = ui;
  const { esc, fmtNum, fmtDate, fmtTs } = util;
  const f3 = n => fmtNum(n, 3);
  const today = () => svc.today();

  const meteringOptions = () => {
    const rates = repo.list('Rate', r => r.ownerCode === 'WP' && r.componentCode === 'METERING_ADDON');
    const codes = Array.from(new Set(rates.map(r => r.bandCode))).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const latest = c => rates.filter(r => r.bandCode === c).sort((a, b) => b.effectiveFrom.localeCompare(a.effectiveFrom))[0];
    return [{ value: 'NONE', label: 'None (tariff metering charge only)' }, ...codes.map(c => ({ value: c, label: `${c}: ${f3(latest(c).value)} c/meter/day` })), { value: 'OTHER', label: 'Other (manual entry, c/meter/day)' }];
  };
  const meteringLabel = s => (!s.meteringService || s.meteringService === 'NONE' ? 'None' : s.meteringService === 'OTHER' ? `Other (${f3(s.meteringOtherCents || 0)} c/day)` : s.meteringService);

  // ============================== customers list ===============================================================
  function unassignedNmis() { return repo.list('Nmi', n => !n.siteId); }
  function customersScreen() {
    const customers = repo.list('Customer').sort((a, b) => a.name.localeCompare(b.name));
    const sites = repo.list('Site'), nmis = repo.list('Nmi');
    const un = unassignedNmis();
    return pageHead({ title: 'Customers', sub: 'Customers, their sites, and the NMIs (connection points) that carry the interval data.', actions: btn('Add customer', 'cust-add', { ic: 'plus', kind: 'primary' }) }) +
      (un.length ? card({
        title: `Unassigned NMIs (${un.length})`, flush: true,
        body: table({ rows: un, cols: [{ label: 'NMI', render: n => `<b class="mono">${esc(n.nmi)}</b>` }, { label: 'Found in', render: n => (n.discoveredFromFileId ? `<a href="#/meter-data/file/${esc(n.discoveredFromFileId)}">uploaded file</a>` : 'added manually') }, { label: 'Data', render: n => { const c = svc.dataCoverage(n.nmi); return c ? `${fmtDate(c.first)} – ${fmtDate(c.last)}` : '<span class="muted">no data</span>'; } }, { label: '', render: n => btn('Assign to a site…', 'nmi-assign', { kind: 'primary sm', data: { nmi: n.nmi } }) }] }),
        footer: 'NMIs discovered in uploaded NEM12 files must be assigned to a customer site (and given a network tariff) before they can be quoted or billed.',
      }) : '') +
      `<div class="kpis">${kpi('Customers', fmtNum(customers.length))}${kpi('Sites', fmtNum(sites.length))}${kpi('NMIs', fmtNum(nmis.length), `${un.length} unassigned`)}</div>` +
      card({
        flush: true, body: table({
          rows: customers, go: c => `#/customers/${c.customerId}`, emptyHtml: empty('No customers yet', 'Add a customer, or load the demo set-up from the Dashboard.'),
          cols: [
            { label: 'Customer', render: c => `<b>${esc(c.name)}</b>` }, { label: 'ABN', render: c => esc(c.abn || '') }, { label: 'Contact', render: c => esc([c.contactName, c.contactEmail].filter(Boolean).join(' · ')) },
            { label: 'Sites', th: 'num', cls: 'num', render: c => sites.filter(s => s.customerId === c.customerId).length },
            { label: 'NMIs', render: c => esc(nmis.filter(n => n.siteId && sites.some(s => s.siteId === n.siteId && s.customerId === c.customerId)).map(n => n.nmi).join(', ')) },
            { label: 'Status', render: c => statusBadge(c.status || 'Active') },
          ],
        }),
      });
  }
  const customerFields = [
    { name: 'name', label: 'Customer name', required: true, full: true }, { name: 'abn', label: 'ABN' }, { name: 'status', label: 'Status', type: 'select', options: ['Active', 'Prospect', 'Inactive'] },
    { name: 'contactName', label: 'Contact name' }, { name: 'contactEmail', label: 'Contact email', type: 'email' }, { name: 'contactPhone', label: 'Contact phone' }, { name: 'paymentTermsDays', label: 'Payment terms (days)', type: 'number', min: 0, step: 1 },
    { name: 'billingAddress', label: 'Billing address', full: true }, { name: 'notes', label: 'Notes', type: 'textarea', full: true },
  ];
  ui.act('cust-add', () => ui.formDialog({
    title: 'Add customer', fields: customerFields, values: { status: 'Prospect', paymentTermsDays: 14 }, submitLabel: 'Add customer',
    onSubmit: v => { const c = repo.insert('Customer', v); toast('Customer added.'); setTimeout(() => ui.go(`#/customers/${c.customerId}`), 0); },
  }));

  // ============================== customer detail ==============================================================
  const siteFields = () => [
    { name: 'name', label: 'Site name', required: true }, { name: 'address', label: 'Site address' },
    { name: 'meteringService', label: 'Metering reference service (add-on)', type: 'select', options: meteringOptions(), help: 'Total metering charge = tariff metering charge + this add-on' },
    { name: 'meteringOtherCents', label: 'Other: c/meter/day', type: 'number', step: 'any', min: 0, help: 'Used only when "Other" is selected' },
    { name: 'assumedPf', label: 'Assumed power factor', type: 'number', step: '0.01', min: 0.5, max: 1, required: true, help: 'Used for kVA when there is no Q/K datastream (default 0.9)' },
    { name: 'retailOfferId', label: 'Retail offer', type: 'select', options: [{ value: '', label: '(none)' }, ...repo.list('RetailOffer').map(o => ({ value: o.offerId, label: `${o.name} (${o.status})` }))] },
    { name: 'contractStart', label: 'Contract start', type: 'date' }, { name: 'contractEnd', label: 'Contract end', type: 'date' }, { name: 'notes', label: 'Notes', type: 'textarea', full: true },
  ];
  const siteClean = v => ({ ...v, meteringOtherCents: v.meteringService === 'OTHER' ? v.meteringOtherCents : null, retailOfferId: v.retailOfferId || null, contractStart: v.contractStart || null, contractEnd: v.contractEnd || null });
  function nmiRow(n) {
    const cov = svc.dataCoverage(n.nmi), snap = svc.standing(n.nmi), tariff = snap && snap.networkTariffCode ? repo.get('NetworkTariff', snap.networkTariffCode) : null;
    const streams = repo.intervalStreams().filter(s => s.nmi === n.nmi), e = streams.find(s => nem12.kindOfSuffix(s.suffix) === 'consumption');
    return `<tr><td><b class="mono">${esc(n.nmi)}</b>${n.label ? `<div class="small muted">${esc(n.label)}</div>` : ''}</td>
      <td>${tariff ? `<b>${esc(tariff.tariffCode)}</b> <span class="small muted">${esc(tariff.name)}</span>${tariff.status === 'closed' ? ' ' + badge('closed', 'bad') : ''}` : badge('No tariff set', 'warn', 'warn')}</td>
      <td>${cov ? `${fmtDate(cov.first)} – ${fmtDate(cov.last)}<div class="small muted">${streams.map(s => s.suffix).join(' · ')}</div>` : '<span class="muted">no interval data</span>'}</td>
      <td>${e ? ui.qualityMix(e.quality) : ''}</td>
      <td class="nowrap">${btn('Standing data', 'nmi-standing', { kind: 'sm', data: { nmi: n.nmi } })} ${e ? `<a class="btn sm" href="#/meter-data/stream/${esc(n.nmi)}/${esc(e.suffix)}">Explore</a>` : ''} ${btn('', 'nmi-unassign', { kind: 'sm ghost', ic: 'x', data: { nmi: n.nmi }, title: 'Remove this NMI from the site' })}</td></tr>`;
  }
  function customerScreen(id) {
    const c = repo.get('Customer', id);
    if (!c) return pageHead({ title: 'Customer not found' }) + ui.link('Back to customers', '#/customers');
    const sites = repo.list('Site', { customerId: id }), allNmis = repo.list('Nmi'), quotes = repo.list('Quote', { customerId: id }), invoices = repo.list('Invoice', { customerId: id });
    return `<div class="crumbs no-print"><a href="#/customers">Customers</a> › ${esc(c.name)}</div>` +
      pageHead({ title: `${esc(c.name)} ${statusBadge(c.status || 'Active')}`, sub: [c.abn && 'ABN ' + esc(c.abn), c.contactName && esc(c.contactName), c.contactEmail && esc(c.contactEmail), c.contactPhone && esc(c.contactPhone)].filter(Boolean).join(' · '),
        actions: btn('Edit', 'cust-edit', { ic: 'edit', data: { id } }) + ui.link('New quote', `#/quotes/new?customer=${encodeURIComponent(id)}`, { kind: 'btn primary', ic: 'quotes' }) + ui.link('Billing', '#/billing', { kind: 'btn', ic: 'billing' }) + (sites.length ? '' : btn('Delete', 'cust-del', { kind: 'danger', ic: 'trash', data: { id } })) }) +
      (c.billingAddress || c.notes ? card({ body: `${c.billingAddress ? `<p><b>Billing address:</b> ${esc(c.billingAddress)}</p>` : ''}${c.notes ? `<p class="muted">${esc(c.notes)}</p>` : ''}<p class="small muted">Payment terms: ${esc(c.paymentTermsDays == null ? 14 : c.paymentTermsDays)} days</p>` }) : '') +
      `<div class="toolbar"><h2 style="font-size:16px">Sites (${sites.length})</h2><span class="spacer"></span>${btn('Add site', 'site-add', { ic: 'plus', kind: 'primary sm', data: { customer: id } })}</div>` +
      (sites.length ? sites.map(s => {
        const nmis = allNmis.filter(n => n.siteId === s.siteId), offer = s.retailOfferId ? repo.get('RetailOffer', s.retailOfferId) : null;
        return card({
          title: `${esc(s.name)} <span class="small muted" style="font-weight:400">${esc(s.address || '')}</span>`,
          actions: btn('Edit site', 'site-edit', { kind: 'sm', ic: 'edit', data: { id: s.siteId } }) + btn('Add NMI', 'site-add-nmi', { kind: 'sm', ic: 'plus', data: { site: s.siteId } }) + (nmis.length ? '' : btn('', 'site-del', { kind: 'sm ghost', ic: 'trash', data: { id: s.siteId }, title: 'Delete site' })),
          body: `<div class="grid c4" style="margin-bottom:12px"><div><div class="small muted">Metering service</div><b>${esc(meteringLabel(s))}</b></div><div><div class="small muted">Assumed power factor</div><b>${esc(s.assumedPf)}</b></div><div><div class="small muted">Retail offer</div>${offer ? `<a href="#/offers/${esc(offer.offerId)}"><b>${esc(offer.name)}</b></a>` : badge('none assigned', 'warn')}</div><div><div class="small muted">Contract</div><b>${s.contractStart || s.contractEnd ? `${s.contractStart ? fmtDate(s.contractStart) : 'open'} → ${s.contractEnd ? fmtDate(s.contractEnd) : 'open'}` : 'Not set'}</b></div></div>` +
            (nmis.length ? `<div class="table-wrap tall"><table class="data"><thead><tr><th>NMI</th><th>Network tariff</th><th>Interval data</th><th>Quality</th><th></th></tr></thead><tbody>${nmis.map(nmiRow).join('')}</tbody></table></div>` : empty('No NMI on this site', 'Add an NMI to price this site.')),
        });
      }).join('') : card({ body: empty('No sites yet', 'Add a site, then attach its NMI(s).') })) +
      (quotes.length || invoices.length ? card({ title: 'Quotes and invoices', flush: true, body: table({ rows: [...quotes.map(q => ({ t: 'Quote', n: q.quoteNumber, s: q.status, d: q.createdAt, v: q.totals ? q.totals.totalCents : null, h: `#/quotes/${q.quoteId}` })), ...invoices.map(i => ({ t: 'Invoice', n: i.invoiceNumber || 'Draft invoice', s: i.status, d: i.createdAt, v: i.totalCents, h: `#/billing/invoice/${i.invoiceId}` }))].sort((a, b) => b.d.localeCompare(a.d)), go: r => r.h, cols: [{ label: 'Type', render: r => r.t }, { label: 'Number', render: r => `<b>${esc(r.n)}</b>` }, { label: 'Status', render: r => statusBadge(r.s) }, { label: 'Created', render: r => fmtTs(r.d) }, { label: 'Total inc GST', th: 'num', cls: 'num', render: r => (r.v == null ? '–' : ui.money(r.v)) }] }) }) : '');
  }
  ui.act('cust-edit', el => { const c = repo.get('Customer', el.dataset.id); ui.formDialog({ title: 'Edit customer', fields: customerFields, values: c, submitLabel: 'Save', onSubmit: v => { repo.update('Customer', c.customerId, v); toast('Customer saved.'); } }); });
  ui.act('cust-del', async el => { if (!(await ui.confirmDialog({ title: 'Delete customer?', message: 'This customer has no sites. Quotes and invoices keep their own copy of the customer name.', confirmLabel: 'Delete', danger: true }))) return; repo.remove('Customer', el.dataset.id); ui.go('#/customers'); });
  ui.act('site-add', el => ui.formDialog({
    title: 'Add site', wide: true, fields: siteFields(), values: { meteringService: 'NONE', assumedPf: 0.9, retailOfferId: (repo.list('RetailOffer', o => o.status === 'Active')[0] || {}).offerId || '' }, submitLabel: 'Add site',
    onSubmit: v => { if (v.meteringService === 'OTHER' && !(v.meteringOtherCents >= 0 && v.meteringOtherCents !== null)) return 'Enter the manual metering charge in c/meter/day.'; repo.insert('Site', { customerId: el.dataset.customer, ...siteClean(v) }); toast('Site added.'); },
  }));
  ui.act('site-edit', el => { const s = repo.get('Site', el.dataset.id); ui.formDialog({ title: 'Edit site', wide: true, fields: siteFields(), values: { ...s, retailOfferId: s.retailOfferId || '' }, submitLabel: 'Save', onSubmit: v => { if (v.meteringService === 'OTHER' && v.meteringOtherCents == null) return 'Enter the manual metering charge in c/meter/day.'; repo.update('Site', s.siteId, siteClean(v)); toast('Site saved.'); } }); });
  ui.act('site-del', async el => { if (!(await ui.confirmDialog({ title: 'Delete site?', message: 'The site has no NMIs.', confirmLabel: 'Delete', danger: true }))) return; repo.remove('Site', el.dataset.id); ui.refresh(); });

  const tariffOptions = (currentCode, { allowNone = false } = {}) => [
    ...(allowNone ? [{ value: '', label: '(not set)' }] : []),
    ...repo.list('NetworkTariff').sort((a, b) => (a.status === b.status ? a.tariffCode.localeCompare(b.tariffCode, undefined, { numeric: true }) : a.status === 'open' ? -1 : 1))
      .map(t => ({ value: t.tariffCode, label: `${t.tariffCode}: ${t.name}${t.status === 'closed' ? ' (closed, grandfathered)' : ''}`, disabled: t.status === 'closed' && t.tariffCode !== currentCode })),
  ];
  ui.act('site-add-nmi', el => {
    const site = el.dataset.site, un = unassignedNmis();
    ui.formDialog({
      title: 'Add NMI to site', submitLabel: 'Add NMI',
      fields: [{ name: 'pick', label: 'NMI', type: 'select', options: [...un.map(n => ({ value: n.nmi, label: `${n.nmi} (found in an uploaded file)` })), { value: '__new', label: 'Enter a different NMI…' }] }, { name: 'nmiNew', label: 'NMI (10 characters)', placeholder: '8001234567', pattern: '[A-Za-z0-9]{10}', help: 'Only needed when "Enter a different NMI" is chosen' }, { name: 'tariff', label: 'Network tariff', type: 'select', options: tariffOptions('', { allowNone: true }) }, { name: 'label', label: 'Label', full: true }],
      values: { pick: un.length ? un[0].nmi : '__new' },
      onSubmit: v => {
        const nmi = (v.pick === '__new' ? v.nmiNew : v.pick).toUpperCase();
        if (!/^[A-Z0-9]{10}$/.test(nmi)) return 'An NMI is 10 letters/digits.';
        const ex = repo.get('Nmi', nmi);
        if (ex && ex.siteId && ex.siteId !== site) return 'That NMI is already assigned to another site.';
        repo.atomic(() => {
          if (ex) repo.update('Nmi', nmi, { siteId: site, status: 'Active', label: v.label || ex.label });
          else repo.insert('Nmi', { nmi, siteId: site, status: 'Active', label: v.label || '', discoveredFromFileId: null });
          if (v.tariff) svc.setStanding(nmi, { networkTariffCode: v.tariff, notes: 'Set when the NMI was added to the site' });
          for (const t of repo.list('Task', x => x.relatedType === 'Nmi' && x.relatedId === nmi && /^Assign NMI/.test(x.title) && x.status !== 'Done')) repo.update('Task', t.taskId, { status: 'Done', completedAt: new Date().toISOString() });
        });
        toast('NMI added.');
      },
    });
  });
  ui.act('nmi-assign', el => {
    const nmi = el.dataset.nmi, sites = repo.list('Site'), custs = svc.asMap(repo.list('Customer'), 'customerId');
    if (!sites.length) return toast('Create a customer and a site first, then assign the NMI to it.', 'bad');
    const snap = svc.standing(nmi);
    ui.formDialog({
      title: `Assign NMI ${nmi}`, submitLabel: 'Assign',
      fields: [{ name: 'site', label: 'Customer · site', type: 'select', required: true, options: sites.map(s => ({ value: s.siteId, label: `${custs.get(s.customerId).name} · ${s.name}` })) }, { name: 'tariff', label: 'Network tariff', type: 'select', required: true, options: tariffOptions(snap && snap.networkTariffCode), help: 'From the NMI standing data (MSATS-style). Closed tariffs cannot be newly assigned.' }],
      values: { tariff: snap && snap.networkTariffCode ? snap.networkTariffCode : 'RT2' },
      onSubmit: v => {
        repo.atomic(() => {
          repo.update('Nmi', nmi, { siteId: v.site, status: 'Active' });
          if (!snap || snap.networkTariffCode !== v.tariff) svc.setStanding(nmi, { networkTariffCode: v.tariff, notes: 'Set when the NMI was assigned to a site' });
          for (const t of repo.list('Task', x => x.relatedType === 'Nmi' && x.relatedId === nmi && /^Assign NMI/.test(x.title) && x.status !== 'Done')) repo.update('Task', t.taskId, { status: 'Done', completedAt: new Date().toISOString() });
        });
        toast(`NMI ${nmi} assigned.`);
      },
    });
  });
  ui.act('nmi-unassign', async el => { if (!(await ui.confirmDialog({ title: 'Remove NMI from site?', message: `NMI ${esc(el.dataset.nmi)} and its interval data are kept; it simply becomes unassigned.`, confirmLabel: 'Remove' }))) return; repo.update('Nmi', el.dataset.nmi, { siteId: null, status: 'Discovered' }); ui.refresh(); });
  ui.act('nmi-standing', el => {
    const nmi = el.dataset.nmi, snaps = svc.snapshots(nmi).slice().reverse(), cur = svc.standing(nmi);
    ui.openDialog({
      title: `Standing data: NMI ${nmi}`, wide: true,
      bodyHtml: `<p class="small muted">Standing data is an append-only history: a change inserts a new snapshot with an effective date; earlier snapshots are never edited. Bills use the snapshot effective at the end of the billing period.</p>
        ${cur ? `<p><b>Current:</b> network tariff <b>${esc(cur.networkTariffCode || 'not set')}</b>${cur.nmiConfiguration ? ` · NMI configuration <span class="mono">${esc(cur.nmiConfiguration)}</span>` : ''}</p>` : '<p>No standing data yet.</p>'}
        <div class="form-grid" style="margin:12px 0">${ [{ name: 'tariff', label: 'Change network tariff to', type: 'select', options: tariffOptions(cur && cur.networkTariffCode) }, { name: 'effectiveFrom', label: 'Effective from', type: 'date', required: true }, { name: 'notes', label: 'Notes', full: true }].map((f, i) => `<label class="field ${f.full ? 'full' : ''}"><span>${esc(f.label)}</span>${f.type === 'select' ? `<select name="${f.name}">${f.options.map(o => `<option value="${esc(o.value)}"${o.disabled ? ' disabled' : ''}${cur && cur.networkTariffCode === o.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>` : `<input name="${f.name}" type="${f.type || 'text'}" value="${f.name === 'effectiveFrom' ? today() : ''}"${f.required ? ' required' : ''}>`}</label>`).join('')}</div>
        <h4 style="margin:8px 0">History</h4>${table({ rows: snaps, cols: [{ label: 'Effective from', render: s => fmtDate(s.effectiveFrom) }, { label: 'Network tariff', render: s => esc(s.networkTariffCode || '–') }, { label: 'Datastreams', render: s => esc((s.streams || []).map(x => `${x.suffix} (${x.uom}, ${x.intervalLength} min)`).join(', ') || '–') }, { label: 'Source', render: s => esc(s.source) + (s.sourceFileId ? ` <a href="#/meter-data/file/${esc(s.sourceFileId)}">file</a>` : '') }, { label: 'Recorded', render: s => fmtTs(s.capturedAt) }, { label: 'Notes', render: s => esc(s.notes || '') }] })}`,
      footerHtml: '<button type="button" class="btn" data-close>Close</button><button type="submit" class="btn primary">Record change</button>',
      onSubmit: form => {
        const tariff = form.elements.tariff.value, from = form.elements.effectiveFrom.value;
        if (!tariff) return 'Choose a tariff.';
        if (cur && cur.networkTariffCode === tariff) return 'That is already the current tariff.';
        svc.setStanding(nmi, { networkTariffCode: tariff, effectiveFrom: from, notes: form.elements.notes.value });
        toast('Standing data recorded.'); ui.refresh(); return undefined;
      },
    });
  });
  ui.register('customers', { title: args => (args[0] ? 'Customer' : 'Customers'), nav: 'customers', render: args => (args[0] ? customerScreen(args[0]) : customersScreen()) });

  // ============================== retail offers ================================================================
  const offerFields = [
    { name: 'name', label: 'Offer name', required: true, full: true }, { name: 'status', label: 'Status', type: 'select', options: ['Draft', 'Active', 'Retired'] }, { name: 'termMonths', label: 'Term (months)', type: 'number', min: 1, step: 1 },
    { name: 'validFrom', label: 'Valid from', type: 'date' }, { name: 'validTo', label: 'Valid to', type: 'date' }, { name: 'paymentTermsDays', label: 'Payment terms (days)', type: 'number', min: 0, step: 1 },
    { name: 'networkMarginPct', label: 'Margin on network charges (%)', type: 'number', step: 'any', min: 0, help: 'Adds a line = % of network + metering charges. Leave 0 to pass network charges through at cost.' },
    { name: 'description', label: 'Description', type: 'textarea', full: true }, { name: 'notes', label: 'Internal notes', type: 'textarea', full: true },
  ];
  function offersScreen() {
    const offers = repo.list('RetailOffer').sort((a, b) => a.name.localeCompare(b.name)), sites = repo.list('Site');
    return pageHead({ title: 'Retail offers', sub: 'Retail prices added on top of passed-through Western Power network charges. Offer prices are dated rate rows, like the tariff book.', actions: btn('New offer', 'offer-add', { ic: 'plus', kind: 'primary' }) }) +
      callout('info', 'An offer prices <b>retail energy</b> per time band for each network tariff you may quote (so the energy price can follow the load shape), plus a daily service fee and optional per-kWh charges. Network charges, metering and GST are added by the engine. The demo offer\'s prices are made up.') +
      card({
        flush: true, body: table({
          rows: offers, go: o => `#/offers/${o.offerId}`, emptyHtml: empty('No retail offers', 'Create an offer, or load the demo set-up from the Dashboard.'),
          cols: [
            { label: 'Offer', render: o => `<b>${esc(o.name)}</b>` }, { label: 'Status', render: o => statusBadge(o.status) }, { label: 'Valid', render: o => `${o.validFrom ? fmtDate(o.validFrom) : '–'} → ${o.validTo ? fmtDate(o.validTo) : 'open'}` },
            { label: 'Term', th: 'num', cls: 'num', render: o => (o.termMonths || '–') + ' mo' }, { label: 'Rate rows', th: 'num', cls: 'num', render: o => repo.list('Rate', { ownerCode: o.offerId }).length },
            { label: 'Sites using', th: 'num', cls: 'num', render: o => sites.filter(s => s.retailOfferId === o.offerId).length },
            { label: '', render: o => btn('Clone', 'offer-clone', { kind: 'sm', ic: 'copy', data: { id: o.offerId } }) },
          ],
        }),
      });
  }
  function offerScreen(id, q) {
    const o = repo.get('RetailOffer', id);
    if (!o) return pageHead({ title: 'Offer not found' }) + ui.link('Back to offers', '#/offers');
    const tariffs = repo.list('NetworkTariff').map(t => t.tariffCode);
    const nmis = repo.list('Nmi', n => svc.dataCoverage(n.nmi));
    return `<div class="crumbs no-print"><a href="#/offers">Retail offers</a> › ${esc(o.name)}</div>` +
      pageHead({ title: `${esc(o.name)} ${statusBadge(o.status)}`, sub: esc(o.description || ''), actions: btn('Edit offer', 'offer-edit', { ic: 'edit', data: { id } }) + btn('Add standard rate rows', 'offer-scaffold', { ic: 'plus', data: { id }, title: 'Adds zero-priced retail energy rows for every band of every open tariff, ready to fill in' }) + btn('Delete', 'offer-del', { kind: 'danger', ic: 'trash', data: { id } }) }) +
      `<div class="kpis">${kpi('Valid', `${o.validFrom ? fmtDate(o.validFrom) : '–'} → ${o.validTo ? fmtDate(o.validTo) : 'open'}`)}${kpi('Term', (o.termMonths || '–') + ' months')}${kpi('Payment terms', (o.paymentTermsDays == null ? 14 : o.paymentTermsDays) + ' days')}${kpi('Margin on network charges', (o.networkMarginPct || 0) + '%')}</div>` +
      ui.rateGrid({ ownerCode: id, q, base: `#/offers/${encodeURIComponent(id)}`, title: 'Offer rates', tariffs: ['*', ...tariffs], components: ui.RATE_HELP.RETAIL_COMPONENTS }) +
      card({
        title: 'Test this offer on real interval data',
        body: nmis.length ? `<form class="toolbar" data-submit="offer-test" data-offer="${esc(id)}" style="margin:0 0 12px"><label class="field">NMI<select class="in" name="nmi">${nmis.map(n => `<option value="${esc(n.nmi)}">${esc(n.nmi)}${n.label ? ' · ' + esc(n.label) : ''}</option>`).join('')}</select></label>
          <label class="field">Month<input class="in" type="month" name="month" value="${esc((svc.lastBillablePeriod() || { from: today() }).from.slice(0, 7))}"></label>
          <label class="field">Network tariff<select class="in" name="tariff"><option value="">(the NMI's current tariff)</option>${repo.list('NetworkTariff', t => t.status === 'open').map(t => `<option>${esc(t.tariffCode)}</option>`).join('')}</select></label>
          <button class="btn primary" type="submit" style="align-self:end">Price it</button></form><div id="offer-test-out"><p class="small muted">Prices one calendar month with the same engine used for quotes and bills, at the rates effective today.</p></div>` : empty('No interval data to test with', 'Upload or generate NEM12 data first.'),
      });
  }
  ui.act('offer-test', form => {
    const f = new FormData(form), nmi = f.get('nmi'), month = f.get('month'), out = $('#offer-test-out');
    if (!month) return;
    const from = month + '-01', to = util.monthEnd(from);
    const ctx = svc.nmiContext(nmi, { offerId: form.dataset.offer, tariffCode: f.get('tariff') || undefined });
    const profile = svc.loadProfile(nmi, svc.leadInStart(from), to, { assumedPf: ctx.siteParams.assumedPf });
    const res = svc.priceWith({ book: svc.loadBook(), profile, ctx, period: { from, to }, options: { rateAsAt: svc.today(), rateFallback: 'latest' } });
    if (!res.lines.length) { out.innerHTML = ui.noticeList(res.notices); return; }
    out.innerHTML = ui.noticeList(res.notices, { showInfo: false }) + ui.pricingTable(engine.finalise(res, { gstRate: svc.gstRate() }), { period: true });
  });
  ui.act('offer-add', () => ui.formDialog({
    title: 'New retail offer', wide: true, fields: offerFields, values: { status: 'Draft', termMonths: 12, paymentTermsDays: 14, networkMarginPct: 0, validFrom: today() }, submitLabel: 'Create offer',
    onSubmit: v => { const o = repo.insert('RetailOffer', v); toast('Offer created: now add its rates.'); setTimeout(() => ui.go(`#/offers/${o.offerId}`), 0); },
  }));
  ui.act('offer-edit', el => { const o = repo.get('RetailOffer', el.dataset.id); ui.formDialog({ title: 'Edit offer', wide: true, fields: offerFields, values: o, submitLabel: 'Save', onSubmit: v => { repo.update('RetailOffer', o.offerId, v); toast('Offer saved.'); } }); });
  ui.act('offer-del', async el => {
    const used = repo.list('Site', { retailOfferId: el.dataset.id }).length;
    if (used) return toast(`${used} site(s) use this offer: change their offer first.`, 'bad');
    if (!(await ui.confirmDialog({ title: 'Delete offer and its rates?', message: 'Quotes already issued keep their own calculation.', confirmLabel: 'Delete', danger: true }))) return;
    repo.atomic(() => { for (const r of repo.list('Rate', { ownerCode: el.dataset.id })) repo.remove('Rate', r.rateId); repo.remove('RetailOffer', el.dataset.id); });
    ui.go('#/offers');
  });
  ui.act('offer-clone', el => {
    const o = repo.get('RetailOffer', el.dataset.id), id = util.uid('OF');
    repo.atomic(() => {
      const { offerId, createdAt, modifiedAt, ...rest } = o;
      repo.insert('RetailOffer', { ...rest, offerId: id, name: o.name + ' (copy)', status: 'Draft' });
      repo.insertMany('Rate', repo.list('Rate', { ownerCode: o.offerId }).map(({ rateId, createdAt: c, modifiedAt: m, ...r }) => ({ ...r, rateId: `${id}.${rateId.split('.').slice(1).join('.')}`, ownerCode: id })));
    });
    toast('Offer cloned.'); ui.go(`#/offers/${id}`);
  });
  ui.act('offer-scaffold', el => {
    const id = el.dataset.id, rows = [], mk = (tariffCode, componentCode, bandCode, unit, note = '') => ({ rateId: `${id}.${tariffCode === '*' ? 'ALL' : tariffCode}.${componentCode}.${bandCode || '-'}.${today()}`, ownerCode: id, tariffCode, componentCode, bandCode, lowerKva: null, upperKva: null, value: 0, unit, effectiveFrom: today(), effectiveTo: null, source: 'Scaffold', note });
    for (const t of repo.list('NetworkTariff', x => x.status === 'open')) {
      const bands = Array.from(new Set(repo.list('TimeBand', { tariffCode: t.tariffCode }).sort((a, b) => a.sortOrder - b.sortOrder).map(b => b.bandCode)));
      for (const b of bands) rows.push(mk(t.tariffCode, 'RET_ENERGY', b, 'c/kWh'));
    }
    rows.push(mk('*', 'RET_FIXED', '', 'c/day', 'Retail service fee'));
    const have = new Set(repo.list('Rate', { ownerCode: id }).map(r => r.rateId));
    const add = rows.filter(r => !have.has(r.rateId));
    if (!add.length) return toast('The standard rows already exist.');
    repo.insertMany('Rate', add); toast(`${add.length} zero-priced rows added: set their values.`); ui.refresh();
  });
  ui.register('offers', { title: args => (args[0] ? 'Retail offer' : 'Retail offers'), nav: 'offers', render: (args, q) => (args[0] ? offerScreen(args[0], q) : offersScreen()) });
})();
</script>
<script data-section="ui-quotes">
/* ============================================================================
   SECTION 8d — ui screens: Quotes (builder, results, printable document)
   A quote is twelve billing periods of the customer's own interval data priced by the SAME
   engine that prices invoices (svc.priceWith), at the rates effective on the quote start date.
   ============================================================================ */
(() => {
  'use strict';
  const { $, $$, card, btn, badge, statusBadge, callout, kpi, table, empty, pageHead, icon, toast, charts } = ui;
  const { esc, fmtNum, fmtDate, fmtTs, fmtPct } = util;
  const money = c => ui.money(c);
  const BAND_COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
  const GROUP_LABEL = { Network: 'Network charges (Western Power, passed through)', Metering: 'Metering charges', Retail: 'Retail charges' };
  const mmmYY = ym => `${util.MON[+ym.slice(5, 7) - 1]} ${ym.slice(2, 4)}`;
  const today = () => svc.today();

  /** Lines grouped Network / Metering / Retail with a subtotal, GST and total. fin = engine.finalise() output or a stored quote item. */
  function pricingTable(fin, { doc = false, period = false } = {}) {
    const lines = fin.lines, groups = ['Network', 'Metering', 'Retail'].map(g => [g, lines.filter(l => l.group === g)]).filter(([, ls]) => ls.length);
    const qty = l => (l.unit === 'kWh' ? fmtNum(l.quantity, 0) + ' kWh' : l.unit === 'days' ? fmtNum(l.quantity, l.quantity % 1 ? 1 : 0) + ' days' : fmtNum(l.quantity, 2));
    const rate = l => `${fmtNum(l.rate, 3)} ${esc(l.rateUnit || '')}${l.rateVaries ? ' (avg)' : ''}`;
    // the Period column only appears when the lines do not all share one period (e.g. a 1 July rate change splits a bill)
    period = period && lines.length > 1 && !lines.every(l => l.from === lines[0].from && l.to === lines[0].to);
    const span = period ? 5 : 4, g0 = doc ? 'grp' : 'group';
    const body = groups.map(([g, ls]) => `<tr class="${g0}"><td colspan="${span}">${GROUP_LABEL[g]}</td></tr>${ls.map(l => `<tr><td>${esc(l.description || l.label)}${l.detail ? `<div class="sub">${esc(l.detail)}</div>` : ''}</td>${period ? `<td class="nowrap">${fmtDate(l.from)} – ${fmtDate(l.to)}</td>` : ''}<td class="num">${qty(l)}</td><td class="num">${rate(l)}</td><td class="num">${money(l.amountExGstCents)}</td></tr>`).join('')}`).join('');
    const totals = [['Subtotal (ex GST)', fin.subtotalCents], [`GST (${fmtNum((fin.gstRate == null ? svc.gstRate() : fin.gstRate) * 100, 0)}%)`, fin.gstCents], ['Total (inc GST)', fin.totalCents]];
    const head = `<thead><tr><th>Charge</th>${period ? '<th>Period</th>' : ''}<th class="num">Quantity</th><th class="num">Rate</th><th class="num">Amount (ex GST)</th></tr></thead>`;
    if (doc) {
      return `<table class="doc">${head}<tbody>${body}</tbody></table><table class="doc totals avoid"><tbody>${totals.map((t, i) => `<tr class="${i === 2 ? 'grand' : ''}"><td>${t[0]}</td><td class="num">${money(t[1])}</td></tr>`).join('')}</tbody></table>`;
    }
    return `<div class="table-wrap tall"><table class="data">${head}<tbody>${body}</tbody><tfoot>${totals.map((t, i) => `<tr class="total"><td colspan="${span - 1}" class="right">${t[0]}</td><td class="num">${i === 2 ? '<b>' + money(t[1]) + '</b>' : money(t[1])}</td></tr>`).join('')}</tfoot></table></div>`;
  }
  ui.pricingTable = pricingTable;

  function usageStripe(usage) {
    const order = usage.bandOrder.length ? usage.bandOrder : Object.keys(usage.kwhByBand), tot = order.reduce((s, b) => s + (usage.kwhByBand[b] || 0), 0) || 1;
    return `<div class="stripe">${order.map((b, i) => (usage.kwhByBand[b] > 0 ? `<i style="width:${((usage.kwhByBand[b] / tot) * 100).toFixed(2)}%;background:${BAND_COLORS[i % 5]}" title="${esc((usage.bandLabels[b] || b) + ': ' + fmtNum(usage.kwhByBand[b], 0) + ' kWh')}"></i>` : '')).join('')}</div><div class="legend">${order.map((b, i) => `<span><i style="background:${BAND_COLORS[i % 5]}"></i>${esc(usage.bandLabels[b] || b)}: ${fmtNum(usage.kwhByBand[b] || 0, 0)} kWh (${fmtPct((usage.kwhByBand[b] || 0) / tot, 1)})</span>`).join('')}</div>`;
  }
  ui.usageStripe = usageStripe;
  const cPerKwh = (cents, kwh) => (kwh > 0 ? fmtNum(cents / kwh, 2) + ' c/kWh' : '–');

  // ============================== list / builder ===================================================================
  function quotesList() {
    const rows = repo.list('Quote').sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return pageHead({ title: 'Quotes', sub: 'Price a customer\'s own interval data for the next 12 months with the same engine that produces invoices.', actions: ui.link('New quote', '#/quotes/new', { kind: 'btn primary', ic: 'plus' }) }) +
      card({
        flush: true, body: table({
          rows, go: q => `#/quotes/${q.quoteId}`, emptyHtml: empty('No quotes yet', 'Create one from a customer with interval data. The demo set-up from the Dashboard gives you two.'),
          cols: [
            { label: 'Quote', render: q => `<b>${esc(q.quoteNumber)}</b>` }, { label: 'Customer', render: q => esc(q.customerName) }, { label: 'Offer', render: q => esc(q.offerName) }, { label: 'Status', render: q => statusBadge(q.status) },
            { label: 'NMIs', render: q => esc(q.items.map(i => i.nmi).join(', ')) }, { label: 'Starts', render: q => fmtDate(q.startDate) },
            { label: 'Est. annual (ex GST)', th: 'num', cls: 'num', render: q => money(q.totals.subtotalCents) }, { label: 'inc GST', th: 'num', cls: 'num', render: q => money(q.totals.totalCents) },
            { label: 'Created', render: q => fmtTs(q.createdAt) },
          ],
        }),
      });
  }
  function quoteNew(q) {
    const customers = repo.list('Customer').sort((a, b) => a.name.localeCompare(b.name)), offers = repo.list('RetailOffer', o => o.status !== 'Retired');
    const cid = q.customer && repo.get('Customer', q.customer) ? q.customer : (customers[0] || {}).customerId;
    if (!customers.length) return pageHead({ title: 'New quote' }) + callout('warn', 'Create a customer first (or load the demo set-up from the Dashboard).') + ui.link('Go to customers', '#/customers', { kind: 'btn' });
    const sites = repo.list('Site', { customerId: cid }), nmis = repo.list('Nmi', n => n.siteId && sites.some(s => s.siteId === n.siteId));
    const start = util.addDays(util.monthEnd(today()), 1);
    const rows = nmis.map(n => {
      const site = sites.find(s => s.siteId === n.siteId), ref = svc.referencePeriod(n.nmi, 12), snap = svc.standing(n.nmi), cur = snap && snap.networkTariffCode;
      const opts = repo.list('NetworkTariff', t => t.status === 'open' || t.tariffCode === cur).map(t => `<option value="${esc(t.tariffCode)}"${t.tariffCode === cur ? ' selected' : ''}>${esc(t.tariffCode)}: ${esc(t.name)}${t.status === 'closed' ? ' (closed)' : ''}</option>`).join('');
      return `<tr><td><input type="checkbox" name="nmi" value="${esc(n.nmi)}" ${ref ? 'checked' : 'disabled'} aria-label="Quote ${esc(n.nmi)}"></td><td><b class="mono">${esc(n.nmi)}</b><div class="small muted">${esc(site.name)}</div></td>
        <td>${ref ? `${fmtDate(ref.from)} – ${fmtDate(ref.to)}<div class="small muted">${util.dateRange(ref.from, ref.to).length} days · MD lead-in from ${fmtDate(util.addMonths(ref.from, -12))}</div>` : badge('no complete month of data', 'bad')}</td>
        <td><select class="in" name="tariff_${esc(n.nmi)}" ${ref ? '' : 'disabled'}>${opts || '<option value="">(no tariff set)</option>'}</select>${cur ? '' : '<div class="small" style="color:var(--bad)">Set a tariff in the NMI standing data or pick one here.</div>'}</td></tr>`;
    }).join('');
    return `<div class="crumbs no-print"><a href="#/quotes">Quotes</a> › New quote</div>` + pageHead({ title: 'New quote', sub: 'Choose the customer, the sites to price and the offer. The reference period is each NMI\'s most recent 12 complete months.' }) +
      `<form data-submit="quote-create"><div class="card"><div class="body"><div class="form-grid">
        <label class="field">Customer<select name="customer" data-change="quote-customer">${customers.map(c => `<option value="${esc(c.customerId)}"${c.customerId === cid ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
        <label class="field">Retail offer<select name="offer" required>${offers.map(o => `<option value="${esc(o.offerId)}"${(sites[0] && sites[0].retailOfferId === o.offerId) ? ' selected' : ''}>${esc(o.name)} (${esc(o.status)})</option>`).join('') || '<option value="">(create an offer first)</option>'}</select></label>
        <label class="field">Supply start date<input type="date" name="start" value="${start}" required><span class="help">Network and retail prices are taken as at this date</span></label>
        <label class="field">Term<select name="term"><option value="12">12 months</option><option value="24">24 months</option><option value="36">36 months</option></select></label>
        <label class="field">Quote valid for (days)<input type="number" name="valid" value="30" min="1" step="1"></label>
        <label class="field full">RT6 maximum demand (MD) basis<select name="mdBasis"><option value="annual">Annual peak of the reference year, assumed to recur (recommended for a forward quote)</option><option value="rolling">Rolling 12-month MD as billed (early months are understated unless about 24 months of history exist)</option></select></label>
        <label class="check" style="align-self:end"><input type="checkbox" name="compare" checked> Compare all open network tariffs for each site</label>
        <label class="field full">Notes (shown on the quote)<textarea name="notes" rows="2"></textarea></label></div></div></div>
      ${card({ title: 'Sites and NMIs to price', flush: true, body: nmis.length ? `<div class="table-wrap tall"><table class="data"><thead><tr><th></th><th>NMI · site</th><th>Reference period</th><th>Network tariff to quote</th></tr></thead><tbody>${rows}</tbody></table></div>` : empty('This customer has no NMIs', 'Add a site and an NMI on the customer page.'), footer: 'Months before the loaded Western Power price list is re-priced at the rates effective on the start date, so a quote is always at today\'s published prices. If the start date is after the loaded list ends, the latest rates are assumed and flagged.' })}
      <div class="toolbar"><button class="btn primary" type="submit" ${nmis.length ? '' : 'disabled'}>${icon('quotes')} Price the quote</button><a class="btn" href="#/quotes">Cancel</a></div></form>`;
  }
  ui.act('quote-customer', el => ui.go(`#/quotes/new?customer=${encodeURIComponent(el.value)}`));
  ui.act('quote-create', async form => {
    const f = new FormData(form), nmis = f.getAll('nmi'), submit = form.querySelector('[type=submit]');
    if (!nmis.length) return toast('Tick at least one NMI to price.', 'bad');
    submit.disabled = true; submit.textContent = 'Pricing 12 months…';
    await new Promise(r => setTimeout(r, 40));
    try {
      const qt = svc.createQuote({ customerId: f.get('customer'), offerId: f.get('offer'), startDate: f.get('start'), termMonths: +f.get('term'), validDays: +f.get('valid') || 30, notes: f.get('notes') || '', compare: !!f.get('compare'), mdBasis: f.get('mdBasis') || 'annual', items: nmis.map(n => ({ nmi: n, tariffCode: f.get('tariff_' + n) || null })) });
      toast(qt.allOk ? 'Quote priced.' : 'Quote created, but some sites could not be fully priced: see the notices.', qt.allOk ? '' : 'bad');
      ui.go(`#/quotes/${qt.quoteId}`);
    } catch (e) { toast(e.message || String(e), 'bad'); submit.disabled = false; submit.textContent = 'Price the quote'; }
  });

  // ============================== quote detail =====================================================================
  function comparisonTable(it) {
    if (!it.comparison || !it.comparison.length) return '';
    const best = Math.min(...it.comparison.filter(c => c.ok).map(c => c.subtotalCents));
    return `<h4 style="margin:14px 0 6px">Annual cost under each open network tariff (same data, same offer)</h4>` + table({
      rows: it.comparison, rowClass: c => (c.tariffCode === it.tariffCode ? 'group' : ''),
      cols: [
        { label: 'Tariff', render: c => `<b>${esc(c.tariffCode)}</b> <span class="small muted">${esc(c.name)}</span> ${c.tariffCode === it.tariffCode ? badge('quoted', 'info') : ''} ${c.ok && c.subtotalCents === best ? badge('lowest', 'good', 'check') : ''}` },
        { label: 'Network + metering (ex GST)', th: 'num', cls: 'num', render: c => (c.ok ? money(c.networkCents) : '–') }, { label: 'Retail (ex GST)', th: 'num', cls: 'num', render: c => (c.ok ? money(c.retailCents) : '–') },
        { label: 'Total (ex GST)', th: 'num', cls: 'num', render: c => (c.ok ? `<b>${money(c.subtotalCents)}</b>` : '–') },
        { label: 'vs quoted', th: 'num', cls: 'num', render: c => (c.ok && c.tariffCode !== it.tariffCode ? `${c.subtotalCents - it.subtotalCents >= 0 ? '+' : '-'}${money(Math.abs(c.subtotalCents - it.subtotalCents))} (${fmtPct((c.subtotalCents - it.subtotalCents) / it.subtotalCents, 1)})` : '') },
        { label: 'Max demand', th: 'num', cls: 'num', render: c => (c.mdMax ? fmtNum(c.mdMax, 0) + ' kVA' : '') }, { label: 'Note', render: c => (c.ok ? '' : `<span class="small" style="color:var(--bad)">${esc(c.problem)}</span>`) },
      ],
    });
  }
  function itemCard(it, qt) {
    if (!it.lines.length) return card({ title: `NMI ${esc(it.nmi)}`, body: ui.noticeList(it.notices) });
    const kwh = it.usage.kwhTotal, monthly = it.monthly;
    return card({
      title: `<span class="mono">${esc(it.nmi)}</span> · ${esc(it.siteName || '')} <span class="muted" style="font-weight:400">· ${esc(it.tariffCode)}</span>`,
      body: `<div class="kpis"><div class="kpi"><div class="l">Annual (ex GST)</div><div class="v">${money(it.subtotalCents)}</div><div class="s">${money(it.totalCents)} inc GST</div></div>${kpi('Annual consumption', fmtNum(kwh, 0) + ' kWh', `${fmtNum(it.referenceDays)} days · ${fmtDate(it.refFrom)} – ${fmtDate(it.refTo)}`)}${kpi('Average price', cPerKwh(it.subtotalCents, kwh), 'ex GST, all charges')}${it.usage.mdMax ? kpi('Maximum demand', fmtNum(it.usage.mdMax, 1) + ' kVA', `off-peak share ${fmtPct(it.usage.offPeakShare, 1)}`) : kpi('Peak month', fmtNum(Math.max(...monthly.map(m => m.kwh)), 0) + ' kWh')}</div>` +
        ui.noticeList(it.notices) + pricingTable({ ...it, gstRate: qt.gstRate }) +
        `<h4 style="margin:16px 0 6px">Consumption by time band</h4>${usageStripe(it.usage)}` + comparisonTable(it) +
        `<h4 style="margin:16px 0 6px">Monthly cost (ex GST)</h4>${charts.stacked({ data: monthly.map(m => ({ label: mmmYY(m.from.slice(0, 7)), parts: [{ name: 'Network + metering', value: m.networkCents / 100, color: 'var(--s1)' }, { name: 'Retail', value: m.retailCents / 100, color: 'var(--s2)' }] })), yFmt: v => '$' + charts.compact(v), every: 1, label: 'Monthly cost by network and retail' })}${charts.legend([{ name: 'Network + metering', color: 'var(--s1)' }, { name: 'Retail', color: 'var(--s2)' }])}` +
        table({ rows: monthly, cols: [{ label: 'Month', render: m => util.fmtMonth(m.from.slice(0, 7)) }, { label: 'kWh', th: 'num', cls: 'num', render: m => fmtNum(m.kwh, 0) }, { label: 'MD (kVA)', th: 'num', cls: 'num', render: m => (m.md ? fmtNum(m.md, 1) : '–') }, { label: 'Network + metering', th: 'num', cls: 'num', render: m => money(m.networkCents) }, { label: 'Retail', th: 'num', cls: 'num', render: m => money(m.retailCents) }, { label: 'Total (ex GST)', th: 'num', cls: 'num', render: m => `<b>${money(m.totalCents)}</b>` }] }),
    });
  }

  function quoteDoc(qt) {
    const co = svc.company(), cust = repo.get('Customer', qt.customerId) || { name: qt.customerName }, t = qt.totals, kwh = t.kwh;
    const draft = qt.status === 'Draft';
    const items = qt.items.filter(i => i.lines.length);
    const notes = Array.from(new Map(items.flatMap(i => i.notices.filter(n => n.level !== 'info').map(n => [n.code, n.message]))).values());
    return `<div class="paper">${draft ? '<div class="watermark">DRAFT</div>' : ''}
      <div class="doc-head"><div><h1>Electricity supply quote</h1><div class="muted">Contestable business customer · Western Power network (SWIS)</div></div>
      <div class="co"><b>${esc(co.name)}</b><br>ABN ${esc(co.abn)}<br>${esc(co.address)}<br>${esc(co.phone)} · ${esc(co.email)}</div></div>
      <div class="meta"><div><span>Quote number</span><b>${esc(qt.quoteNumber)}</b></div><div><span>Prepared for</span><b>${esc(qt.customerName)}</b></div><div><span>Quote date</span>${fmtDate(qt.createdAt.slice(0, 10))}</div><div><span>ABN</span>${esc(cust.abn || '–')}</div><div><span>Valid until</span>${fmtDate(qt.validUntil)}</div><div><span>Contact</span>${esc(cust.contactName || '–')}</div>
      <div><span>Offer</span>${esc(qt.offerName)}</div><div><span>Supply start / term</span>${fmtDate(qt.startDate)} · ${qt.termMonths} months</div></div>
      <h2>Summary of estimated annual charges</h2>
      <table class="doc"><thead><tr><th>Site · NMI</th><th>Network tariff</th><th class="num">Annual kWh</th><th class="num">Max demand</th><th class="num">Annual (ex GST)</th><th class="num">c/kWh</th></tr></thead><tbody>${items.map(i => `<tr><td>${esc(i.siteName || '')} · <span class="mono">${esc(i.nmi)}</span></td><td>${esc(i.tariffCode)}</td><td class="num">${fmtNum(i.usage.kwhTotal, 0)}</td><td class="num">${i.usage.mdMax ? fmtNum(i.usage.mdMax, 0) + ' kVA' : '–'}</td><td class="num">${money(i.subtotalCents)}</td><td class="num">${fmtNum(i.subtotalCents / i.usage.kwhTotal, 2)}</td></tr>`).join('')}</tbody></table>
      <table class="doc totals avoid"><tbody><tr><td>Estimated annual charges (ex GST)</td><td class="num">${money(t.subtotalCents)}</td></tr><tr><td>GST (${fmtNum(qt.gstRate * 100, 0)}%)</td><td class="num">${money(t.gstCents)}</td></tr><tr class="grand"><td>Estimated annual (inc GST)</td><td class="num">${money(t.totalCents)}</td></tr><tr><td class="muted">Average per month (inc GST)</td><td class="num muted">${money(t.totalCents / 12)}</td></tr></tbody></table>
      ${qt.termMonths > 12 ? `<p class="note">Indicative cost over the ${qt.termMonths}-month term at today's prices: ${money(Math.round(t.totalCents * qt.termMonths / 12))} inc GST. Network prices are reset by Western Power each 1 July.</p>` : ''}
      ${items.map(i => `<div class="avoid"><h2>${esc(i.siteName || 'Site')} · NMI ${esc(i.nmi)} · tariff ${esc(i.tariffCode)}${i.meteringService && i.meteringService !== 'NONE' ? ` · metering service ${esc(i.meteringService)}` : ''}</h2>
        <p class="muted">Based on ${fmtNum(i.referenceDays)} days of half-hourly data (${fmtDate(i.refFrom)} to ${fmtDate(i.refTo)}), re-priced at rates effective ${fmtDate(i.rateAsAt)}.${i.usage.mdMax ? ` Maximum demand ${fmtNum(i.usage.mdMax, 1)} kVA${i.mdBasis === 'annual' ? ' (the highest half-hourly demand in that period, assumed to recur each month)' : ' (rolling 12 months, as billed)'}.` : ''}</p></div>${pricingTable({ ...i, gstRate: qt.gstRate }, { doc: true })}`).join('')}
      ${notes.length ? `<h2>Important notes</h2>${notes.map(n => `<div class="note warn">${esc(n)}</div>`).join('')}` : ''}
      ${qt.notes ? `<h2>Notes</h2><p>${esc(qt.notes)}</p>` : ''}
      <h2>Terms</h2><p class="muted">${esc(svc.setting('terms.quote', ''))}</p>
      <div class="sign avoid"><div>Accepted for ${esc(qt.customerName)}<br><br>Name / signature / date</div><div>For ${esc(co.name)}<br><br>Name / signature / date</div></div></div>`;
  }

  function quoteScreen(id, q) {
    const qt = repo.get('Quote', id);
    if (!qt) return pageHead({ title: 'Quote not found' }) + ui.link('Back to quotes', '#/quotes');
    const tab = q.tab || 'summary', t = qt.totals, items = qt.items;
    const next = { Draft: [['Issued', 'Mark as issued', 'primary']], Issued: [['Accepted', 'Customer accepted', 'primary'], ['Declined', 'Declined', ''], ['Expired', 'Expired', '']], Accepted: [], Declined: [['Draft', 'Re-open as draft', '']], Expired: [['Draft', 'Re-open as draft', '']] }[qt.status] || [];
    const tabs = ui.tabs([['summary', 'Summary'], ['sites', 'Sites in detail'], ['document', 'Quote document']], tab, `#/quotes/${id}`);
    const head = `<div class="crumbs no-print"><a href="#/quotes">Quotes</a> › ${esc(qt.quoteNumber)}</div>` + pageHead({
      title: `${esc(qt.quoteNumber)} ${statusBadge(qt.status)}`, sub: `${esc(qt.customerName)} · ${esc(qt.offerName)} · starts ${fmtDate(qt.startDate)} · valid until ${fmtDate(qt.validUntil)}`,
      actions: (tab === 'document' ? btn('Print / Save as PDF', 'do-print', { ic: 'print', kind: 'primary' }) : '') + btn('Excel', 'quote-xlsx', { ic: 'sheet', data: { id } }) +
        (qt.status === 'Draft' ? btn('Recalculate', 'quote-recalc', { ic: 'refresh', data: { id }, title: 'Re-price with the current rates, data and settings' }) : '') +
        next.map(([s, label, kind]) => btn(label, 'quote-status', { kind, data: { id, status: s } })).join('') + (qt.status === 'Draft' ? btn('', 'quote-del', { ic: 'trash', kind: 'danger', data: { id }, title: 'Delete draft' }) : ''),
    });
    if (tab === 'document') return head + tabs + (qt.allOk ? '' : `<div class="no-print">${callout('bad', '<b>Some sites could not be fully priced.</b> Fix the problems on the Summary tab before issuing this quote.')}</div>`) + quoteDoc(qt);
    const problems = items.filter(i => !i.ok);
    const body = tab === 'sites' ? items.map(i => itemCard(i, qt)).join('') :
      `<div class="kpis"><div class="kpi"><div class="l">Estimated annual (ex GST)</div><div class="v">${money(t.subtotalCents)}</div><div class="s">${money(t.totalCents)} inc GST</div></div>${kpi('Annual consumption', fmtNum(t.kwh, 0) + ' kWh', `${items.length} NMI(s)`)}${kpi('Average price', cPerKwh(t.subtotalCents, t.kwh), 'ex GST, all charges')}${kpi('Per month (inc GST)', money(t.totalCents / 12))}</div>` +
      card({
        title: 'Sites', flush: true, body: table({
          rows: items, cols: [
            { label: 'Site · NMI', render: i => `${esc(i.siteName || '')} · <b class="mono">${esc(i.nmi)}</b>` }, { label: 'Tariff', render: i => `<b>${esc(i.tariffCode || '–')}</b>` },
            { label: 'Annual kWh', th: 'num', cls: 'num', render: i => (i.ok ? fmtNum(i.usage.kwhTotal, 0) : '–') }, { label: 'Max demand', th: 'num', cls: 'num', render: i => (i.ok && i.usage.mdMax ? fmtNum(i.usage.mdMax, 0) + ' kVA' : '') },
            { label: 'Annual (ex GST)', th: 'num', cls: 'num', render: i => (i.ok ? `<b>${money(i.subtotalCents)}</b>` : badge('not priced', 'bad')) }, { label: 'c/kWh', th: 'num', cls: 'num', render: i => (i.ok ? cPerKwh(i.subtotalCents, i.usage.kwhTotal) : '') },
            { label: 'Cheapest tariff', render: i => { const ok = (i.comparison || []).filter(c => c.ok).sort((a, b) => a.subtotalCents - b.subtotalCents)[0]; return ok ? (ok.tariffCode === i.tariffCode ? badge(ok.tariffCode + ' (quoted)', 'good', 'check') : badge(`${ok.tariffCode} saves ${money(i.subtotalCents - ok.subtotalCents)}`, 'warn')) : ''; } },
          ],
        }),
      }) + (problems.length ? card({ title: 'Problems', body: problems.map(i => `<h4>NMI ${esc(i.nmi)}</h4>${ui.noticeList(i.notices)}`).join('') }) : '') +
      items.filter(i => i.ok).map(i => card({ title: `${esc(i.siteName || i.nmi)}: notices`, body: ui.noticeList(i.notices) || '<p class="muted">No notices.</p>' })).join('');
    return head + tabs + body;
  }
  ui.act('do-print', () => window.print());
  ui.act('quote-status', el => { svc.setQuoteStatus(el.dataset.id, el.dataset.status); toast(`Quote marked ${el.dataset.status.toLowerCase()}.`); ui.refresh(); });
  ui.act('quote-recalc', async el => {
    el.disabled = true; await new Promise(r => setTimeout(r, 30));
    try { svc.recalcQuote(el.dataset.id); toast('Quote re-priced.'); } catch (e) { toast(e.message, 'bad'); }
    ui.refresh();
  });
  ui.act('quote-del', async el => { if (!(await ui.confirmDialog({ title: 'Delete this draft quote?', message: 'Only drafts can be deleted; issued quotes are kept for the record.', confirmLabel: 'Delete', danger: true }))) return; repo.remove('Quote', el.dataset.id); ui.go('#/quotes'); });
  ui.act('quote-xlsx', el => {
    const qt = repo.get('Quote', el.dataset.id), c = x => x / 100;
    ui.exportXlsx(`${qt.quoteNumber}.xlsx`, [
      { name: 'Summary', rows: [['Quote', qt.quoteNumber], ['Customer', qt.customerName], ['Offer', qt.offerName], ['Start date', qt.startDate], ['Term (months)', qt.termMonths], ['Valid until', qt.validUntil], [], ['Site', 'NMI', 'Tariff', 'Annual kWh', 'Max demand kVA', 'Annual ex GST', 'GST', 'Annual inc GST'], ...qt.items.map(i => [i.siteName, i.nmi, i.tariffCode, i.ok ? i.usage.kwhTotal : '', i.ok ? i.usage.mdMax : '', i.ok ? c(i.subtotalCents) : '', i.ok ? c(i.gstCents) : '', i.ok ? c(i.totalCents) : '']), ['Total', '', '', qt.totals.kwh, '', c(qt.totals.subtotalCents), c(qt.totals.gstCents), c(qt.totals.totalCents)]] },
      { name: 'Charges', rows: [['NMI', 'Group', 'Charge', 'Quantity', 'Unit', 'Rate', 'Rate unit', 'Amount ex GST']].concat(...qt.items.map(i => i.lines.map(l => [i.nmi, l.group, l.label, l.quantity, l.unit, l.rate, l.rateUnit, c(l.amountExGstCents)]))) },
      { name: 'Monthly', rows: [['NMI', 'Month', 'kWh', 'MD kVA', 'Network+metering', 'Retail', 'Total ex GST']].concat(...qt.items.map(i => (i.monthly || []).map(m => [i.nmi, m.from.slice(0, 7), m.kwh, m.md, c(m.networkCents), c(m.retailCents), c(m.totalCents)]))) },
      { name: 'Tariff comparison', rows: [['NMI', 'Tariff', 'Priced', 'Annual ex GST', 'Network+metering', 'Retail', 'Max demand kVA', 'Note']].concat(...qt.items.map(i => (i.comparison || []).map(x => [i.nmi, x.tariffCode, x.ok ? 'yes' : 'no', x.ok ? c(x.subtotalCents) : '', x.ok ? c(x.networkCents) : '', x.ok ? c(x.retailCents) : '', x.mdMax, x.problem]))) },
    ]);
  });
  ui.register('quotes', { title: args => (args[0] === 'new' ? 'New quote' : args[0] ? 'Quote' : 'Quotes'), nav: 'quotes', render: (args, q) => (args[0] === 'new' ? quoteNew(q) : args[0] ? quoteScreen(args[0], q) : quotesList()) });
})();
</script>
<script data-section="ui-billing">
/* ============================================================================
   SECTION 8e — ui screens: Billing (bill runs, invoices, printable tax invoice)
   Invoices come from svc.runBill(), which calls the same engine as quotes.
   ============================================================================ */
(() => {
  'use strict';
  const { $, $$, card, btn, badge, statusBadge, callout, kpi, table, empty, pageHead, icon, toast } = ui;
  const { esc, fmtNum, fmtDate, fmtTs, fmtPct } = util;
  const money = c => ui.money(c);
  const today = () => svc.today();
  const warnCount = inv => (inv.notices || []).filter(n => n.level === 'warn').length;

  // ============================== bill runs ====================================================================
  function nmiOptions(from, to) {
    const sites = svc.asMap(repo.list('Site'), 'siteId'), custs = svc.asMap(repo.list('Customer'), 'customerId');
    return repo.list('Nmi', n => n.siteId).map(n => {
      const site = sites.get(n.siteId), cust = site && custs.get(site.customerId), snap = svc.standing(n.nmi), cov = svc.dataCoverage(n.nmi);
      const days = from && to ? util.dateRange(from, to).length : 0;
      const have = cov ? util.dateRange(from, to).filter(d => d >= cov.first && d <= cov.last).length : 0;
      const billed = repo.list('Invoice', i => i.nmi === n.nmi && i.status !== 'Void' && i.periodFrom <= to && i.periodTo >= from)[0];
      const problems = [];
      if (!snap || !snap.networkTariffCode) problems.push('no network tariff');
      if (!site.retailOfferId) problems.push('no retail offer');
      if (!cov) problems.push('no interval data'); else if (have < days) problems.push(`data covers ${have} of ${days} days`);
      return { n, site, cust, tariff: snap && snap.networkTariffCode, cov, have, days, billed, problems };
    });
  }
  function billingScreen(q) {
    const tab = q.tab || 'runs', def = svc.lastBillablePeriod() || { from: util.monthStart(today()), to: util.monthEnd(today()) };
    const from = q.from || def.from, to = q.to || def.to;
    const runs = repo.list('BillRun').sort((a, b) => b.createdAt.localeCompare(a.createdAt)), invoices = repo.list('Invoice').sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const opts = nmiOptions(from, to);
    const form = card({
      title: 'New bill run',
      body: opts.length ? `<form data-submit="bill-run"><div class="toolbar" style="margin-bottom:6px"><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px">Period from <input class="in" style="width:auto" type="date" name="from" value="${from}" data-change="bill-period"></label><label class="field" style="grid-auto-flow:column;align-items:center;gap:8px">to <input class="in" style="width:auto" type="date" name="to" value="${to}" data-change="bill-period"></label>
        <span class="small muted">${util.dateRange(from, to).length} days · invoices are created as <b>drafts</b>; nothing is issued until you issue it</span></div>
        <div class="table-wrap tall"><table class="data"><thead><tr><th></th><th>Customer · site</th><th>NMI</th><th>Tariff</th><th>Data in period</th><th>Status</th></tr></thead><tbody>${opts.map(o => `<tr><td><input type="checkbox" name="nmi" value="${esc(o.n.nmi)}" ${o.problems.length || o.billed ? '' : 'checked'} aria-label="Bill ${esc(o.n.nmi)}"></td><td>${esc(o.cust.name)} · ${esc(o.site.name)}</td><td class="mono">${esc(o.n.nmi)}</td><td>${esc(o.tariff || '–')}</td><td>${o.cov ? `${o.have} of ${o.days} days` : '–'}</td><td>${o.billed ? badge('already billed: ' + (o.billed.invoiceNumber || 'draft'), 'info') : ''} ${o.problems.map(p => badge(p, 'warn')).join(' ')}${!o.billed && !o.problems.length ? badge('ready', 'good', 'check') : ''}</td></tr>`).join('')}</tbody></table></div>
        <div class="toolbar" style="margin:12px 0 0"><label class="check"><input type="checkbox" name="includeBilled"> Also bill NMIs already billed for an overlapping period (creates a second invoice)</label><span class="spacer"></span><button class="btn primary" type="submit">${icon('billing')} Run bill</button></div></form>`
        : empty('No NMIs are assigned to customer sites yet', 'Assign NMIs on the Customers screen (or load the demo set-up from the Dashboard).'),
      footer: 'Rates are those effective on each day of the period (no assumed rates), so a month with no loaded price list fails with a clear reason rather than being priced wrongly.',
    });
    const runsTable = card({
      title: `Bill runs (${runs.length})`, flush: true, body: table({
        rows: runs, go: r => `#/billing/run/${r.billRunId}`, emptyHtml: empty('No bill runs yet'),
        cols: [{ label: 'Run', render: r => `<b>${esc(r.name)}</b>` }, { label: 'Period', render: r => `${fmtDate(r.periodFrom)} – ${fmtDate(r.periodTo)}` }, { label: 'Invoices', th: 'num', cls: 'num', render: r => r.invoiceIds.length },
          { label: 'Problems', render: r => `${r.failures.length ? badge(r.failures.length + ' failed', 'bad') : ''} ${r.skipped.length ? badge(r.skipped.length + ' skipped', 'info') : ''}` }, { label: 'Created', render: r => fmtTs(r.createdAt) }],
      }),
    });
    const invTable = card({
      title: `Invoices (${invoices.length})`, flush: true, body: table({
        rows: invoices, go: i => `#/billing/invoice/${i.invoiceId}`, emptyHtml: empty('No invoices yet'),
        cols: [{ label: 'Invoice', render: i => `<b>${esc(i.invoiceNumber || 'Draft')}</b>` }, { label: 'Customer · site', render: i => `${esc(i.customerSnapshot.name)} · ${esc(i.siteSnapshot.name)}` }, { label: 'NMI', render: i => `<span class="mono">${esc(i.nmi)}</span>` }, { label: 'Period', render: i => `${fmtDate(i.periodFrom)} – ${fmtDate(i.periodTo)}` },
          { label: 'Status', render: i => statusBadge(i.status) + (warnCount(i) ? ' ' + badge(warnCount(i) + ' warning(s)', 'warn') : '') }, { label: 'Total inc GST', th: 'num', cls: 'num', render: i => money(i.totalCents) }, { label: 'Due', render: i => (i.dueDate ? fmtDate(i.dueDate) : '–') }],
      }),
    });
    return pageHead({ title: 'Billing', sub: 'Run a bill for a period, review the draft invoices, then issue them.' }) + form + ui.tabs([['runs', 'Bill runs'], ['invoices', 'All invoices']], tab, '#/billing') + (tab === 'invoices' ? invTable : runsTable);
  }
  ui.act('bill-period', el => { const f = el.closest('form'); ui.go(`#/billing?from=${f.elements.from.value}&to=${f.elements.to.value}`); });
  ui.act('bill-run', async form => {
    const f = new FormData(form), nmis = f.getAll('nmi'), btnEl = form.querySelector('[type=submit]');
    if (!nmis.length) return toast('Tick at least one NMI to bill.', 'bad');
    btnEl.disabled = true; btnEl.textContent = 'Pricing…';
    await new Promise(r => setTimeout(r, 40));
    try {
      const run = svc.runBill({ from: f.get('from'), to: f.get('to'), nmis, includeBilled: !!f.get('includeBilled') });
      toast(`${run.invoiceIds.length} draft invoice(s) created${run.failures.length ? `, ${run.failures.length} could not be priced` : ''}.`, run.failures.length ? 'bad' : '');
      ui.go(`#/billing/run/${run.billRunId}`);
    } catch (e) { toast(e.message || String(e), 'bad'); btnEl.disabled = false; btnEl.textContent = 'Run bill'; }
  });

  function runScreen(id) {
    const r = repo.get('BillRun', id);
    if (!r) return pageHead({ title: 'Bill run not found' }) + ui.link('Back to billing', '#/billing');
    const invs = r.invoiceIds.map(i => repo.get('Invoice', i)).filter(Boolean), sum = k => invs.filter(i => i.status !== 'Void').reduce((s, i) => s + i[k], 0), drafts = invs.filter(i => i.status === 'Draft');
    return `<div class="crumbs no-print"><a href="#/billing">Billing</a> › ${esc(r.name)}</div>` + pageHead({
      title: esc(r.name), sub: `${fmtDate(r.periodFrom)} – ${fmtDate(r.periodTo)} · created ${fmtTs(r.createdAt)} · calculated from interval data up to row #${fmtNum(r.dataWatermark)} · engine ${esc(r.engineVersion)}`,
      actions: btn('Excel', 'run-xlsx', { ic: 'sheet', data: { id } }) + (drafts.length ? btn(`Issue ${drafts.length} draft invoice(s)`, 'run-issue', { kind: 'primary', ic: 'check', data: { id } }) : ''),
    }) +
      `<div class="kpis">${kpi('Invoices', fmtNum(invs.length), `${drafts.length} draft`)}${kpi('Subtotal (ex GST)', money(sum('subtotalCents')))}${kpi('GST', money(sum('gstCents')))}${kpi('Total (inc GST)', money(sum('totalCents')))}</div>` +
      (r.failures.length ? callout('bad', `<b>${r.failures.length} NMI(s) could not be priced and have no invoice:</b><ul>${r.failures.map(f => `<li><b class="mono">${esc(f.nmi)}</b>: ${esc(f.messages.join(' '))}</li>`).join('')}</ul>`) : '') +
      (r.skipped.length ? callout('info', `<b>${r.skipped.length} NMI(s) were skipped:</b><ul>${r.skipped.map(f => `<li><b class="mono">${esc(f.nmi)}</b>: ${esc(f.reason)}</li>`).join('')}</ul>`) : '') +
      card({
        title: 'Invoices', flush: true, body: table({
          rows: invs, go: i => `#/billing/invoice/${i.invoiceId}`, emptyHtml: empty('No invoices were created'),
          cols: [{ label: 'Invoice', render: i => `<b>${esc(i.invoiceNumber || 'Draft')}</b>` }, { label: 'Customer · site', render: i => `${esc(i.customerSnapshot.name)} · ${esc(i.siteSnapshot.name)}` }, { label: 'NMI', render: i => `<span class="mono">${esc(i.nmi)}</span>` }, { label: 'Tariff', render: i => esc(i.tariffCode) },
            { label: 'kWh', th: 'num', cls: 'num', render: i => fmtNum(i.usage.kwhTotal, 0) }, { label: 'MD kVA', th: 'num', cls: 'num', render: i => (i.demand ? fmtNum(i.demand.mdMax, 1) : '–') },
            { label: 'Status', render: i => statusBadge(i.status) + (warnCount(i) ? ' ' + badge(warnCount(i) + ' warning(s)', 'warn', 'warn') : '') }, { label: 'Subtotal', th: 'num', cls: 'num', render: i => money(i.subtotalCents) }, { label: 'Total inc GST', th: 'num', cls: 'num', render: i => `<b>${money(i.totalCents)}</b>` }],
        }),
      }) + card({ title: 'Calculation basis', body: `<p class="small muted" style="margin:0">Rates effective on each billing day · MD mode <b>${esc(r.settings.mdMode)}</b> over <b>${r.settings.mdWindowMonths}</b> months · GST ${fmtNum(r.settings.gstRate * 100, 0)}% · the interval data as it was loaded when this run was calculated (later revisions are flagged on each invoice).</p>` });
  }
  ui.act('run-issue', async el => {

      card({ title: 'Consumption by time band', body: ui.usageStripe(u) }) +
      (d ? card({ title: `Metered demand: ${esc(inv.tariffCode)}`, flush: true, body: table({ rows: d.runs, cols: [{ label: 'Days', render: r => `${fmtDate(r.from)} – ${fmtDate(r.to)}` }, { label: 'Count', th: 'num', cls: 'num', render: r => r.days }, { label: 'MD (kVA)', th: 'num', cls: 'num', render: r => fmtNum(r.md, 2) }, { label: 'Band', render: r => `${fmtNum(r.lower)}–${Number.isFinite(r.upper) ? fmtNum(r.upper) : '∞'} kVA${r.extrapolated ? ' (extended)' : ''}` }, { label: 'Fixed (c/day)', th: 'num', cls: 'num', render: r => fmtNum(r.fixed, 3) }, { label: 'Rate (c/kVA/day)', th: 'num', cls: 'num', render: r => fmtNum(r.rate, 3) }, { label: 'Daily charge (c)', th: 'num', cls: 'num', render: r => fmtNum(r.gross, 3) }, { label: 'Discount', th: 'num', cls: 'num', render: r => fmtPct(r.discountRate, 2) }, { label: 'After discount (c/day)', th: 'num', cls: 'num', render: r => fmtNum(r.net, 3) }] }), footer: `Off-peak share of the period's kWh: ${fmtPct(d.offPeakShare, 2)} (${fmtNum(d.offPeakKwh, 0)} kWh). MD is the rolling ${d.windowMonths}-month maximum half-hourly kVA, ${d.mdMode === 'daily' ? 'recalculated for each billing day' : 'taken at the end of the period'}.` }) : '') +

      { name: 'Lines', rows: [['Line', 'Group', 'Description', 'Period from', 'Period to', 'Quantity', 'Unit', 'Rate', 'Rate unit', 'Amount ex GST'], ...invLines(inv).map(l => [l.lineNo, l.group, l.description, l.periodFrom, l.periodTo, l.quantity, l.unit, l.rate, l.rateUnit, c(l.amountExGstCents)])] },

    title: args => (args[0] === 'invoice' ? 'Invoice' : args[0] === 'run' ? 'Bill run' : 'Billing'), nav: 'billing',

<script data-section="ui-misc">
/* ============================================================================

(() => {

    const steps = [
      [repo.count('Rate') > 0, 'Tariff book loaded', 'Western Power 2026-27 prices, time bands and WA public holidays are seeded as data.', ui.link('View tariff book', '#/tariffs', { kind: 'btn sm' })],

      `<div class="kpis">${kpi('Customers', fmtNum(customers.length), `${fmtNum(sites.length)} sites · ${fmtNum(nmis.length)} NMIs`)}${kpi('Interval rows (current)', fmtNum(rows), `${fmtNum(extra)} older versions kept · ${fmtNum(files.length)} files`)}${kpi('Quotes', fmtNum(quotes.length), `${quotes.filter(q => q.status === 'Issued').length} issued`)}${kpi('Invoices', fmtNum(invoices.length), `${invoices.filter(i => i.status === 'Draft').length} draft · ${invoices.filter(i => i.status === 'Issued').length} issued`)}${kpi('Open tasks', fmtNum(tasks.length), `${tasks.filter(t => t.priority === 'High').length} high priority`)}</div>` +

      }) +
      (streams.length ? card({ title: 'Interval data quality', flush: true, actions: ui.qualityLegend(), body: table({ rows: streams, go: s => `#/meter-data/stream/${s.nmi}/${s.suffix}`, cols: [{ label: 'NMI', render: s => `<b class="mono">${esc(s.nmi)}</b> ${esc(s.suffix)}` }, { label: 'Customer · site', render: s => ui.siteLabel(s.nmi) }, { label: 'From – to', render: s => `${fmtDate(s.firstDate)} – ${fmtDate(s.lastDate)}`, cls: 'nowrap' }, { label: 'Intervals', th: 'num', cls: 'num', render: s => fmtNum(s.rowsCurrent) }, { label: 'Quality', render: s => ui.qualityMix(s.quality) }] }) }) : '') +

    const id = t.relatedId;

      Nmi: () => { const n = repo.get('Nmi', id), s = n && n.siteId ? repo.get('Site', n.siteId) : null; return s ? `#/customers/${s.customerId}` : '#/customers'; },
