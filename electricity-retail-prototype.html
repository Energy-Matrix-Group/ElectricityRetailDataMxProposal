    title: 'Add task', submitLabel: 'Add task', fields: [{ name: 'title', label: 'Task', required: true, full: true }, { name: 'description', label: 'Details', type: 'textarea', full: true }, { name: 'priority', label: 'Priority', type: 'select', options: ['Normal', 'High', 'Low'] }, { name: 'dueDate', label: 'Due date', type: 'date' }], values: { priority: 'Normal' },
    onSubmit: v => { repo.insert('Task', { ...v, dueDate: v.dueDate || null, status: 'Open', relatedType: null, relatedId: null, source: 'user', completedAt: null }); toast('Task added.'); },
  }));
  ui.register('tasks', { title: 'Tasks', nav: 'tasks', render: (args, q) => tasksScreen(q) });

  // ============================== market transactions =======================================================================
  function marketScreen() {
    const rows = repo.list('MarketTransaction').sort((a, b) => b.createdAt.localeCompare(a.createdAt)), custs = svc.asMap(repo.list('Customer'), 'customerId');
    const nextStatus = s => ({ Draft: ['Submitted'], Submitted: ['Acknowledged', 'Rejected', 'Cancelled'], Acknowledged: ['Completed', 'Rejected', 'Cancelled'], Rejected: ['Draft'], Completed: [], Cancelled: [] }[s] || []);
    return pageHead({ title: 'Market transactions', sub: 'A log of requests to the network operator and market (customer transfers, standing data, meter data), each with its follow-up tasks.', actions: btn('New transaction', 'mt-add', { ic: 'plus', kind: 'primary' }) }) +
      callout('info', 'Illustrative: the transaction types and statuses below are placeholders. Align them with the Western Power / retail market procedures when this is built into the production system.') +
      card({
        flush: true, body: table({
          rows, emptyHtml: empty('No transactions yet', 'Creating one raises its follow-up tasks automatically.'),
          cols: [
            { label: 'Type', render: t => `<b>${esc(t.type)}</b><div class="small muted">${esc(t.reference || t.txnId)}</div>` }, { label: 'NMI', render: t => `<span class="mono">${esc(t.nmi || '–')}</span>` }, { label: 'Customer', render: t => esc((custs.get(t.customerId) || {}).name || '–') },
            { label: 'Proposed', render: t => (t.proposedDate ? fmtDate(t.proposedDate) : '–') }, { label: 'Status', render: t => statusBadge(t.status) },
            { label: 'History', render: t => `<span class="small muted">${(t.history || []).map(h => `${esc(h.status)} ${fmtTs(h.at).slice(0, 11)}`).join(' → ')}</span>` },
            { label: '', cls: 'nowrap', render: t => nextStatus(t.status).map(s => btn(s, 'mt-set', { kind: 'sm', data: { id: t.txnId, status: s } })).join(' ') },
          ],
        }),
      });
  }
  ui.act('mt-set', el => ui.formDialog({ title: `Mark as ${el.dataset.status}`, fields: [{ name: 'note', label: 'Note (optional)', full: true }], submitLabel: 'Update', onSubmit: v => { svc.advanceMarketTransaction(el.dataset.id, el.dataset.status, v.note); toast('Status updated.'); } }));
  ui.act('mt-add', () => ui.formDialog({
    title: 'New market transaction', submitLabel: 'Create (and raise follow-up tasks)', wide: true,
    fields: [{ name: 'type', label: 'Type', type: 'select', required: true, options: Object.keys(svc.MARKET_TYPES) }, { name: 'nmi', label: 'NMI', type: 'select', options: [{ value: '', label: '(none)' }, ...repo.list('Nmi').map(n => ({ value: n.nmi, label: n.nmi + (n.label ? ' · ' + n.label : '') }))] }, { name: 'customerId', label: 'Customer', type: 'select', options: [{ value: '', label: '(none)' }, ...repo.list('Customer').map(c => ({ value: c.customerId, label: c.name }))] }, { name: 'proposedDate', label: 'Proposed effective date', type: 'date' }, { name: 'reference', label: 'External reference' }, { name: 'notes', label: 'Notes', type: 'textarea', full: true }],
    onSubmit: v => { svc.createMarketTransaction(v); toast('Transaction created; follow-up tasks raised.'); },
  }));
  ui.register('market', { title: 'Market transactions', nav: 'market', render: marketScreen });

  // ============================== data & settings ===========================================================================
  function storageBreakdown() {
    const groups = { 'Raw files (rawStore)': 0, 'Interval data (IntervalReading)': 0, 'Other tables': 0 };
    for (const k of storage.keys()) { const n = k.length + (storage.get(k) || '').length; if (k.startsWith('raw.')) groups['Raw files (rawStore)'] += n; else if (k.startsWith('iv.')) groups['Interval data (IntervalReading)'] += n; else groups['Other tables'] += n; }
    return groups;
  }
  function dataScreen() {
    const co = svc.company(), eng = svc.engineSettings(), st = repo.stats(), u = st.storage, brk = storageBreakdown();
    const field = (id, label, val, extra = '') => `<label class="field"><span>${label}</span><input class="in" name="${id}" value="${esc(val)}" ${extra}></label>`;
    const tables = Object.entries(repo.TABLES).map(([name, d]) => ({ name, rows: st.rowsPerTable[name], sql: d.sql, immutable: d.immutable }));
    return pageHead({ title: 'Data & settings', sub: 'Company details, calculation settings, backup and restore, and how this prototype maps onto the production backend.' }) +
      card({
        title: 'Company details (printed on quotes and invoices)', body: `<form data-submit="save-company"><div class="form-grid">${field('name', 'Company name', co.name)}${field('abn', 'ABN', co.abn)}${field('address', 'Address', co.address)}${field('phone', 'Phone', co.phone)}${field('email', 'Email', co.email)}${field('bankName', 'Bank', co.bankName)}${field('accountName', 'Account name', co.accountName)}${field('bsb', 'BSB', co.bsb)}${field('accountNumber', 'Account number', co.accountNumber)}</div><div class="toolbar" style="margin:12px 0 0"><button class="btn primary" type="submit">Save company details</button></div></form>`,
      }) +
      card({
        title: 'Calculation settings', body: `<form data-submit="save-engine"><div class="form-grid"><label class="field"><span>GST rate (%)</span><input class="in" type="number" step="any" name="gst" value="${esc(svc.gstRate() * 100)}"></label>
          <label class="field"><span>RT6 maximum demand method</span><select class="in" name="mdMode"><option value="daily"${eng.mdMode === 'daily' ? ' selected' : ''}>Rolling 12 months, recalculated for each billing day (default)</option><option value="period-end"${eng.mdMode === 'period-end' ? ' selected' : ''}>One MD for the whole period: the 12 months ending on the last day</option></select><span class="help">Switch to compare against Western Power's calculator spreadsheet</span></label>
          <label class="field"><span>MD window (months)</span><input class="in" type="number" min="1" step="1" name="window" value="${esc(eng.mdWindowMonths)}"></label></div>
          <label class="field" style="margin-top:12px"><span>Quote terms</span><textarea class="in" name="tq" rows="3">${esc(svc.setting('terms.quote', ''))}</textarea></label><label class="field" style="margin-top:12px"><span>Invoice terms</span><textarea class="in" name="ti" rows="2">${esc(svc.setting('terms.invoice', ''))}</textarea></label>
          <div class="toolbar" style="margin:12px 0 0"><button class="btn primary" type="submit">Save settings</button><span class="small muted">Changing these affects quotes and bills calculated afterwards; issued invoices keep their own figures.</span></div></form>`,
      }) +
      card({ title: 'Backup and restore', body: `<p>Export writes <b>everything</b> (all tables, every interval version and every raw file) to one JSON file. Import <b>replaces</b> all data in this browser with a backup. Browser storage is limited (roughly 5 MB per site): back up regularly.</p><div class="toolbar" style="margin:0">${btn('Export all data (JSON)', 'export-all', { ic: 'download', kind: 'primary' })}${btn('Import data (JSON)', 'import-all', { ic: 'upload' })}</div>` }) +
      card({
        title: 'Storage', body: `<p>Backend: <b>${esc(u.mode)}</b> · using ${util.fmtBytes(u.chars * 2)} of roughly ${util.fmtBytes(u.quotaChars * 2)} (${fmtPct(u.chars / u.quotaChars, 1)}) in ${u.keys} keys.</p>${table({ rows: Object.entries(brk), cols: [{ label: 'Kind', render: r => esc(r[0]) }, { label: 'Size', th: 'num', cls: 'num', render: r => util.fmtBytes(r[1] * 2) }] })}${st.loadErrors.length ? callout('warn', st.loadErrors.map(esc).join('<br>')) : ''}`,
        footer: 'The interval table is stored packed (one block per 300 record) so 13 months for several NMIs fits in the browser; production SQL Server holds one row per interval version.',
      }) +
      card({
        title: 'How this prototype maps onto the production backend', flush: true,
        body: table({ rows: [['rawStore', 'Azure Blob Storage container: write-once blobs named by fileId, with SHA-256 in metadata'], ['repo', 'SQL Server: one table per collection below; repo functions become a data-access layer (Dapper / EF)'], ['nem12', 'Stateless parsing and validation service / library: pure functions, same code'], ['engine', 'Stateless pricing library shared by the quote and billing services: pure functions, same code'], ['svc', 'Application services: ingestion pipeline, pricing orchestration, bill runs'], ['ui', 'Web front end']], cols: [{ label: 'Section', render: r => `<b class="mono">${r[0]}</b>` }, { label: 'Future home', render: r => esc(r[1]) }] }) +
          table({ rows: tables, cols: [{ label: 'repo collection', render: r => `<b class="mono">${esc(r.name)}</b>` }, { label: 'Rows', th: 'num', cls: 'num', render: r => fmtNum(r.rows) }, { label: 'Future SQL Server table', render: r => esc(r.sql) }, { label: 'Writes', render: r => (r.immutable ? badge('append-only', 'info') : '') }] }),
      }) +
      card({
        title: 'Maintenance', body: `<div class="toolbar" style="margin:0">${btn('Restore missing seed data', 'restore-seed', { ic: 'refresh', title: 'Re-adds seeded tariff, band, rate and holiday rows that were deleted. Edits are never overwritten.' })}<span class="spacer"></span>${btn('Erase ALL data…', 'erase-all', { kind: 'danger', ic: 'trash' })}</div><p class="small muted" style="margin:10px 0 0">Raw files and interval versions are never deleted by the application. Erasing is the only way to clear them and it removes everything, then re-seeds the tariff book.</p>`,
      });
  }
  ui.act('save-company', form => { const f = new FormData(form); svc.saveSetting('company', Object.fromEntries(['name', 'abn', 'address', 'phone', 'email', 'bankName', 'accountName', 'bsb', 'accountNumber'].map(k => [k, String(f.get(k) || '').trim()]))); toast('Company details saved.'); ui.refresh(); });
  ui.act('save-engine', form => {
    const f = new FormData(form), gst = Number(f.get('gst')), win = Number(f.get('window'));
    if (!(gst >= 0 && gst < 100) || !(win >= 1)) return toast('Check the GST rate and MD window.', 'bad');
    repo.atomic(() => { svc.saveSetting('gstRate', gst / 100); svc.saveSetting('engine', { ...svc.setting('engine', {}), mdMode: f.get('mdMode'), mdWindowMonths: Math.round(win) }); svc.saveSetting('terms.quote', f.get('tq')); svc.saveSetting('terms.invoice', f.get('ti')); });
    toast('Settings saved.'); ui.refresh();
  });
  ui.act('erase-all', async () => {
    if (!(await ui.confirmDialog({ title: 'Erase ALL data?', message: 'This deletes every customer, interval value, raw file, quote and invoice stored in this browser, then reloads the seeded tariff book. <b>Export a backup first</b>: this cannot be undone.', confirmLabel: 'Erase everything', danger: true, typed: 'ERASE' }))) return;
    repo.resetAll(); seed.run(); ui.state.lastIngest = null; toast('All data erased; tariff book re-seeded.'); ui.go('#/dashboard');
  });
  ui.register('data', { title: 'Data & settings', nav: 'data', render: dataScreen });
})();
</script>
<script data-section="selftests">
/* ============================================================================
   SECTION 8g — in-app self-tests (pure: engine + nem12 + versioning on built-in fixtures)
   They use the seed constants, not your edited tariff book, so editing a rate can never
   make a test fail. The RT6 band-boundary check on the Tests screen is LIVE against the
   tariff book. Nothing here writes to storage.
   ============================================================================ */
const selfTests = (() => {
  'use strict';
  const T = [];
  const test = (group, name, fn) => T.push({ group, name, fn });
  const ok = (c, msg) => { if (!c) throw new Error(msg || 'assertion failed'); };
  const eq = (a, b, msg) => { if (a !== b) throw new Error(`${msg || 'values differ'}: expected ${b}, got ${a}`); };
  const near = (a, b, eps = 1e-6, msg) => { if (!(Math.abs(a - b) <= eps)) throw new Error(`${msg || 'values differ'}: expected ${b}, got ${a}`); };
  const HOL = new Set(seed.holidays.map(h => h.date));
  const rowsFor = (from, to, fn, { suffix = 'E1', L = 30, quality = 'A', unit = 'kWh' } = {}) => {
    const rows = [], N = 1440 / L;
    for (const date of util.dateRange(from, to)) for (let i = 0; i < N; i++) { const v = fn(date, i); rows.push({ nmi: 'T', suffix, registerId: '1', intervalDate: date, intervalNo: i + 1, intervalLength: L, startMinute: i * L, uom: unit, unit, rawValue: v, value: v, quality, method: '', updateDateTime: '20260101000000', sourceFileId: 'F' }); }
    return rows;
  };
  const base = x => ({ tariffs: seed.tariffs, components: seed.components, timeBands: seed.timeBands, rates: seed.rates, holidays: HOL, ...x });
  const price = (tariffCode, from, to, consumption, x = {}) => engine.priceBillingPeriod(base({ tariffCode, period: { from, to }, consumption, ...x }));
  const line = (res, code) => res.lines.filter(l => l.code === code);
  const rb = engine.makeRateBook(seed.rates, { ownerCode: 'WP', tariffCode: 'RT6' }), bands = rb.demandBands('2026-07-15'), P = { DF: 0.3, taperStart: 1000, taperEnd: 1500 };
  const CRLF = '\r\n', hdr = '100,NEM12,202607021200,MDP,RET';
  const b200 = (il = 30, uom = 'kWh', sfx = 'E1') => `200,8001TEST99,${sfx},1,${sfx},N1,SN,${uom},${il},20260801`;
  const b300 = (n, q = 'A', v = 1, d = '20260701') => ['300', d, ...Array(n).fill(v), q, '', '', '20260702010000', ''].join(',');
  const file = (...l) => l.join(CRLF) + CRLF;

  // ---- RT6 ----
  test('RT6', 'published band table is applied exactly (no smoothing)', () => {
    eq(bands.length, 3);
    near(engine.demandCharge(100, bands).amount, 1359.249 + 114.894 * 100); near(engine.demandCharge(600, bands).amount, 34468.2 + 88.518 * 300); near(engine.demandCharge(1200, bands).amount, 96430.8 + 46.173 * 200);
  });
  test('RT6', 'charge just below vs just above 300 kVA steps DOWN by about 1,359.249 c/day (as published)', () => {
    const below = engine.rt6Daily(299.999, 0, bands, P), at = engine.rt6Daily(300, 0, bands, P), above = engine.rt6Daily(300.001, 0, bands, P);
    eq(below.band.bandCode, 'B1'); eq(at.band.bandCode, 'B2');
    near(below.amount, 1359.249 + 114.894 * 299.999, 1e-9); near(at.amount, 34468.2, 1e-9); near(above.amount, 34468.2 + 88.518 * 0.001, 1e-9);
    near(at.amount - below.amount, -1359.249 + 114.894 * 0.001, 1e-6); ok(at.amount < below.amount);
  });
  test('RT6', 'continuous at 1,000 kVA; top of table at 1,500 kVA is flagged as extended', () => {
    ok(Math.abs(engine.demandCharge(1000, bands).amount - engine.demandCharge(999.999, bands).amount) < 0.1);
    eq(engine.demandCharge(1500, bands).extrapolated, true); eq(engine.demandCharge(1499.9, bands).extrapolated, false);
  });
  test('RT6', 'discount: share×DF below 1,000; ((1,500−MD)/500)×share×DF to 1,500; none from 1,500', () => {
    near(engine.demandDiscount(500, 0.8, P), 0.24); near(engine.demandDiscount(1000, 0.8, P), 0.24); near(engine.demandDiscount(1250, 0.8, P), 0.12); eq(engine.demandDiscount(1500, 0.8, P), 0); eq(engine.demandDiscount(1800, 0.8, P), 0);
  });
  test('RT6', 'monthly bill with no Q datastream: assumed PF 0.9, daily charge x (1 − off-peak share × DF)', () => {
    const res = price('RT6', '2026-08-01', '2026-08-31', rowsFor('2025-07-01', '2026-08-31', () => 50), { site: { assumedPf: 0.9 } });
    ok(res.ok, JSON.stringify(res.notices));
    let on = 0, tot = 0; for (const d of util.dateRange('2026-08-01', '2026-08-31')) { tot += 48; if (util.dow(d) >= 1 && util.dow(d) <= 5 && !HOL.has(d)) on += 12; }
    const share = (tot - on) / tot, md = 100 / 0.9, gross = 1359.249 + 114.894 * md;
    near(res.demand.offPeakShare, share, 1e-12); near(res.totals.totalCents, 31 * gross * (1 - share * 0.3) + 31 * 21.492, 1e-6);
    ok(res.notices.some(n => n.code === 'PF_ASSUMED'), 'PF warning shown');
  });
  test('RT6', 'MD is the rolling 12-month maximum: a peak drops out exactly 12 months later', () => {
    const rows = rowsFor('2025-01-01', '2026-12-31', (d, i) => (d === '2025-07-15' && i === 20 ? 250 : 25));
    const res = price('RT6', '2026-07-01', '2026-07-31', rows);
    eq(res.demand.runs.length, 2); eq(res.demand.runs[0].to, '2026-07-14'); eq(res.demand.runs[1].from, '2026-07-15'); near(res.demand.runs[0].md, 500 / 0.9, 1e-9);
  });
  test('RT6', 'kVA = √(kW²+kvar²) from E and Q; shorter intervals are summed to the half hour', () => {
    near(engine.buildProfile({ consumption: rowsFor('2026-08-01', '2026-08-01', () => 50), reactive: rowsFor('2026-08-01', '2026-08-01', () => 25, { suffix: 'Q1', unit: 'kvarh' }) }).days.get('2026-08-01').maxKva, Math.hypot(100, 50), 1e-9);
    near(engine.buildProfile({ consumption: rowsFor('2026-08-01', '2026-08-01', (d, i) => (i === 100 ? 10 : 0.5), { L: 5 }), assumedPf: 1 }).days.get('2026-08-01').maxKva, (10 + 5 * 0.5) * 2, 1e-9);
  });
  test('RT6', 'demand-length charge notice only when MD is above 1,000 kVA', () => {
    const q = rowsFor('2025-07-01', '2026-08-31', () => 0, { suffix: 'Q1', unit: 'kvarh' });
    ok(price('RT6', '2026-08-01', '2026-08-31', rowsFor('2025-07-01', '2026-08-31', () => 500), { reactive: q }).notices.every(n => n.code !== 'DEMAND_LENGTH_NOT_CALCULATED'), 'exactly 1,000 kVA: no notice');
    ok(price('RT6', '2026-08-01', '2026-08-31', rowsFor('2025-07-01', '2026-08-31', (d, i) => (d === '2026-08-10' && i === 5 ? 600 : 100)), { reactive: q }).notices.some(n => n.code === 'DEMAND_LENGTH_NOT_CALCULATED'), '1,200 kVA: notice');
  });

  // ---- RT2 / RT34 ----
  test('RT2 / RT34', 'RT2 for July 2026 matches the hand calculation (and GST rounding)', () => {
    const res = price('RT2', '2026-07-01', '2026-07-31', rowsFor('2026-07-01', '2026-07-31', () => 1));
    near(res.totals.totalCents, 31 * 250.075 + 1488 * 15.1 + 31 * 12.545);
    const f = engine.finalise(res, { gstRate: 0.1 }); eq(f.subtotalCents, 30610); eq(f.gstCents, 3061); eq(f.totalCents, 33671);
  });
  test('RT2 / RT34', 'RT34 splits kWh across the four bands and prices each band', () => {
    const res = price('RT34', '2026-07-01', '2026-07-31', rowsFor('2026-07-01', '2026-07-31', () => 1));
    eq(res.usage.kwhByBand.OFF_PEAK, 434); eq(res.usage.kwhByBand.SHOULDER, 310); eq(res.usage.kwhByBand.SUPER_OFF_PEAK, 372); eq(res.usage.kwhByBand.ON_PEAK, 372);
    near(res.totals.totalCents, 31 * 250.075 + 31 * 12.545 + 372 * 24.71 + 310 * 12.355 + 434 * 9.505 + 372 * 6.289);
  });
  test('RT2 / RT34', 'bands go by interval START time: interval 30 (14:30–15:00) is super off-peak, interval 31 is on-peak', () => {
    const band = n => Object.entries(price('RT34', '2026-08-03', '2026-08-03', rowsFor('2026-08-03', '2026-08-03', (d, i) => (i + 1 === n ? 1 : 0))).usage.kwhByBand).filter(([, v]) => v > 0).map(([k]) => k)[0];
    eq(band(1), 'OFF_PEAK'); eq(band(13), 'SHOULDER'); eq(band(30), 'SUPER_OFF_PEAK'); eq(band(31), 'ON_PEAK'); eq(band(42), 'ON_PEAK'); eq(band(43), 'SHOULDER'); eq(band(47), 'OFF_PEAK'); eq(band(48), 'OFF_PEAK');
  });
  test('RT2 / RT34', 'RT34 bands apply on public holidays (calendar makes no difference); RT6 treats them as off-peak', () => {
    const rows = rowsFor('2026-09-21', '2026-09-30', (d, i) => 1 + (i % 5));
    near(price('RT34', '2026-09-21', '2026-09-30', rows).totals.totalCents, price('RT34', '2026-09-21', '2026-09-30', rows, { holidays: new Set() }).totals.totalCents, 1e-9);
    const r6 = engine.makeBandResolver(seed.timeBands.filter(b => b.tariffCode === 'RT6'));
    eq(r6.bandAt(1, false, 1000), 'ON_PEAK'); eq(r6.bandAt(1, true, 1000), 'OFF_PEAK'); eq(r6.bandAt(6, false, 1000), 'OFF_PEAK');
  });
  test('RT2 / RT34', 'metering: total metering charge = tariff metering + selected add-on (M1…M7, other)', () => {
    const rows = rowsFor('2026-07-01', '2026-07-31', () => 1);
    for (const [c, v] of [['M1', 3.613], ['M3', 41.244], ['M4', 82.490], ['M5', 22.039], ['M7-SIM', 191.058], ['M7-AMI', 3.613]]) near(price('RT2', '2026-07-01', '2026-07-31', rows, { site: { meteringService: c } }).totals.meteringCents, 31 * (12.545 + v), 1e-6, c);
    near(price('RT2', '2026-07-01', '2026-07-31', rows, { site: { meteringService: 'OTHER', meteringOtherCents: 10 } }).totals.meteringCents, 31 * 22.545, 1e-6);
  });
  test('Tariff book', 'every open tariff covers every minute of every day type; closed tariffs have no rates', () => {
    for (const c of ['RT2', 'RT34', 'RT6']) ok(engine.bandCoverage(seed.timeBands.filter(b => b.tariffCode === c)).ok, c + ' coverage');
    for (const c of ['RT4', 'RT18', 'RT20', 'RT22']) { ok(seed.tariffs.find(t => t.tariffCode === c).status === 'closed'); eq(seed.rates.filter(r => r.tariffCode === c).length, 0); ok(!price(c, '2026-07-01', '2026-07-02', rowsFor('2026-07-01', '2026-07-02', () => 1)).ok, c + ' cannot be priced'); }
  });
  test('Tariff book', 'a bill spanning 1 July uses each day\'s own rate set; a missing price list is an error, not a silent zero', () => {
    const old = [{ rateId: 'o1', ownerCode: 'WP', tariffCode: 'RT2', componentCode: 'FIXED', bandCode: '', value: 200, unit: 'c/day', effectiveFrom: '2025-07-01', effectiveTo: '2026-06-30' }, { rateId: 'o2', ownerCode: 'WP', tariffCode: 'RT2', componentCode: 'ENERGY', bandCode: 'ALL', value: 14, unit: 'c/kWh', effectiveFrom: '2025-07-01', effectiveTo: '2026-06-30' }, { rateId: 'o3', ownerCode: 'WP', tariffCode: 'RT2', componentCode: 'METERING', bandCode: '', value: 10, unit: 'c/day', effectiveFrom: '2025-07-01', effectiveTo: '2026-06-30' }];
    const rows = rowsFor('2026-06-15', '2026-07-14', () => 1), both = price('RT2', '2026-06-15', '2026-07-14', rows, { rates: [...seed.rates, ...old] });
    eq(line(both, 'NET.FIXED').length, 2); eq(line(both, 'NET.FIXED')[0].quantity, 16); eq(line(both, 'NET.FIXED')[1].rate, 250.075);
    ok(!price('RT2', '2026-06-15', '2026-07-14', rows).ok, 'no 2025-26 list loaded');
  });

  // ---- NEM12 ----
  test('NEM12', 'parses a valid file; interval 1 starts 00:00 and interval 48 starts 23:30; UOM normalised to kWh', () => {
    const r = nem12.parse(file(hdr, b200(30, 'Wh'), b300(48, 'A', 500), '900')), rows = nem12.toReadingRows(r, 'F');
    eq(r.issues.length, 0); eq(rows.length, 48); eq(rows[0].startMinute, 0); eq(rows[47].startMinute, 1410); eq(rows[0].value, 0.5); eq(rows[0].unit, 'kWh');
  });
  test('NEM12', 'N = 1440 / IntervalLength is read from the 200 record (15-min = 96 values) and mismatches are reported', () => {
    eq(nem12.parse(file(hdr, b200(15), b300(96), '900')).issues.length, 0);
    ok(nem12.parse(file(hdr, b200(15), b300(48), '900')).issues.some(i => i.code === 'VALUE_COUNT' && i.sev === 'error'));
    ok(nem12.parse(file(hdr, b200(30), b300(47), '900')).issues.some(i => i.code === 'VALUE_COUNT'));
  });
  test('NEM12', 'quality V needs 400 records covering the whole day with no gaps; unknown flags are rejected', () => {
    eq(nem12.parse(file(hdr, b200(), b300(48, 'V'), '400,1,20,A,,', '400,21,48,N,0,x', '900')).issues.length, 0);
    ok(nem12.parse(file(hdr, b200(), b300(48, 'V'), '400,1,20,A,,', '400,30,48,A,,', '900')).issues.some(i => i.code === 'V_COVERAGE_GAP'));
    ok(nem12.parse(file(hdr, b200(), b300(48, 'V'), '900')).issues.some(i => i.code === 'V_NO_400'));
    ok(nem12.parse(file(hdr, b200(), b300(48, 'Q'), '900')).issues.some(i => i.code === 'UNKNOWN_FLAG'));
  });
  test('NEM12', 'record order, bad dates and N-flag semantics are validated', () => {
    ok(nem12.parse(file(hdr, b200(), b300(48))).issues.some(i => i.code === 'NO_900'));
    ok(nem12.parse(file(b200(), b300(48), '900')).fatal);
    ok(nem12.parse(file(hdr, b300(48), '900')).issues.some(i => i.code === 'REC_ORDER'));
    ok(nem12.parse(file(hdr, b200(), b300(48, 'A', 1, '20260231'), '900')).issues.some(i => i.code === 'BAD_DATE' && i.line === 3));
    ok(nem12.parse(file(hdr, b200(), b300(48, 'N', 3), '900')).issues.some(i => i.code === 'N_NONZERO'));
  });
  test('NEM12', 'the sample generator produces valid NEM12 (E1 + Q1, with S, E and N intervals)', () => {
    const s = nem12.generateSample({ from: '2026-05-01', to: '2026-07-31', now: '20260801100000', holidays: HOL }), f = s.files[0], r = nem12.parse(f.text), rep = nem12.buildReport(r);
    eq(rep.status, 'Accepted'); eq(r.issues.length, 0); eq(rep.streams.length, 2); ok(rep.streams[0].quality.S > 0 && rep.streams[0].quality.E > 0 && (rep.streams[0].quality.N > 0 || s.files[1].plan.some(p => p.type === 'N_DAY')));
  });

  // ---- versioning / parity / utils ----
  test('Versioning', 'the latest UpdateDateTime wins per interval; an older stamp loaded later does not; ties go to the later load', () => {
    const mk = (id, upd, v) => ({ readingId: id, intervalNo: 1, intervalLength: 30, updateDateTime: upd, value: v });
    eq(repo.pickCurrentVersion([mk(1, '20260702010000', 1), mk(2, '20260705010000', 2), mk(3, '20260701010000', 3)])[0].value, 2);
    eq(repo.pickCurrentVersion([mk(1, '20260702010000', 1), mk(2, '20260702010000', 2)])[0].value, 2);
    eq(repo.pickCurrentVersion([mk(1, '20260702010000', 1), mk(2, '20260705010000', 2)], r => r.readingId <= 1)[0].value, 1, 'watermark view');
  });
  test('Quote = bill', 'a quote month and a bill for the same month come from one engine and agree exactly', () => {
    const rows = rowsFor('2025-09-01', '2026-09-30', (d, i) => 20 + 30 * Math.sin((util.dayNum(d) + i) / 50) ** 2);
    const profile = engine.buildProfile({ consumption: rows }), p = { from: '2026-09-01', to: '2026-09-30' };
    const bill = engine.priceBillingPeriod(base({ tariffCode: 'RT34', period: p, consumption: rows, options: { rateAsAt: '2026-09-01' } })), quote = engine.priceBillingPeriod(base({ tariffCode: 'RT34', period: p, profile, options: { rateAsAt: '2026-09-01' } }));
    near(bill.totals.totalCents, quote.totals.totalCents, 1e-9);
    const months = engine.monthPeriods('2025-10-01', '2026-09-30'); eq(months.length, 12);
    const agg = engine.aggregate(months.map(m => engine.priceBillingPeriod(base({ tariffCode: 'RT34', period: m, profile, options: { rateAsAt: '2026-07-01' } })))); near(agg.totals.totalCents, agg.lines.reduce((s, l) => s + l.amountCents, 0), 1e-6);
  });
  test('Utilities', 'SHA-256 test vectors; calendar maths are timezone-free', () => {
    eq(util.sha256Hex(util.utf8Bytes('abc')), 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'); eq(util.sha256Hex(new Uint8Array(0)), 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855');
    eq(util.dow('2026-10-02'), 5); eq(util.addMonths('2028-02-29', 12), '2029-02-28'); eq(util.daysBetween('2026-07-01', '2027-06-30'), 364);
  });

  function run() {
    return T.map(t => { const t0 = performance.now(); try { t.fn(); return { group: t.group, name: t.name, pass: true, ms: performance.now() - t0 }; } catch (e) { return { group: t.group, name: t.name, pass: false, ms: performance.now() - t0, error: e.message || String(e) }; } });
  }
  return { run, count: T.length };
})();

(() => {
  'use strict';
  const { card, btn, badge, callout, kpi, table, pageHead, icon, toast } = ui;
  const { esc, fmtNum, fmtDate } = util;
  function testsScreen(q) {
    const asAt = q.asat && util.isIsoDate(q.asat) ? q.asat : svc.today();
    const results = ui.state.testResults || (ui.state.testResults = selfTests.run());
    const failed = results.filter(r => !r.pass), groups = Array.from(new Set(results.map(r => r.group)));
    return pageHead({ title: 'Tests', sub: 'Visible checks of the calculation engine and the NEM12 parser. Quotes and bills both run through the engine tested here.', actions: btn('Run again', 'tests-run', { ic: 'refresh', kind: 'primary' }) }) +
      `<div class="kpis">${kpi('Self-tests', results.length - failed.length + ' / ' + results.length, failed.length ? `<b style="color:var(--bad)">${failed.length} failing</b>` : 'all passing')}${kpi('Engine', 'v' + engine.VERSION, 'pure functions, no storage')}</div>` +
      (failed.length ? callout('bad', `<b>${failed.length} test(s) failing.</b> Do not rely on calculated figures until these are resolved.`) : callout('good', '<b>All self-tests pass.</b>')) +
      card({
        title: 'RT6 band boundary test: just below and just above 300 kVA (live, from your tariff book)',
        actions: `<form data-submit="tests-asat" class="toolbar" style="margin:0"><label class="field" style="grid-auto-flow:column;align-items:center;gap:6px">Rates effective on <input class="in" style="width:auto" type="date" name="asat" value="${asAt}"></label><button class="btn sm" type="submit">Apply</button></form>`,
        body: ui.rt6BoundaryHtml(asAt),
      }) +
      card({
        title: 'Engine and parser self-tests', flush: true,
        body: groups.map(g => `<table class="data"><thead><tr><th colspan="3">${esc(g)}</th></tr></thead><tbody>${results.filter(r => r.group === g).map(r => `<tr class="${r.pass ? '' : 'bad'}"><td style="width:90px">${r.pass ? badge('pass', 'good', 'check') : badge('FAIL', 'bad', 'x')}</td><td>${esc(r.name)}${r.pass ? '' : `<div class="small" style="color:var(--bad)">${esc(r.error)}</div>`}</td><td class="num muted small">${fmtNum(r.ms, 1)} ms</td></tr>`).join('')}</tbody></table>`).join(''),
        footer: 'Tests use built-in fixtures (the published 2026-27 numbers), so changing a rate in the tariff book cannot make them fail or pass. Hand-calculated expectations are written independently of the engine code.',
      });
  }
  ui.act('tests-run', () => { ui.state.testResults = selfTests.run(); ui.refresh(); toast('Tests re-run.'); });
  ui.act('tests-asat', form => ui.go(`#/tests?asat=${new FormData(form).get('asat')}`));
  ui.register('tests', { title: 'Tests', nav: 'tests', render: (args, q) => testsScreen(q) });
})();
</script>
